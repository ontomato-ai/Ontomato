# PostgreSQL for local development. Called only by the product root's `pnpm dev:up`
# full-stack tool with explicit -p/-f; the account and password are local examples only.
services:
  gateway:
    environment:
      LEGACY_API_PREFIX: ontomato
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ontomato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontomato}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql
      # Reuse the deployment script's database-creation file: it creates ontomato and
      # datarag, and runs only on the first initialization of an empty volume.
      - ../deploy/initdb.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    labels:
      dev.stack.root: "${DEV_STACK_ROOT:?DEV_STACK_ROOT not set}"
      dev.stack.product: "${DEV_STACK_PRODUCT:?DEV_STACK_PRODUCT not set}"
    # TCP: the image init server does not listen on 127.0.0.1, so this stays down until
    # initdb, including the database-creation script, has finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ontomato} -d datarag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    labels:
      dev.stack.root: "${DEV_STACK_ROOT:?DEV_STACK_ROOT not set}"
      dev.stack.product: "${DEV_STACK_PRODUCT:?DEV_STACK_PRODUCT not set}"
