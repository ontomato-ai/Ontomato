name: ${COMPOSE_PROJECT_NAME:-ontomato}

# Final runnable images. Build and publish before deployment.

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ontomato
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    platform: linux/${ARCH:?ARCH not set}
    pull_policy: missing
    restart: unless-stopped
    ports:
      # Published on the loopback address only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ontomato
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./initdb.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    # TCP: the image init server does not listen on 127.0.0.1, so this stays
    # down until initdb, including the CREATE DATABASE script, has finished.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ontomato -d datarag"]
      interval: 5s
      timeout: 5s
      retries: 10

  datarag:
    image: ${DATA_ENGINE_IMAGE:-datarag-opensource:deploy-${ARCH:?ARCH not set}}
    platform: linux/${ARCH:?ARCH not set}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${DATARAG_PORT:-18087}:18087"
    env_file:
      - .env
    # Keep unset and empty optional values distinct; internal addresses are fixed here.
    environment:
      AGENT_RUNTIME_URL: http://agent-runtime:3001
      AGENT_RUNTIME_ONTOLOGY_TOKEN: ${AGENT_RUNTIME_ONTOLOGY_TOKEN:?Run the deployment configuration preparation first}
      ONTOMATO_QUERY_SERVICE_TOKEN: ${ONTOMATO_QUERY_SERVICE_TOKEN:?Run the deployment configuration preparation first}
      ONTOMATO_QUERY_SIGNING_KEY: ${ONTOMATO_QUERY_SIGNING_KEY:?Run the deployment configuration preparation first}
      ONTOMATO_QUERY_CALLBACK_URL: http://datarag:18087
      NODE_ID: ${NODE_ID:-datarag}
      TZ: ${TZ:-UTC}
      <<: *database-environment
      ONTOMATO_MODEL_RUNTIME_TOKEN: ${ONTOMATO_MODEL_RUNTIME_TOKEN:?ONTOMATO_MODEL_RUNTIME_TOKEN not set}
    volumes:
      - ./backend_data:/deploy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:18087/health', timeout=3); body=json.load(r); assert r.status == 200 and body.get('success') is True"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace period: failed checks do not count during it, and the first passing check marks
      # the service healthy. On a slow machine or a first start on an empty database DataRAG
      # can take longer than retries x interval (about 50 s); without it the service is marked
      # unhealthy and the Node app, which waits for it, does not start.
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  agent-runtime:
    image: ${AGENT_RUNTIME_IMAGE:-ontomato-agent-runtime:deploy-${ARCH:?ARCH not set}}
    platform: linux/${ARCH:?ARCH not set}
    pull_policy: missing
    restart: unless-stopped
    environment:
      <<: *database-environment
      AGENT_RUNTIME_DATABASE: ontomato
      AGENT_RUNTIME_SCHEMA: agent_runtime
      AGENT_RUNTIME_HOSTS: '[{"id":"workbench","token":"${AGENT_RUNTIME_SERVICE_TOKEN:?Run the deployment configuration preparation first}","providers":["workbench","ontology"],"publishProviders":["workbench"],"domainSkills":true},{"id":"ontology","token":"${AGENT_RUNTIME_ONTOLOGY_TOKEN:?Run the deployment configuration preparation first}","providers":["ontology"],"publishProviders":["ontology"]}]'
      # Temporary Java model configuration dependency until that owner is migrated.
      AGENT_RUNTIME_MODEL_CONFIG_URL: http://datarag:18087
      ONTOMATO_MODEL_RUNTIME_TOKEN: ${ONTOMATO_MODEL_RUNTIME_TOKEN:-}
    volumes:
      - ./agent_runtime_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
      datarag:
        condition: service_healthy

  ontomato:
    image: ${WORKBENCH_IMAGE:-ontomato:deploy-${ARCH:?ARCH not set}}
    platform: linux/${ARCH:?ARCH not set}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      <<: *database-environment
      ONTOMATO_MODEL_RUNTIME_TOKEN: ${ONTOMATO_MODEL_RUNTIME_TOKEN:?ONTOMATO_MODEL_RUNTIME_TOKEN not set}
      DATA_QUERY_BASE_URL: http://datarag:18087
      AGENT_RUNTIME_URL: http://agent-runtime:3001
      AGENT_RUNTIME_SERVICE_TOKEN: ${AGENT_RUNTIME_SERVICE_TOKEN:?Run the deployment configuration preparation first}
      ONTOMATO_QUERY_SERVICE_TOKEN: ${ONTOMATO_QUERY_SERVICE_TOKEN:?Run the deployment configuration preparation first}
      AGENT_RUNTIME_CALLBACK_URL: http://ontomato:3000
      PORT: "3000"
      NODE_ENV: production
      TZ: ${TZ:-UTC}
      ONTOLOGY_MANAGER_URL: ${ONTOLOGY_MANAGER_URL:-http://${PUBLIC_HOST:?PUBLIC_HOST not set}:${ONTOLOGY_MANAGER_PORT:-3005}}
    shm_size: "1gb"
    volumes:
      - ./frontend_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      agent-runtime:
        condition: service_healthy
      postgres:
        condition: service_healthy
      datarag:
        condition: service_healthy

  ontology-manager:
    image: ${MANAGER_IMAGE:-ontomato-ontology-manager:deploy-${ARCH:?ARCH not set}}
    platform: linux/${ARCH:?ARCH not set}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${ONTOLOGY_MANAGER_PORT:-3005}:80"
    environment:
      DATARAG_ORIGIN: http://datarag:18087
      ONTOLOGY_INITIAL_ROUTE: ${ONTOLOGY_INITIAL_ROUTE:-/playground}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      datarag:
        condition: service_healthy

volumes:
  postgres18_data:
