# Pull final images from the publication registry.
services:
  ontomato:
    image: ${WORKBENCH_IMAGE:-ghcr.io/ontomato-ai/ontomato-workbench:${ONTOMATO_VERSION:-latest}}
  datarag:
    image: ${DATA_ENGINE_IMAGE:-ghcr.io/ontomato-ai/ontomato-data-engine:${ONTOMATO_VERSION:-latest}}
  agent-runtime:
    image: ${AGENT_RUNTIME_IMAGE:-ghcr.io/ontomato-ai/ontomato-agent-runtime:${ONTOMATO_VERSION:-latest}}
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/ontomato-ai/ontomato-gateway:${ONTOMATO_VERSION:-latest}}
