# DataEngine product default configuration. This file is the only source template and is not placed inside the jar.
# Environment placeholders below read the shared .env inputs.
# If conf/application.yml is missing, startup copies this template; an existing site file is kept and read on restart.
server:
  port: 18087
  max-http-post-size: 10MB

spring:
  config:
    # Resolved from the classpath: inside the container /deploy/conf comes first on the classpath, while locally
    # conf-defaults comes first for the JVM (see the dev-override profile in pom.xml); both can resolve it.
    import: classpath:mcp-clients.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

langchain4j:
  open-ai:
    embedding-model:
      base-url: ${EMBEDDING_BASE_URL:}
      api-key: ${EMBEDDING_API_KEY:}
      model-name: ${EMBEDDING_MODEL:}
      dimensions: ${EMBEDDING_DIMENSIONS:2048}
      timeout: PT300S
      log-requests: true
      log-responses: false

ontomato:
  data-engine:
    service-id: ${SERVICE_ID:}
    node-id: ${NODE_ID:}
    cardBase-url: ${CARD_BASE_URL:}
    knowledge_maxResult: 10
    toolsdatamaxsize: 20
    toolAndPythonRetry: 3
    data-adapter: ${DATA_ADAPTER:postgresql}
    production-env-url: ${PRODUCTION_ENV_URL:}
    production-env-user: ${PRODUCTION_ENV_USER:}
    production-env-pwd: ${PRODUCTION_ENV_PASSWORD:}
    jdbc:
      url: ${DATA_ENGINE_JDBC_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/datarag}
      username: ${POSTGRES_USER:}
      password: ${POSTGRES_PASSWORD:}
      driver-class-name: ${DATA_ENGINE_JDBC_DRIVER:org.postgresql.Driver}
    models:
      - name: default
        base-url: ${LLM_BASE_URL:}
        api-keys: ${LLM_API_KEY:}
        model-name: ${LLM_MODEL:}
        timeout: PT300S
        temperature: 0.0
        top-p: 0.1
        log-requests: true
        log-responses: true
    agents:
      query:
        model: default
      coding:
        model: default
        skill-dir: ""
      general:
        model: default
      diagnosis:
        model: default
      knowledgeGovernance:
        model: default

logging:
  level:
    dev.langchain4j: DEBUG
    org.springframework: WARN
