<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {{head}}
  <style>[v-cloak]{display:none}main{padding:20px}</style>
</head>
<body>
<main id="app" v-cloak>
  <sdk-input v-model="assetId" placeholder="Existing product asset ID"></sdk-input>
  <sdk-button @click="revision++">Reload shared asset</sdk-button>
  <product-asset v-if="assetId" :context="context" :asset-id="assetId" :revision="revision"></product-asset>
</main>
<script type="module">
  import {createApp,ref} from 'vue';
  import {connectAppContext,ProductAsset} from '@ontomato/sdk';
  import {SdkButton,SdkInput} from '@ontomato/sdk/ui';
  const context=await connectAppContext();
  createApp({components:{ProductAsset,SdkButton,SdkInput},setup:()=>({context,assetId:ref(''),revision:ref(0)})})
    .use(context).mount('#app');
</script>
</body>
</html>
