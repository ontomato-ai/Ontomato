<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic page</title>
  {{head}}
  <style>
    [v-cloak] { display: none; }
    .page { display: grid; gap: 16px; padding: 16px; }
  </style>
</head>
<body>
  <!--
    The platform context, a form built from Element Plus, a chart in the platform's chart theme, a Markdown text, a CSV
    text in the code editor previewed as a table, and an HTML document in a sandboxed frame. The chart, the text, the
    editor and the table follow the platform's light and dark themes.
  -->
  <div id="app" class="page" v-cloak>
    <el-card>
      <template #header>Platform context</template>
      <el-descriptions :column="1" border>
        <el-descriptions-item label="User">{{ user?.userName ?? "No sign-in (open-source edition)" }}</el-descriptions-item>
        <el-descriptions-item label="Language">{{ locale }}</el-descriptions-item>
        <el-descriptions-item label="Theme">{{ theme }}</el-descriptions-item>
      </el-descriptions>
      <el-button style="margin-top: 12px" @click="openMetricViews">Open the platform's Metric Views</el-button>
    </el-card>

    <el-card>
      <template #header>Element Plus</template>
      <el-form :model="form" label-width="120px" @submit.prevent="submit">
        <el-form-item label="Name">
          <el-input v-model="form.name" placeholder="Any text"></el-input>
        </el-form-item>
        <el-form-item label="Date">
          <el-date-picker v-model="form.date" type="date"></el-date-picker>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" native-type="submit">Show a message</el-button>
        </el-form-item>
      </el-form>
    </el-card>

    <el-card>
      <template #header>Chart (sample values)</template>
      <e-chart :option="option" :theme="chartTheme" :height="280"></e-chart>
    </el-card>
    <el-card>
      <template #header>Markdown</template>
      <markdown-view :content="notes"></markdown-view>
    </el-card>

    <el-card>
      <template #header>Code and table (edit the CSV: the table follows)</template>
      <code-editor v-model="csv" language="text" :min-height="120"></code-editor>
      <table-preview :table="table" :page-size="5" style="margin-top: 12px"></table-preview>
    </el-card>

    <el-card>
      <template #header>HTML document</template>
      <html-preview :html="report" sandbox="" title="Sample document" style="height: 120px"></html-preview>
    </el-card>
  </div>

  <script type="module">
    import { computed, createApp, reactive, ref } from "vue";
    import ElementPlus, { ElMessage } from "element-plus";
    import { createAppContext } from "@ontomato/sdk";
    import { EChart } from "@ontomato/sdk/chart";
    import { MarkdownView } from "@ontomato/sdk/markdown";
    import { CodeEditor } from "@ontomato/sdk/code";
    import { HtmlPreview, TablePreview, parseCsv } from "@ontomato/sdk/preview";

    const context = createAppContext();

    // The chart draws whatever option it is given; this one never changes, so it is a plain object. The categories are
    // long on purpose: the chart theme itself keeps their labels from overlapping, so the option needs no axis rules.
    const option = {
      tooltip: { trigger: "axis" },
      xAxis: { type: "category", data: ["East", "North", "South", "West", "Central China region", "Overseas branches"] },
      yAxis: { type: "value" },
      series: [{ type: "bar", name: "Sample", data: [12, 20, 15, 8, 17, 6] }],
    };

    const notes = [
      "## How this page is made",
      "",
      "- The chart is `<e-chart>`, drawn in `context.chartTheme`.",
      "- This text is `<markdown-view>`.",
      "",
      "Switch the platform between its light and dark themes: both follow.",
    ].join("\n");

    // CSV as it is written: a quoted field may hold the delimiter.
    const SAMPLE_CSV = [
      "region,orders,cities",
      'East,12,"Shanghai, Hangzhou"',
      "North,20,Beijing",
      "South,15,Guangzhou",
      "West,8,Chengdu",
    ].join("\n");

    // A document of its own: with an empty sandbox its styles apply and nothing in it runs.
    const report = [
      "<!doctype html>",
      '<body style="margin: 12px; font-family: sans-serif; background: #fff; color: #303133">',
      "<h3>Sample document</h3>",
      "<p>Shown in a frame, apart from the page.</p>",
      "</body>",
    ].join("\n");

    createApp({
      components: { EChart, MarkdownView, CodeEditor, TablePreview, HtmlPreview },
      setup() {
        const form = reactive({ name: "", date: null });
        const csv = ref(SAMPLE_CSV);
        return {
          user: context.user,
          locale: context.locale,
          theme: context.theme,
          chartTheme: context.chartTheme,
          option,
          notes,
          csv,
          table: computed(() => parseCsv(csv.value)),
          report,
          form,
          submit: () => ElMessage.success(`Hello, ${form.name || "app"}`),
          openMetricViews: () => context.navigate("/ontology/assets/metrics"),
        };
      },
    }).use(ElementPlus).use(context).mount("#app");
  </script>
</body>
</html>
