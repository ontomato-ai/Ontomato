<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetricView and Action</title>
  {{head}}
  <style>
    [v-cloak] { display: none; }
    body { margin: 0; background: var(--el-bg-color-page); color: var(--el-text-color-primary); }
    .page { display: grid; gap: 16px; padding: 16px; }
    .chart { height: 300px; margin-top: 12px; }
  </style>
</head>
<body>
  <!--
    Reads a published MetricView into a table and a chart, executes an Action and reads the MetricView again.
    A real app names its MetricView and Action in the page; this example asks for them, so it runs against any domain.
    It shows MetricViews whose result is a list of row objects.
  -->
  <div id="app" class="page" v-cloak>
    <el-card>
      <template #header>MetricView</template>
      <el-form label-width="160px" @submit.prevent="read">
        <el-form-item label="MetricView id">
          <el-input v-model="metricViewId" placeholder="The id of a published MetricView"></el-input>
        </el-form-item>
        <el-form-item label="Parameters (JSON)">
          <el-input v-model="parametersText" type="textarea" :rows="2"></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" native-type="submit" :disabled="!metricViewId.trim()">Read</el-button>
        </el-form-item>
      </el-form>
    </el-card>

    <metric-view-data v-if="binding" :metric-view-id="binding.id" :parameters="binding.parameters"
      v-slot="{ data, loading, error, reload }">
      <el-card>
        <template #header>Rows</template>
        <el-alert v-if="error" type="error" :title="error.message" :closable="false" show-icon></el-alert>
        <el-alert v-else-if="data !== undefined && !Array.isArray(data)" type="warning" :closable="false" show-icon
          title="This MetricView does not return a list of rows, which is what this example shows."></el-alert>
        <template v-else>
          <el-table v-loading="loading" :data="data ?? []" max-height="320" border>
            <el-table-column v-for="column in columnsOf(data)" :key="column" :prop="column" :label="column">
            </el-table-column>
          </el-table>
          <el-form inline style="margin-top: 12px">
            <el-form-item label="Category">
              <el-select v-model="x" placeholder="Column" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="Value">
              <el-select v-model="y" placeholder="Numeric column" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
          </el-form>
          <rows-chart v-if="x && y" :rows="data ?? []" :x="x" :y="y" :theme="theme"></rows-chart>
        </template>
      </el-card>

      <el-card>
        <template #header>Action</template>
        <el-form label-width="160px" @submit.prevent="execute(reload)">
          <el-form-item label="Action id">
            <el-input v-model="actionId" placeholder="The id of an Action you may execute"></el-input>
          </el-form-item>
          <el-form-item label="Parameters (JSON)">
            <el-input v-model="actionParametersText" type="textarea" :rows="3"
              placeholder='Every declared parameter with its typed value, e.g. {"orderId": "SO-1001", "quantity": 4}'></el-input>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" native-type="submit" :loading="executing" :disabled="!actionId.trim()">
              Execute, then read the MetricView again
            </el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </metric-view-data>
  </div>

  <script type="module">
    import { createApp, onBeforeUnmount, onMounted, ref, watch } from "vue";
    import ElementPlus, { ElMessage } from "element-plus";
    import * as echarts from "echarts";
    import { createAppContext } from "@ontomato/sdk";

    const context = createAppContext();

    // A bar chart of two chosen columns; the page decides what to plot, the chart only draws it.
    const RowsChart = {
      props: {
        rows: { type: Array, required: true },
        x: { type: String, required: true },
        y: { type: String, required: true },
        theme: { type: String, required: true },
      },
      template: `<div ref="element" class="chart"></div>`,
      setup(props) {
        const element = ref(null);
        let chart = null;
        const option = () => ({
          backgroundColor: "transparent",
          tooltip: { trigger: "axis" },
          xAxis: { type: "category", data: props.rows.map((row) => row[props.x]) },
          yAxis: { type: "value" },
          series: [{ type: "bar", name: props.y, data: props.rows.map((row) => row[props.y]) }],
        });
        const draw = () => {
          chart?.dispose();
          chart = echarts.init(element.value, props.theme === "dark" ? "dark" : undefined);
          chart.setOption(option());
        };
        const resize = new ResizeObserver(() => chart?.resize());
        onMounted(() => {
          draw();
          resize.observe(element.value);
        });
        watch(() => props.theme, draw);
        watch(() => [props.rows, props.x, props.y], () => chart.setOption(option(), true));
        onBeforeUnmount(() => {
          resize.disconnect();
          chart?.dispose();
        });
        return { element };
      },
    };

    function parseJson(text, what) {
      try {
        return JSON.parse(text.trim() || "{}");
      } catch (error) {
        ElMessage.error(`${what} are not valid JSON: ${error.message}`);
        return null;
      }
    }

    createApp({
      components: { RowsChart },
      setup() {
        const metricViewId = ref("");
        const parametersText = ref("{}");
        const binding = ref(null);
        const x = ref("");
        const y = ref("");
        const actionId = ref("");
        const actionParametersText = ref("{}");
        const executing = ref(false);

        function read() {
          const parameters = parseJson(parametersText.value, "MetricView parameters");
          if (!parameters) return;
          x.value = y.value = "";
          binding.value = { id: metricViewId.value.trim(), parameters };
        }

        async function execute(reload) {
          const parameters = parseJson(actionParametersText.value, "Action parameters");
          if (!parameters) return;
          executing.value = true;
          try {
            await context.actions.execute({ id: actionId.value.trim(), parameters });
            ElMessage.success("Action executed");
            await reload();
          } catch (error) {
            ElMessage.error(error.message);
          } finally {
            executing.value = false;
          }
        }

        const columnsOf = (data) => (Array.isArray(data) && data.length ? Object.keys(data[0]) : []);

        return {
          theme: context.theme,
          metricViewId, parametersText, binding, x, y, actionId, actionParametersText, executing,
          read, execute, columnsOf,
        };
      },
    }).use(ElementPlus).use(context).mount("#app");
  </script>
</body>
</html>
