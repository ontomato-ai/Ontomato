<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetricView and Action</title>
  {{head}}
  <style>
    [v-cloak] { display: none; }
    .page { display: grid; gap: 16px; padding: 16px; }
    .hint { margin: 0 0 12px; color: var(--el-text-color-secondary); font-size: 13px; }
    .el-table .selected-row > td.el-table__cell { background-color: var(--el-color-primary-light-9); }
  </style>
</head>
<body>
  <!--
    Reads a published MetricView into a table and a chart, executes an Action through its form and reads the MetricView
    again: the Action's card is outside <metric-view-data>, so the script calls reload() on its template ref. A click on
    a row selects it as a business object and tells the platform with setPageContext; a second click clears it. The
    chart is <e-chart> in the platform's chart theme, and the Action's form is <form-fields>: the data engine says which
    fields the Action has and turns what they hold into typed parameters.
    A real app names its MetricView, Action and object class in the page; this example asks for them, so it runs against
    any domain. A result that is a list of row objects fills the table and the chart; any other result shows as
    read-only JSON in <code-editor>.
  -->
  <div id="app" class="page" v-cloak>
    <el-card>
      <template #header>MetricView</template>
      <el-form label-width="160px" @submit.prevent="read">
        <el-form-item label="MetricView id">
          <el-input v-model="metricViewId" placeholder="The id of a published MetricView"></el-input>
        </el-form-item>
        <el-form-item label="Parameters (JSON)">
          <code-editor v-model="parametersText" language="json" :min-height="60" style="width: 100%"></code-editor>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" native-type="submit" :disabled="!metricViewId.trim()">Read</el-button>
        </el-form-item>
      </el-form>
    </el-card>

    <metric-view-data v-if="binding" ref="metricView" :metric-view-id="binding.id" :parameters="binding.parameters"
      v-slot="{ data, loading, error }">
      <el-card>
        <template #header>Result</template>
        <el-alert v-if="error" type="error" :title="error.message" :closable="false" show-icon></el-alert>
        <code-editor v-else-if="data !== undefined && !Array.isArray(data)" :model-value="JSON.stringify(data, null, 2)"
          language="json" readonly :min-height="120"></code-editor>
        <template v-else>
          <el-form inline>
            <el-form-item label="Object class">
              <el-input v-model="className" placeholder="The rows' ontology class" style="width: 180px"></el-input>
            </el-form-item>
            <el-form-item label="Key">
              <el-select v-model="keyColumn" placeholder="Primary key column" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="Name">
              <el-select v-model="nameColumn" placeholder="Column readers know a row by" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
          </el-form>
          <p class="hint">
            {{ selectable ? "Click a row to select it, and click it again to clear the selection."
              : "Name the class and the key and name columns to select rows." }}
          </p>
          <el-table v-loading="loading" :data="data ?? []" max-height="320" border
            :row-class-name="rowClass" @row-click="toggleRow">
            <el-table-column v-for="column in columnsOf(data)" :key="column" :prop="column" :label="column">
            </el-table-column>
          </el-table>
          <el-form inline style="margin-top: 12px">
            <el-form-item label="Category">
              <el-select v-model="x" placeholder="Column" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
            <el-form-item label="Value">
              <el-select v-model="y" placeholder="Numeric column" style="width: 180px">
                <el-option v-for="column in columnsOf(data)" :key="column" :label="column" :value="column"></el-option>
              </el-select>
            </el-form-item>
          </el-form>
          <rows-chart v-if="x && y" :rows="data ?? []" :x="x" :y="y"></rows-chart>
        </template>
      </el-card>
    </metric-view-data>

    <!-- Outside <metric-view-data>: after the Action, the script reads the MetricView again through its ref. -->
    <el-card v-if="binding">
      <template #header>Action</template>
      <el-form label-width="160px" @submit.prevent="openAction">
        <el-form-item label="Action id">
          <el-input v-model="actionId" placeholder="The id of an Action you may execute"></el-input>
        </el-form-item>
        <el-form-item>
          <el-button native-type="submit" :disabled="!actionId.trim()">Open its form</el-button>
        </el-form-item>
      </el-form>
      <el-form v-if="action" label-position="top" @submit.prevent="execute">
        <form-fields :fields="action.fields" :values="action.values" :errors="action.errors" :disabled="executing"
          choose-placeholder="Choose" @input="(key, value) => (action.values[key] = value)"
          @choose="(field, value) => (action.values[field.key] = value)">
        </form-fields>
        <el-button type="primary" native-type="submit" :loading="executing">
          Execute, then read the MetricView again
        </el-button>
      </el-form>
    </el-card>
  </div>

  <script type="module">
    import { computed, createApp, ref, watch } from "vue";
    import ElementPlus, { ElMessage } from "element-plus";
    import { createAppContext } from "@ontomato/sdk";
    import { EChart } from "@ontomato/sdk/chart";
    import { FormFields, formFieldKey } from "@ontomato/sdk/form";
    import { CodeEditor } from "@ontomato/sdk/code";

    const context = createAppContext();
    // The page's name as its reader sees it: with the selected row, it is what the platform's agent is told they look at.
    const PAGE = "MetricView rows";
    context.setPageContext({ page: PAGE, selection: null });

    // A bar chart of two chosen columns: the page builds the option from the rows, <e-chart> draws it in the platform's
    // chart theme and follows its light and dark themes.
    const RowsChart = {
      components: { EChart },
      props: {
        rows: { type: Array, required: true },
        x: { type: String, required: true },
        y: { type: String, required: true },
      },
      template: `<e-chart :option="option" :theme="chartTheme" :height="300" style="margin-top: 12px"></e-chart>`,
      setup(props) {
        const option = computed(() => ({
          tooltip: { trigger: "axis" },
          xAxis: { type: "category", data: props.rows.map((row) => row[props.x]) },
          yAxis: { type: "value" },
          series: [{ type: "bar", name: props.y, data: props.rows.map((row) => row[props.y]) }],
        }));
        return { option, chartTheme: context.chartTheme };
      },
    };

    function parseJson(text, what) {
      try {
        return JSON.parse(text.trim() || "{}");
      } catch (error) {
        ElMessage.error(`${what} are not valid JSON: ${error.message}`);
        return null;
      }
    }

    createApp({
      components: { RowsChart, FormFields, CodeEditor },
      setup() {
        const metricViewId = ref("");
        const parametersText = ref("{}");
        const binding = ref(null);
        // The <metric-view-data> on the page, filled through ref="metricView": the same state its slot draws from.
        const metricView = ref(null);
        const x = ref("");
        const y = ref("");
        const actionId = ref("");
        // The open Action's form: its fields, what they hold and the message each shows.
        const action = ref(null);
        const executing = ref(false);

        // The selected row as a business object: its class, its primary key and the name readers know it by.
        const className = ref("");
        const keyColumn = ref("");
        const nameColumn = ref("");
        const selection = ref(null);
        const selectable = computed(() => Boolean(className.value.trim() && keyColumn.value && nameColumn.value));
        function select(value) {
          selection.value = value;
          context.setPageContext({ page: PAGE, selection: value });
        }
        function toggleRow(row) {
          if (!selectable.value) return;
          const primaryKey = String(row[keyColumn.value]);
          // Every field is text; a row without a name is known by its key.
          const name = String(row[nameColumn.value] ?? "") || primaryKey;
          select(selection.value?.primaryKey === primaryKey ? null : { className: className.value.trim(), primaryKey, name });
        }
        // The key names the selected row, so it stays selected when the rows are read again.
        const rowClass = ({ row }) => (selection.value?.primaryKey === String(row[keyColumn.value]) ? "selected-row" : "");
        // Another class or other columns no longer name the selected object.
        watch([className, keyColumn, nameColumn], () => {
          if (selection.value) select(null);
        });

        function read() {
          const parameters = parseJson(parametersText.value, "MetricView parameters");
          if (!parameters) return;
          x.value = y.value = keyColumn.value = nameColumn.value = "";
          binding.value = { id: metricViewId.value.trim(), parameters };
        }

        // The data engine declares the Action's fields and the text they start with.
        async function openAction() {
          const id = actionId.value.trim();
          try {
            const form = await context.actions.form({ id });
            action.value = { id, fields: form.fields, values: { ...form.values }, errors: {} };
          } catch (error) {
            ElMessage.error(error.message);
          }
        }

        // What the fields hold comes back as field errors, or as the typed parameters the Action executes with.
        async function execute() {
          const current = action.value;
          executing.value = true;
          try {
            const answer = await context.actions.form({ id: current.id, values: current.values });
            current.errors = Object.fromEntries(answer.errors.map((error) => [formFieldKey(error.field, "/values/"), error.message]));
            if (!answer.parameters) return;
            await context.actions.execute({ id: current.id, parameters: answer.parameters });
            ElMessage.success("Action executed");
            await metricView.value.reload();
          } catch (error) {
            ElMessage.error(error.message);
          } finally {
            executing.value = false;
          }
        }

        const columnsOf = (data) => (Array.isArray(data) && data.length ? Object.keys(data[0]) : []);

        return {
          metricViewId, parametersText, binding, metricView, x, y, actionId, action, executing,
          className, keyColumn, nameColumn, selectable,
          read, openAction, execute, columnsOf, toggleRow, rowClass,
        };
      },
    }).use(ElementPlus).use(context).mount("#app");
  </script>
</body>
</html>
