<!--
  The small panel Q: one task's summary, and nothing else. Its task is whatever the address it was opened at named.

  A fragment, as P's is: the host's document is the one with html, head and body in it.
-->
<style>
  [v-cloak] { display: none; }
  .panel { padding: 12px; }
</style>
<div id="app" class="panel" v-cloak>
  <sdk-card shadow="never">
    <template #header>Task</template>
    <projection slot="summary"></projection>
  </sdk-card>
</div>
