<!--
  Panel P: the reader's scheduled tasks beside the chosen one — its summary, and once a task is chosen its form and the
  button that runs it now. On a narrow panel the task goes under the list.

  A fragment: the host's document is the one with html, head and body in it.
-->
<style>
  [v-cloak] { display: none; }
  .trial { display: flex; flex-wrap: wrap; gap: var(--spacing-sm, 8px); }
  .tasks { flex: 1 1 18rem; min-width: 0; }
  .task { flex: 2 1 24rem; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-sm, 8px); }
</style>
<div id="app" class="trial" v-cloak>
  <div class="tasks">
    <projection slot="tasks"></projection>
  </div>
  <section class="task">
    <projection slot="summary"></projection>
    <template v-if="chosen">
      <projection slot="form"></projection>
      <projection slot="run"></projection>
    </template>
  </section>
</div>
