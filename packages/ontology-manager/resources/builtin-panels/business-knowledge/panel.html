<style>
  .bk { display: flex; flex-direction: column; gap: var(--spacing-md); min-height: 0; }
  .bk-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-md); }
  .bk-head-spacer { flex: 1; }
  .bk-body {
    display: grid;
    grid-template-columns: clamp(26rem, 42%, 29rem) minmax(0, 1fr);
    height: max(24rem, calc(100vh - 15rem));
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--el-bg-color);
  }
  .bk-list {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: var(--spacing-md);
    border-right: 1px solid var(--ui-divider);
  }
  .bk-detail {
    display: flex;
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    gap: var(--spacing-md);
    overflow-y: auto;
    padding: var(--spacing-lg) var(--spacing-lg) 0;
  }
  .bk-back { display: none; }
  .bk-detail-actions, .bk-form-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--spacing-sm);
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    padding: var(--spacing-sm) 0 var(--spacing-lg);
    border-top: 1px solid var(--ui-divider);
    background: var(--el-bg-color);
  }
  .bk.narrow .bk-body { grid-template-columns: minmax(0, 1fr); }
  .bk.narrow .bk-list { border-right: 0; }
  .bk.narrow.detail-open .bk-list { display: none; }
  .bk.narrow:not(.detail-open) .bk-detail { display: none; }
  .bk.narrow .bk-back { display: inline-flex; align-items: center; gap: var(--spacing-xs); align-self: flex-start; padding: 0; border: 0; color: var(--brand-link); background: transparent; cursor: pointer; font-size: var(--text-base); }
</style>
<div id="app">
  <section class="bk" :class="{ narrow, 'detail-open': detailOpen }" ref="root">
    <div class="bk-head">
      <projection slot="governance"></projection>
      <span class="bk-head-spacer"></span>
      <projection slot="tabs"></projection>
    </div>
    <div class="bk-body">
      <div class="bk-list">
        <projection slot="list" @update:selected="onUserSelect">
          <template #batch-actions>
            <projection slot="approveAll"></projection>
            <projection slot="deleteAll"></projection>
          </template>
        </projection>
      </div>
      <div class="bk-detail">
        <button type="button" class="bk-back" @click="detailOpen = false">‹ {{ t("panel.backToList") }}</button>
        <projection slot="detail" v-show="mode === 'view'"></projection>
        <div class="bk-detail-actions" v-show="mode === 'view'" v-if="selected">
          <projection slot="approve"></projection>
          <el-button @click="openEdit">{{ t("panel.edit") }}</el-button>
          <projection slot="remove"></projection>
        </div>
        <projection slot="form" ref="formProj" v-show="editing" @saved="onSaved" @discarded="onDiscarded"></projection>
        <div class="bk-form-actions" v-show="editing">
          <el-button @click="cancelEdit">{{ t("panel.cancel") }}</el-button>
          <el-button type="primary" :disabled="formBusy" @click="saveForm">{{ t("panel.save") }}</el-button>
        </div>
      </div>
    </div>
  </section>
</div>
