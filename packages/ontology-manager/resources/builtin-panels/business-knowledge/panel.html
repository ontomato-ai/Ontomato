<style>
  .bk { display: flex; flex-direction: column; gap: 0.75rem; min-height: 0; height: 100%; }
  .bk-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
  .bk-head-spacer { flex: 1; }
  .bk-body { display: grid; grid-template-columns: minmax(17.5rem, 24rem) minmax(0, 1fr); min-height: 0; flex: 1; overflow: hidden; border: 1px solid var(--el-border-color, #dcdfe6); border-radius: 0.5rem; }
  .bk-list { min-width: 0; overflow-y: auto; border-right: 1px solid var(--el-border-color-light, #e4e7ed); }
  .bk-detail { display: flex; min-width: 0; flex-direction: column; gap: 0.75rem; overflow-y: auto; padding: 1rem; }
  .bk-back { display: none; }
  .bk-detail-actions, .bk-form-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; margin-top: auto; }
  .bk.narrow .bk-body { grid-template-columns: minmax(0, 1fr); }
  .bk.narrow .bk-list { border-right: 0; }
  .bk.narrow.detail-open .bk-list { display: none; }
  .bk.narrow:not(.detail-open) .bk-detail { display: none; }
  .bk.narrow .bk-back { display: inline-flex; align-items: center; gap: 0.25rem; align-self: flex-start; padding: 0; border: 0; color: var(--el-color-primary, #409eff); background: transparent; cursor: pointer; font-size: 0.875rem; }
</style>
<div id="app">
  <section class="bk" :class="{ narrow, 'detail-open': detailOpen }" ref="root">
    <div class="bk-head">
      <projection slot="governance"></projection>
      <el-button type="primary" @click="newRecord">{{ t("panel.new") }}</el-button>
      <template v-if="checked.length">
        <span class="bk-batch-count">{{ t("panel.checkedCount", { count: checked.length }) }}</span>
        <projection slot="approveAll"></projection>
        <projection slot="deleteAll"></projection>
        <el-button text @click="clearChecked">{{ t("panel.clearChecked") }}</el-button>
      </template>
      <span class="bk-head-spacer"></span>
      <projection slot="tabs"></projection>
    </div>
    <div class="bk-body">
      <div class="bk-list">
        <projection slot="list" @update:selected="onUserSelect"></projection>
      </div>
      <div class="bk-detail">
        <button type="button" class="bk-back" @click="detailOpen = false">‹ {{ t("panel.backToList") }}</button>
        <projection slot="detail" v-show="mode === 'view'"></projection>
        <div class="bk-detail-actions" v-show="mode === 'view'" v-if="selected">
          <projection slot="approve"></projection>
          <el-button @click="openEdit">{{ t("panel.edit") }}</el-button>
          <projection slot="remove"></projection>
        </div>
        <projection slot="form" ref="formProj" v-show="mode === 'edit'" @saved="onSaved" @discarded="onDiscarded"></projection>
        <div class="bk-form-actions" v-show="mode === 'edit'">
          <el-button @click="cancelEdit">{{ t("panel.cancel") }}</el-button>
          <el-button type="primary" :disabled="formBusy" @click="saveForm">{{ t("panel.save") }}</el-button>
        </div>
      </div>
    </div>
  </section>
</div>
