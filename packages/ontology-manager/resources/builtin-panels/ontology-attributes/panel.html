<style>
  .attrs-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: attrs-page / inline-size;
  }
  .attrs-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .attrs-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .attrs-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .attrs-toolbar .attrs-search {
    width: 260px;
    max-width: 100%;
  }
  .attrs-toolbar .attrs-owner {
    width: 220px;
    max-width: 100%;
  }
  .attrs-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .attrs-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }
  .attrs-table-host {
    margin-top: var(--spacing-lg);
    min-width: 0;
  }
  .attrs-table-host .sdk-object-list {
    height: auto;
    gap: 0;
  }
  .attrs-table-host .sdk-object-list-table td:first-child .sdk-object-list-cell-main {
    color: var(--sdk-text-color-primary);
    font-weight: var(--font-semibold);
  }

  /* Inline attribute editor inside ObjectList #row-detail. */
  .attrs-row-editor {
    padding: var(--spacing-lg);
    background: var(--sdk-fill-color-lighter, var(--ui-fill-quaternary));
  }
  .attrs-row-editor .sdk-owner-form,
  .attrs-row-editor .sdk-owner-form-inner,
  .attrs-create-body .sdk-owner-form,
  .attrs-create-body .sdk-owner-form-inner {
    height: auto;
  }
  .attrs-row-editor .sdk-owner-form-body,
  .attrs-create-body .sdk-owner-form-body {
    overflow: visible;
  }
  .attrs-row-editor .sdk-owner-form-actions {
    border-top: 0;
    background: transparent;
    padding-block: var(--spacing-sm) 0;
    margin-block-start: var(--spacing-sm);
    flex-wrap: wrap;
  }
  .attrs-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }
  .attrs-switches .sdk-object-form-fields {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-sm) var(--spacing-xl, 24px);
    align-items: flex-start;
  }
  .attrs-switches .sdk-object-form-fields > * {
    flex: 0 1 auto;
    min-width: 110px;
  }
  .attrs-create-switches .sdk-object-form-fields {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--spacing-md);
    align-items: start;
  }
  .attrs-row-delete {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    margin-inline-end: auto;
  }
  .attrs-delete-reason {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }
  .attrs-unsaved {
    color: var(--sdk-color-warning);
    font-size: var(--text-sm);
  }

  @container attrs-page (max-width: 560px) {
    .attrs-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .attrs-toolbar .attrs-search,
    .attrs-toolbar .attrs-owner {
      width: 100%;
    }
    .attrs-create-switches .sdk-object-form-fields {
      grid-template-columns: 1fr;
    }
  }
</style>
<div id="app">
  <section ref="rootRef" class="attrs-page">
    <page-header :title="t('panel.name')" :description="t('attr.description')">
      <template #actions>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="attrs-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>{{ t("attr.command.create") }}</span>
        </sdk-button>
      </template>
    </page-header>
    <div class="attrs-catalog">
      <div class="attrs-toolbar">
        <sdk-input
          class="attrs-search"
          v-model="search"
          :placeholder="t('attr.search')"
          :aria-label="t('attr.search')"
          clearable
        >
          <template #prefix>
            <svg class="attrs-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          </template>
        </sdk-input>
        <div class="attrs-owner">
          <projection slot="ownerPicker"></projection>
        </div>
        <span v-if="countText" class="attrs-count">{{ countText }}</span>
      </div>
      <div class="attrs-table-host">
        <projection
          slot="attributes"
          :columns="attributeColumns"
          @navigate="openOwner"
          @clear-filters="clearFilters"
        >
          <template #row-detail="{ ref: attrRef }">
            <row-target-sync :target="attrRef" class="attrs-row-editor">
              <projection :key="attrRef.primaryKey" slot="attributeRowForm" :inputs="{ target: attrRef }">
                <template #default>
                  <object-form-fields :fields="['/showName', '/attrDesc']"></object-form-fields>
                  <div class="attrs-switches">
                    <object-form-fields :fields="['/enable', '/businessKey', '/primaryKey']"></object-form-fields>
                  </div>
                </template>
                <template #actions="{ saving, asking, canSettle, changedCount, save, discard }">
                  <row-delete-button :disabled="saving" :label="t('attr.delete')"></row-delete-button>
                  <span v-if="canSettle" class="attrs-unsaved" role="status">{{ t("attr.unsaved", { count: changedCount }) }}</span>
                  <sdk-button v-if="canSettle" :disabled="saving || asking" @click="discard()">{{ t("attr.discard") }}</sdk-button>
                  <sdk-button type="primary" :loading="saving" :disabled="!canSettle || asking" @click="save()">
                    {{ t("attr.save") }}
                  </sdk-button>
                </template>
              </projection>
            </row-target-sync>
          </template>
        </projection>
      </div>
    </div>

    <!-- Create attribute dialog (owner class stays freely selectable from the catalog). -->
    <sdk-dialog v-model="createDialog" :title="t('attr.creating')" :width="narrow ? '94%' : '540px'" append-to-body destroy-on-close>
      <div class="attrs-create-body">
        <projection v-if="createDialog" slot="form" @saved="onSaved" @discarded="onDiscarded" @cancel="cancelCreate">
          <template #default>
            <object-form-fields :fields="['/className', '/name', '/type', '/showName', '/attrDesc']"></object-form-fields>
            <div class="attrs-create-switches">
              <object-form-fields :fields="['/enable', '/businessKey', '/primaryKey']"></object-form-fields>
            </div>
          </template>
        </projection>
      </div>
    </sdk-dialog>
  </section>
</div>
