<style>
  .attrs-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: attrs-page / inline-size;
  }
  .attrs-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .attrs-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) var(--page-content-gap);
  }
  .attrs-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .attrs-toolbar .attrs-search {
    width: 260px;
    max-width: 100%;
  }
  .attrs-toolbar .attrs-owner {
    width: 220px;
    max-width: 100%;
  }
  .attrs-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .attrs-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }
  .attrs-table-host {
    margin-top: var(--spacing-lg);
    min-width: 0;
  }
  .attrs-table-host .sdk-object-list {
    height: auto;
    gap: 0;
  }
  .attrs-table-host .sdk-object-list-table td:first-child .sdk-object-list-cell-main {
    color: var(--sdk-text-color-primary);
    font-weight: var(--font-semibold);
  }
  .attrs-detail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
  }
  .attrs-detail-body {
    display: grid;
    grid-template-columns: minmax(320px, 1.25fr) minmax(260px, 0.75fr);
    gap: var(--page-content-gap);
    padding: var(--page-content-gap) var(--page-gutter);
    align-items: start;
  }
  .attrs-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--page-section-padding, var(--spacing-lg));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .attrs-card h2 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .attrs-form-wrap,
  .attrs-owner-card {
    margin-top: var(--spacing-lg);
  }
  .attrs-owner-note {
    margin-top: var(--spacing-md);
  }
  .attrs-form-wrap .sdk-owner-form,
  .attrs-form-wrap .sdk-owner-form-inner,
  .attrs-create-body .sdk-owner-form,
  .attrs-create-body .sdk-owner-form-inner {
    height: auto;
  }
  .attrs-form-wrap .sdk-owner-form-body,
  .attrs-create-body .sdk-owner-form-body {
    overflow: visible;
  }
  .attrs-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }
  .attrs-note {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .attrs-failure {
    color: var(--sdk-color-danger-text);
  }
  .attrs-missing {
    padding: var(--spacing-2xl) var(--page-gutter);
  }

  @container attrs-page (max-width: 850px) {
    .attrs-detail-body {
      grid-template-columns: minmax(0, 1fr);
      padding-block: var(--spacing-md) var(--page-content-gap);
    }
  }
  @container attrs-page (max-width: 560px) {
    .attrs-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .attrs-toolbar .attrs-search,
    .attrs-toolbar .attrs-owner {
      width: 100%;
    }
  }
</style>
<div id="app">
  <section ref="rootRef" class="attrs-page">
    <template v-if="!selectedKey">
      <page-header :title="t('panel.name')" :description="t('attr.description')">
        <template #actions>
          <sdk-button text :aria-label="t('attr.refresh')" :title="t('attr.refresh')" @click="refresh">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </sdk-button>
          <sdk-button type="primary" :disabled="creating" @click="startCreate">
            <svg class="attrs-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span>{{ t("attr.command.create") }}</span>
          </sdk-button>
        </template>
      </page-header>
      <div class="attrs-catalog">
        <div class="attrs-toolbar">
          <sdk-input
            class="attrs-search"
            v-model="search"
            :placeholder="t('attr.search')"
            :aria-label="t('attr.search')"
            clearable
          >
            <template #prefix>
              <svg class="attrs-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
            </template>
          </sdk-input>
          <div class="attrs-owner">
            <projection slot="ownerPicker"></projection>
          </div>
          <span v-if="countText" class="attrs-count">{{ countText }}</span>
        </div>
        <div class="attrs-table-host">
          <projection
            slot="attributes"
            @choose="onChoose"
            @navigate="openOwner"
            @clear-filters="clearFilters"
          ></projection>
        </div>
      </div>
    </template>

    <div v-else class="attrs-detail">
      <page-header :back-label="t('attr.back')" :draft="formDraft" @back="back">
        <template #title>
          <span v-show="detailStatus === 'ready'">
            <projection slot="detail"></projection>
          </span>
          <h1 v-if="detailStatus !== 'ready'">{{ selectedKey }}</h1>
        </template>
        <template #actions>
          <template v-if="detailStatus === 'ready'">
            <projection slot="setPrimaryKey" v-show="!isPrimaryKey" @done="onSetPrimaryKeyDone"></projection>
            <sdk-tooltip v-if="isPrimaryKey" :content="t('attr.alreadyPrimaryKey')" placement="top">
              <span><sdk-button disabled>{{ t("attr.setPrimaryKey") }}</sdk-button></span>
            </sdk-tooltip>
            <projection slot="remove" @done="onRemoveDone"></projection>
          </template>
        </template>
      </page-header>

      <p v-if="detailStatus === 'loading'" class="attrs-note" role="status">{{ t("attr.loading") }}</p>
      <p v-else-if="detailStatus === 'forbidden'" class="attrs-note attrs-failure">{{ t("attr.forbidden") }}</p>
      <div v-else-if="detailStatus !== 'ready'" class="attrs-missing">
        <sdk-empty :description="t('attr.notFound')"></sdk-empty>
      </div>
      <div v-else class="attrs-detail-body">
        <section class="attrs-card">
          <h2>{{ t("attr.editing") }}</h2>
          <div class="attrs-form-wrap">
            <projection slot="form" @saved="onSaved" @discarded="onDiscarded"></projection>
          </div>
        </section>
        <section class="attrs-card">
          <h2>{{ t("attr.ownerSection") }}</h2>
          <div class="attrs-owner-card">
            <projection slot="ownerCard" @navigate="openOwner"></projection>
          </div>
          <info-banner class="attrs-owner-note" tone="info" :text="t('attr.ownerHint')"></info-banner>
        </section>
      </div>
    </div>

    <!-- Create attribute dialog (mutually exclusive with detail editing since creating clears selected). -->
    <sdk-dialog v-model="createDialog" :title="t('attr.creating')" :width="narrow ? '94%' : '540px'" append-to-body destroy-on-close>
      <div class="attrs-create-body">
        <projection v-if="createDialog" slot="form" @saved="onSaved" @discarded="onDiscarded" @cancel="cancelCreate"></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
