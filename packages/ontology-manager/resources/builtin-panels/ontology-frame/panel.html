<style>
  .ontology-frame-shell {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
    container-type: inline-size;
  }

  .ontology-frame {
    display: flex;
    flex: 1;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
  }

  .ontology-frame-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .ontology-frame-content > .sdk-current-entry-slot {
    flex: 1;
    min-width: 0;
    min-height: 0;
  }

  .ontology-frame-trailing {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }

  .ontology-frame-trailing:empty {
    display: none;
  }

  @container (max-width: 600px) {
    .ontology-frame {
      flex-direction: column;
    }
  }

  @media (max-width: 600px) {
    .ontology-frame {
      flex-direction: column;
    }
  }
</style>

<div id="app" class="ontology-frame-shell">
  <div class="ontology-frame">
    <app-menu
      :title="t('frame.title')"
      :item-trailing-text="trailingText"
      :icons="icons"
    >
      <template #item-trailing="{ item }">
        <projection
          v-if="countMemberFor(item.id)"
          :slot="countMemberFor(item.id)"
          class="ontology-frame-trailing"
        />
      </template>
    </app-menu>
    <div class="ontology-frame-content">
      <current-entry member="content" />
    </div>
  </div>
</div>
