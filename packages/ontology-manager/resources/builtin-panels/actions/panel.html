<!--
  Actions catalog: full-width ObjectList with local keyword search, batch status update, and header ConversationEntry
  for agent-driven action creation. Clicking a row navigates to /ontology/assets/actions/detail.
-->
<style>
  [v-cloak] { display: none; }
  .ac-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: actions-page / inline-size;
  }
  .ac-capability {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
    margin: var(--spacing-md) var(--page-gutter) 0;
    padding: var(--spacing-sm) var(--spacing-md);
    border: 1px solid var(--sdk-border-color);
    border-radius: var(--radius-md);
  }
  .ac-capability p {
    margin: var(--spacing-xs) 0 0;
    color: var(--sdk-text-color-secondary);
  }
  .ac-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
</style>
<div id="app" v-cloak>
  <section class="ac-page">
    <page-header :title="t('pageTitle')" :description="t('pageDescription')">
      <template #actions>
        <sdk-button text :aria-label="t('refresh')" :title="t('refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </sdk-button>
        <projection slot="newAction"></projection>
      </template>
    </page-header>
    <aside v-show="showSandboxNotice" class="ac-capability" aria-live="polite">
      <div>
        <projection slot="sandboxCapability"></projection>
        <p v-if="canCheckSandbox">{{ t('sandbox.probeNote') }}</p>
      </div>
      <projection
        v-if="canCheckSandbox"
        slot="checkSandboxPermission"
        :label="t(sandboxStatus === 'failed' ? 'sandbox.recheck' : 'sandbox.check')"
        :notify-success="false"
        @done="onSandboxChecked"
      ></projection>
    </aside>
    <div class="ac-catalog">
      <projection slot="catalog" @choose="openDetail">
        <template #batch-actions>
          <projection slot="setStatus"></projection>
        </template>
      </projection>
    </div>
  </section>
</div>
