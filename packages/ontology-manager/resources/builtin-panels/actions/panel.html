<!--
  Actions: catalog table and selected action details (definition form, derived definition, and code explanation)
  composed purely from official SDK projections.
  There is no blank manual creation: the new-action ConversationEntry opens this page's agent input; the agent opens
  create mode via `present`, fills the live `ObjectForm` via `fill_form`, and submits via `page_action` when requested.
-->
<style>
  [v-cloak] { display: none; }
  .ac {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .ac-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ac-section h3 {
    margin: var(--spacing-xs) 0 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .ac-hint {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    line-height: 1.6;
  }
  .ac-detail {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .ac-detail-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ac-detail-header {
    flex: 1 1 20rem;
    min-width: 0;
  }
  .ac-draft-title {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .ac-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-xs);
    border-bottom: 1px solid var(--ui-divider);
  }
  .ac-tab {
    padding: var(--spacing-xs) var(--spacing-sm);
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    cursor: pointer;
    color: var(--sdk-text-color-regular);
    font: inherit;
    font-size: var(--text-sm);
  }
  .ac-tab[aria-selected="true"] {
    border-bottom-color: var(--sdk-color-primary);
    color: var(--brand-link);
    font-weight: var(--font-semibold);
  }
</style>
<div id="app" v-cloak>
  <page-header :title="t('pageTitle')" :description="t('pageDescription')">
    <template #actions>
      <sdk-button text :aria-label="t('refresh')" :title="t('refresh')" @click="refresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </sdk-button>
    </template>
  </page-header>
  <section class="ac">
    <!-- Catalog: all domain actions with local search, batch status update, and ConversationEntry creation. -->
    <section class="ac-section" v-show="!detailVisible">
      <projection slot="catalog" @choose="onChooseAction">
        <template #toolbar-actions>
          <projection slot="newAction"></projection>
        </template>
        <template #batch-actions>
          <projection slot="setStatus"></projection>
        </template>
      </projection>
    </section>

    <!-- Details: selected action header, definition form, derived definition tables, and annotated code explanation. -->
    <section class="ac-detail" v-if="detailVisible">
      <div class="ac-detail-head">
        <sdk-button size="small" text @click="back">{{ t("back") }}</sdk-button>
        <projection v-if="selected" slot="header" class="ac-detail-header">
          <template #actions>
            <projection slot="remove" @done="onRemoveDone"></projection>
          </template>
        </projection>
        <h2 v-else class="ac-draft-title">{{ t("newAction") }}</h2>
      </div>

      <div class="ac-tabs" role="tablist">
        <button
          v-for="tab in tabs"
          :key="tab.key"
          type="button"
          class="ac-tab"
          role="tab"
          :aria-selected="activeTab === tab.key"
          @click="activeTab = tab.key"
        >
          {{ t(tab.label) }}
        </button>
      </div>

      <!-- Definition tab: owner-declared ObjectForm for viewing, editing, or agent-driven creation via fill_form. -->
      <projection slot="form" v-show="activeTab === 'definition'" @saved="onFormSaved" @discarded="onFormDiscarded" @cancel="onFormDiscarded"></projection>

      <!-- Derived definition tab: summary, grouped effects, selectable parameters, and submission conditions. -->
      <section class="ac-section" v-show="activeTab === 'derived'">
        <p class="ac-hint">{{ t("derivedHint") }}</p>
        <projection slot="derivedSummary"></projection>

        <h3>{{ t("effects") }}</h3>
        <projection slot="derivedEffects"></projection>

        <h3>{{ t("parameters") }}</h3>
        <projection slot="derivedParameters"></projection>

        <h3>{{ t("conditions") }}</h3>
        <projection slot="derivedConditions"></projection>
      </section>

      <!-- Code explanation tab: generic AnnotatedCode bound to owner-projected annotatedExplanation. -->
      <section class="ac-section" v-show="activeTab === 'code'">
        <projection slot="explanation" @select-ref="onSelectRef"></projection>
      </section>
    </section>
  </section>
</div>
