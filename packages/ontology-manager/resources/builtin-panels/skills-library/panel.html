<style>
  [v-cloak] { display: none; }
  .skills { display: flex; flex-direction: column; gap: var(--spacing-sm); min-height: 0; min-width: 0; padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px); container-type: inline-size; }
  .skills-bar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: flex-end; gap: var(--spacing-sm); }
  .skills-body {
    display: grid;
    grid-template-columns: clamp(15rem, 30%, 22rem) minmax(0, 1fr);
    height: max(24rem, calc(100vh - 15rem));
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .skills-list {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: var(--spacing-md);
    border-right: 1px solid var(--ui-divider);
  }
  .skills-detail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .skills-hint {
    margin: auto;
    padding: var(--spacing-xl) var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .detail-head {
    padding: var(--spacing-md) var(--spacing-lg);
    flex-shrink: 0;
  }
  .detail-head.is-ready {
    border-bottom: 1px solid var(--ui-divider);
  }
  .detail-head .sdk-object-header-title {
    font-size: var(--text-base);
    line-height: var(--leading-base);
  }
  .detail-head .sdk-object-header-subtitle {
    font-family: var(--font-sans);
    font-size: var(--text-sm);
    line-height: var(--leading-sm);
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }
  .package {
    display: grid;
    grid-template-columns: clamp(9.5rem, 26%, 14rem) minmax(0, 1fr);
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .package-tree {
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-sm);
    overflow: auto;
    border-right: 1px solid var(--ui-divider);
  }
  .package-viewer {
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md) var(--spacing-lg);
    overflow: auto;
  }
  @container (max-width: 45rem) {
    .skills-body { grid-template-columns: minmax(0, 1fr); height: auto; overflow: visible; }
    .skills-list { max-height: 22rem; border-right: 0; border-bottom: 1px solid var(--ui-divider); }
    .skills-detail { min-height: 24rem; }
  }
  @container (max-width: 36rem) {
    .package { grid-template-columns: minmax(0, 1fr); }
    .package-tree { max-height: 12rem; border-right: 0; border-bottom: 1px solid var(--ui-divider); }
  }
</style>
<div id="app" v-cloak>
  <page-header title="技能" description="管理智能体可用的技能包与文件">
    <template #actions>
      <sdk-button text aria-label="刷新" title="刷新" @click="refresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </sdk-button>
    </template>
  </page-header>
  <section class="skills">
    <div class="skills-bar">
      <projection slot="import" @uploaded="onImported"></projection>
    </div>
    <div class="skills-body">
      <div class="skills-list">
        <projection slot="list"></projection>
      </div>
      <div class="skills-detail">
        <p v-if="!selected" class="skills-hint">{{ t("panel.select") }}</p>
        <template v-else>
          <div class="detail-head" :class="{ 'is-ready': detailReady }">
            <projection slot="detail" @done="onHeaderOperationDone"></projection>
          </div>
          <div v-show="detailReady" class="package">
            <div class="package-tree">
              <projection slot="tree"></projection>
            </div>
            <div class="package-viewer">
              <projection slot="content"></projection>
            </div>
          </div>
        </template>
      </div>
    </div>
  </section>
</div>
