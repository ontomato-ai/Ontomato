<style>
  [v-cloak] { display: none; }
  .skills-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: skills-page / inline-size;
  }
  .skills-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .skills-catalog {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--spacing-lg) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
  }
  .skills-list-fill {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  @container skills-page (max-width: 34rem) {
    .skills-catalog {
      padding: var(--spacing-sm) var(--spacing-md) calc(var(--spacing-md) + var(--pane-dock-space, 0px));
    }
  }
</style>
<div id="app" v-cloak>
  <section class="skills-page">
    <page-header :title="t('panel.title')" :description="t('panel.description')">
      <template #actions>
        <sdk-button type="primary" :disabled="importing" @click="openImport">
          <svg class="skills-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>{{ t("panel.import") }}</span>
        </sdk-button>
      </template>
    </page-header>
    <div class="skills-catalog">
      <projection slot="list" class="skills-list-fill" @choose="open"></projection>
    </div>

    <!-- Centered ZIP import dialog: file selection and submission remain human-operated per standard 2.4.2. -->
    <sdk-dialog
      v-model="importDialog"
      :title="t('panel.import')"
      width="520px"
      append-to-body
      destroy-on-close
    >
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--sdk-text-color-primary);">
          {{ t("panel.importIntro") }}
        </p>
        <ul style="margin: 0; padding-inline-start: 1.25rem; display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); line-height: var(--leading-sm); color: var(--sdk-text-color-secondary);">
          <li>{{ t("panel.importRuleRoot") }}</li>
          <li>{{ t("panel.importRuleFrontmatter") }}</li>
          <li>{{ t("panel.importRuleText") }}</li>
          <li>{{ t("panel.importRuleOverwrite") }}</li>
        </ul>
        <div style="display: flex; align-items: flex-start; justify-content: flex-end; gap: 8px; padding-top: 8px;">
          <sdk-button @click="closeImport">{{ t("panel.cancel") }}</sdk-button>
          <projection v-if="importDialog" slot="import" @uploaded="onImported" @refused="onImportRefused"></projection>
        </div>
      </div>
    </sdk-dialog>
  </section>
</div>
