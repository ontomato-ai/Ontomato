<style>
  .relations {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: relations-page / inline-size;
  }
  /* Catalog view: own page gutter and spacing matching original OntologyModelCatalog, plus scroll room at the bottom for the floating composer. */
  .relations-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .relations-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .relations-toolbar .relations-search {
    width: 260px;
    max-width: 100%;
  }
  .relations-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .relations-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }
  .relations-table {
    overflow: auto;
    margin-top: var(--spacing-lg);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .relations-row {
    display: grid;
    grid-template-columns: minmax(220px, 1.35fr) minmax(140px, 1fr) minmax(140px, 1fr) minmax(180px, 1.6fr) 20px;
    align-items: center;
    column-gap: var(--spacing-md);
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    font: inherit;
  }
  .relations-row.head {
    min-height: var(--table-head-height, 36px);
    padding: 0 var(--spacing-md);
    border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    background: var(--sdk-fill-color, var(--ui-fill-tertiary));
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    letter-spacing: 0.02em;
  }
  button.relations-row {
    min-height: var(--list-row-height, 44px);
    padding: 8px var(--spacing-md);
    border: 0;
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-regular);
    font-size: var(--text-sm);
    cursor: pointer;
    transition: background-color var(--transition-fast);
  }
  button.relations-row:last-child {
    border-bottom: 0;
  }
  button.relations-row:hover {
    background: var(--sdk-fill-color-light, var(--ui-fill-tertiary));
  }
  .relations-name {
    display: flex;
    min-width: 0;
    align-items: center;
  }
  .relations-name strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .relations-ellipsis {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--sdk-text-color-secondary);
  }
  .relations-chevron {
    color: var(--sdk-text-color-placeholder);
    justify-self: end;
  }
  .relations-note {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .relations-failure {
    color: var(--sdk-color-danger-text);
  }

  /* Detail view: matches original OntologyRelationDetail edge-to-edge titlebar and side-by-side cards. */
  .relations-detail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
  }
  .relations-titlebar {
    display: flex;
    min-height: var(--page-header-height, 56px);
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--page-gutter);
    border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    box-sizing: border-box;
  }
  .relations-back-icon,
  .relations-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .relations-divider {
    width: 1px;
    height: 22px;
    margin: 0 var(--spacing-xs);
    background: var(--sdk-border-color, var(--ui-border));
  }
  .relations-title {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .relations-spacer {
    flex: 1;
  }
  .relations-detail-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-sm);
    flex-shrink: 0;
  }
  .relations-detail-body {
    display: grid;
    grid-template-columns: minmax(320px, 0.85fr) minmax(420px, 1.15fr);
    gap: var(--page-content-gap);
    padding: var(--page-content-gap) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    align-items: stretch;
  }
  .relations-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--page-section-padding, var(--spacing-lg-xl, 20px));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .relations-card h2 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .relations-form-wrap {
    margin-top: var(--spacing-lg);
  }
  .relations-form-wrap .sdk-owner-form,
  .relations-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .relations-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .relations-ends {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
    align-items: stretch;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-lg);
  }
  .relations-end {
    min-width: 0;
    overflow-wrap: anywhere;
    display: block;
    width: 100%;
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--sdk-text-color-primary);
    font: inherit;
    text-align: start;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast);
  }
  .relations-end:hover {
    border-color: var(--sdk-color-primary-light-5, var(--brand-link));
    background: var(--brand-primary-tint, var(--ui-fill-tertiary));
  }
  .relations-end:focus-visible {
    outline: 2px solid var(--sdk-color-primary, var(--brand-link));
    outline-offset: 2px;
  }
  .relations-end small,
  .relations-end strong,
  .relations-end em {
    display: block;
  }
  .relations-end small,
  .relations-end em {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-style: normal;
  }
  .relations-end strong {
    margin: 3px 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .relations-end .relations-api-name {
    color: var(--sdk-text-color-placeholder);
    font-family: var(--font-mono);
  }
  .relations-arrow {
    display: grid;
    place-items: center;
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relations-connection-note {
    margin: var(--spacing-lg) 0 0;
    background-color: var(--sdk-color-primary-light-9, var(--brand-primary-tint));
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relations-connection-note .el-alert__icon,
  .relations-connection-note .el-alert__title {
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relations-missing {
    padding: var(--spacing-2xl) var(--page-gutter);
  }
  .relations-header-op-host:empty,
  .relations-header-op-host:has(> .sdk-operation-button:empty) {
    display: none;
  }
  .relations-header-op-host {
    padding-inline: var(--page-gutter);
  }
  .relations-create-body .sdk-owner-form,
  .relations-create-body .sdk-owner-form-inner {
    height: auto;
  }
  .relations-create-body .sdk-owner-form-body {
    overflow: visible;
  }
  .relations-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }

  @container relations-page (max-width: 900px) {
    .relations-row {
      grid-template-columns: minmax(150px, 1.3fr) minmax(100px, 1fr) 20px;
    }
    .relations-row > :nth-child(2),
    .relations-row > :nth-child(4) {
      display: none;
    }
  }
  @container relations-page (max-width: 850px) {
    .relations-detail-body {
      grid-template-columns: minmax(0, 1fr);
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + 56px);
      gap: var(--page-content-gap);
    }
    .relations-divider {
      display: none;
    }
    .relations-ends {
      grid-template-columns: minmax(0, 1fr);
    }
    .relations-arrow {
      height: 24px;
    }
    .relations-arrow svg {
      transform: rotate(90deg);
    }
  }
  @container relations-page (max-width: 560px) {
    .relations-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .relations-toolbar .relations-search {
      width: 100%;
    }
  }
</style>
<div id="app">
  <section class="relations">
    <!-- Catalog view: full-width table matching original OntologyModelCatalog (relations). -->
    <div v-if="!selectedKey" class="relations-catalog">
      <div class="relations-toolbar">
        <sdk-input class="relations-search" v-model="search" placeholder="筛选关系类型" aria-label="筛选关系类型" clearable>
          <template #prefix>
            <svg class="relations-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          </template>
        </sdk-input>
        <span v-if="countText" class="relations-count">{{ countText }}</span>
      </div>
      <div class="relations-table">
        <div class="relations-row head">
          <span>关系类型</span>
          <span>来源对象</span>
          <span>目标对象</span>
          <span>说明</span>
          <span></span>
        </div>
        <p v-if="catalogue.status === 'loading'" class="relations-note" role="status">正在读取关系类型…</p>
        <p v-else-if="catalogue.status === 'forbidden'" class="relations-note relations-failure">当前账号无权读取关系类型。</p>
        <sdk-alert v-else-if="catalogue.status === 'error'" type="error" :title="catalogue.message" :closable="false"></sdk-alert>
        <template v-else>
          <button v-for="row in rows" :key="row.primaryKey" type="button" class="relations-row" @click="open(row)">
            <span class="relations-name">
              <strong>{{ row.label || row.primaryKey }}</strong>
            </span>
            <span>{{ typeLabel(row.fields.fromclass) }}</span>
            <span>{{ typeLabel(row.fields.toclass) }}</span>
            <span class="relations-ellipsis">{{ row.fields.desc || "-" }}</span>
            <svg class="relations-chevron" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
          </button>
          <sdk-empty v-if="rows.length === 0" description="未找到关系类型"></sdk-empty>
        </template>
      </div>
    </div>

    <!-- Detail view: platform header draws the single bar (back + title + delete + save); local bar is fallback for headerless previews. -->
    <div v-else class="relations-detail">
      <header v-if="!hasHeaderHost" class="relations-titlebar">
        <sdk-button text @click="backToCatalog">
          <svg class="relations-back-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span>返回关系类型</span>
        </sdk-button>
        <span class="relations-divider" aria-hidden="true"></span>
        <span class="relations-title">{{ title }}</span>
        <span class="relations-spacer"></span>
        <div v-if="detail.status === 'ready'" class="relations-detail-actions">
          <projection slot="remove"></projection>
          <sdk-button type="primary" :loading="saving" :disabled="!canSave" @click="saveDetail">
            <svg v-if="!saving" class="relations-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
            <span>保存</span>
          </sdk-button>
        </div>
      </header>
      <!-- When the platform header hosts the Delete button, keep the remove member mounted for confirmation dialogs and error feedback. -->
      <div v-if="hasHeaderHost && detail.status === 'ready'" class="relations-header-op-host">
        <projection slot="remove"></projection>
      </div>
      <p v-if="detail.status === 'loading'" class="relations-note" role="status">正在读取这条关系类型…</p>
      <p v-else-if="detail.status === 'forbidden'" class="relations-note relations-failure">当前账号无权读取这条关系类型。</p>
      <div v-else-if="detail.status !== 'ready'" class="relations-missing">
        <sdk-empty description="关系类型不存在或已删除"></sdk-empty>
      </div>
      <div v-else class="relations-detail-body">
        <section class="relations-card">
          <h2>基本信息</h2>
          <div class="relations-form-wrap">
            <projection slot="form" @saved="onSaved" @discarded="onDiscarded"></projection>
          </div>
        </section>
        <section class="relations-card">
          <h2>对象连接</h2>
          <div class="relations-ends">
            <button type="button" class="relations-end" @click="openType(detail.value.fields.fromclass)">
              <small>来源对象</small>
              <strong>{{ typeLabel(detail.value.fields.fromclass) }}</strong>
              <em class="relations-api-name">{{ detail.value.fields.fromclass }}</em>
            </button>
            <span class="relations-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </span>
            <button type="button" class="relations-end" @click="openType(detail.value.fields.toclass)">
              <small>目标对象</small>
              <strong>{{ typeLabel(detail.value.fields.toclass) }}</strong>
              <em class="relations-api-name">{{ detail.value.fields.toclass }}</em>
            </button>
          </div>
          <sdk-alert class="relations-connection-note" type="info" title="关系连接来源对象和目标对象，可维护关系说明及关联字段。" :closable="false" show-icon></sdk-alert>
        </section>
      </div>
    </div>

    <!-- Create relation dialog (mutually exclusive with detail view since creating clears selected). -->
    <sdk-dialog v-model="createDialog" title="新建关系类型" width="540px" append-to-body destroy-on-close>
      <div class="relations-create-body">
        <projection v-if="createDialog" slot="form" @saved="onSaved" @discarded="onDiscarded" @cancel="cancelCreate"></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
