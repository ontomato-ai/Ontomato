<style>
  .relations-split {
    display: grid;
    grid-template-columns: var(--pane-list-width, 280px) minmax(0, 1fr);
    height: 100%;
    min-height: 24rem;
    min-width: 0;
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: hidden;
  }

  .relations-split[data-narrow="true"] {
    grid-template-columns: minmax(0, 1fr);
  }

  .relations-list-pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--sdk-border-color-lighter);
    background: var(--sdk-bg-color);
  }

  .relations-split[data-narrow="true"] .relations-list-pane {
    border-right: 0;
  }

  .relations-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }

  .relations-detail-pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
  }

  .relations-back-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: var(--spacing-xs) var(--spacing-md);
    border-bottom: 1px solid var(--sdk-border-color-lighter);
  }

  .relations-detail-header {
    flex: 0 0 auto;
    padding: var(--spacing-md) var(--spacing-lg);
    border-bottom: 1px solid var(--sdk-border-color-lighter);
  }

  .relations-create-title {
    margin: 0;
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
    line-height: 1.4;
  }

  .relations-detail-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: var(--spacing-lg);
  }

  .relations-detail-content {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    max-width: 48rem;
    min-width: 0;
  }

  .relations-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }

  .relations-section-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-secondary);
  }

  .relations-empty-detail {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: var(--spacing-xl);
  }
</style>
<div id="app" style="height: 100%; min-height: 0;">
  <div ref="rootRef" class="relations-split" :data-narrow="narrow ? 'true' : 'false'">
    <aside v-show="showList" class="relations-list-pane">
      <projection slot="list" class="relations-list-slot"></projection>
    </aside>

    <section v-show="showDetail" class="relations-detail-pane">
      <div v-if="narrow && hasDetailView" class="relations-back-bar">
        <sdk-button text @click="back">{{ t("relations.backToList") }}</sdk-button>
      </div>

      <div v-if="!hasDetailView" class="relations-empty-detail">
        <sdk-empty :description="t('relations.selectPlaceholder')"></sdk-empty>
      </div>

      <template v-else-if="creating">
        <div class="relations-detail-header">
          <h2 class="relations-create-title">{{ t("relations.createTitle") }}</h2>
        </div>
        <div ref="detailBodyRef" class="relations-detail-body">
          <div class="relations-detail-content">
            <section class="relations-section">
              <projection slot="form" @saved="onSaved" @cancel="onCancel" @discarded="onDiscarded"></projection>
            </section>
          </div>
        </div>
      </template>

      <template v-else>
        <div class="relations-detail-header">
          <projection slot="header" @done="onOperationDone"></projection>
        </div>
        <div ref="detailBodyRef" class="relations-detail-body">
          <div class="relations-detail-content">
            <section class="relations-section">
              <h3 class="relations-section-title">{{ t("relations.section.connections") }}</h3>
              <projection slot="connections" @navigate="onNavigate"></projection>
            </section>
            <section class="relations-section">
              <h3 class="relations-section-title">{{ t("relations.section.basic") }}</h3>
              <projection slot="form" @saved="onSaved" @cancel="onCancel" @discarded="onDiscarded"></projection>
            </section>
          </div>
        </div>
      </template>
    </section>
  </div>
</div>
