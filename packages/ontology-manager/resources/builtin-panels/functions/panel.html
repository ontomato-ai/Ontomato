<!--
  Functions catalog panel: full-width unpaged ObjectList table backed by platform:Function.list.
  Clicking a row opens /ontology/assets/functions/detail?selected=<id>; clicking "New function"
  opens /ontology/assets/functions/detail?mode=create.
-->
<style>
  [v-cloak] { display: none; }
  .fn-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: fn-page / inline-size;
  }
  .fn-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .fn-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }
  .fn-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    white-space: nowrap;
  }

  @container fn-page (max-width: 560px) {
    .fn-catalog {
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    }
  }
</style>
<div id="app" v-cloak>
  <section class="fn-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button type="primary" icon="function" @click="startCreate">{{ t("newFunction") }}</sdk-button>
      </template>
    </page-header>
    <div class="fn-catalog">
      <projection slot="list" class="fn-list-slot" @choose="openDetail">
        <template #filters>
          <span v-if="listTotal !== null" class="fn-count" role="status">{{ t("itemCount", { count: listTotal }) }}</span>
        </template>
      </projection>
    </div>
  </section>
</div>
