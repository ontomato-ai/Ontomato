<!--
  函数页：左边是函数目录（名称、说明、操作类型，可按名称和说明搜索），右边是选中那一条的详情与编辑；
  新建、保存、删除都走属主自己的接口，页面不另写业务规则。「新建函数」是 <page-header> 里的按钮，
  由宿主画成主按钮：它清空 selected、把 creating 设为 true，打开属主的空白表单。

  - list：platform:Function 的 query 读，搜索词和选中的那一条都是本面板声明的状态。
  - form：platform:Function 的 form / createForm 读，保存用属主声明的 platform:Function.save。
    属主按操作类型（读/写）给出不同的字段，读函数给查询逻辑包与列标签，写函数给参数、返回类和代码；
    名称只有一个字段。只读的函数由属主在每个字段上说明原因，保存被拒时属主按字段给出原因。
  - remove：functions.delete，平台先向读者确认，属主拒绝删除时把原因显示在按钮下面。

  表单始终挂着（只是隐藏），智能体写来的草稿随时能落进表单，读者确认后才保存。
-->
<style>
  [v-cloak] { display: none; }
  .fn { display: flex; flex-direction: column; gap: var(--spacing-md); padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px); }
  .fn-hint { margin: 0; color: var(--sdk-text-color-secondary); font-size: var(--text-sm); line-height: 1.6; }
  .fn-detail { display: flex; flex-direction: column; gap: var(--spacing-md); min-width: 0; }
  .fn-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--spacing-sm); }
</style>
<div id="app" v-cloak>
  <page-header title="函数" description="维护读函数的查询逻辑包与写函数的参数与代码">
    <template #actions>
      <sdk-button text aria-label="刷新" title="刷新" @click="refresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </sdk-button>
      <sdk-button type="primary" :disabled="creating && !selected" @click="startCreate">{{ t("newFunction") }}</sdk-button>
    </template>
  </page-header>
  <section class="fn">
    <two-pane-layout>
      <template #aside>
        <projection slot="list"></projection>
      </template>

      <div class="fn-detail">
        <p class="fn-hint" v-if="!selected && !creating">{{ t("choose") }}</p>
        <div class="fn-detail-head" v-if="selected">
          <projection slot="remove"></projection>
        </div>
        <!-- 表单一直挂着（只是隐藏），草稿才有地方落；读者保存或放弃后回到查看。 -->
        <projection slot="form" v-show="selected || creating" @saved="saved" @discarded="discard"></projection>
      </div>
    </two-pane-layout>
  </section>
</div>
