<!--
  Functions catalog panel: full-width ObjectList table backed by platform:Function.query.
  Clicking a row opens /ontology/assets/functions/detail?selected=<id>; clicking "New function"
  opens /ontology/assets/functions/detail?mode=create.
-->
<style>
  [v-cloak] { display: none; }
  .fn-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: fn-page / inline-size;
  }
  .fn-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .fn-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }
  .fn-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  @container fn-page (max-width: 560px) {
    .fn-catalog {
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    }
  }
</style>
<div id="app" v-cloak>
  <section class="fn-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" @click="startCreate">
          <svg class="fn-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t("newFunction") }}</span>
        </sdk-button>
      </template>
    </page-header>
    <div class="fn-catalog">
      <projection slot="list" class="fn-list-slot" @choose="openDetail"></projection>
    </div>
  </section>
</div>
