<style>
  /* Workbench template: fills the host content box with no viewport units and no outer double scrollbars. */
  .og-workbench {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
    border: 1px solid var(--ui-border);
    border-radius: var(--radius-sm);
  }

  /* Left catalog pane: collapsible on wide containers, overlay drawer on narrow containers. */
  .og-aside {
    display: flex;
    flex: 0 0 clamp(220px, 22%, var(--shell-list-panel, 264px));
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
    border-right: 1px solid var(--ui-border);
  }

  .og-aside-head {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid var(--ui-divider);
  }

  .og-aside-title {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    line-height: var(--leading-sm);
  }

  .og-search-controls {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid var(--ui-divider);
  }

  .og-scope-segmented {
    width: 100%;
  }

  .og-aside-scroll {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-sm);
    overflow-y: auto;
  }

  .og-section {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
  }

  .og-section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-xs);
    margin: 0;
    padding: 0 var(--spacing-xs);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    line-height: var(--leading-xs);
  }

  .og-section-count {
    font-variant-numeric: tabular-nums;
    font-weight: var(--font-medium);
  }

  .og-empty-search {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-lg) var(--spacing-sm);
  }

  /* Center main pane: compact top toolbar + full-height interactive graph canvas. */
  .og-main {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .og-toolbar {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-xs) var(--spacing-md);
    padding: var(--spacing-xs) var(--spacing-md);
    background: var(--sdk-bg-color);
    border-bottom: 1px solid var(--ui-divider);
  }

  .og-toolbar-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }

  .og-counts {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }

  .og-toolbar-sep {
    color: var(--sdk-text-color-placeholder);
    font-size: var(--text-sm);
    user-select: none;
  }

  .og-count-member {
    flex: 0 0 auto;
  }

  .og-path-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
  }

  .og-path-label {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-weight: var(--font-medium);
    white-space: nowrap;
  }

  .og-path-picker {
    flex: 0 0 128px;
    width: 128px;
  }

  .og-path-arrow {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    user-select: none;
  }

  .og-canvas-wrap {
    position: relative;
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .og-graph-member {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  /* Right detail pane: collapsed by default, opens automatically on object/relation selection. */
  .og-detail {
    display: flex;
    flex: 0 0 clamp(280px, 28%, var(--shell-inspector, 320px));
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
    border-left: 1px solid var(--ui-border);
  }

  .og-detail-head {
    flex: 0 0 auto;
    padding: var(--spacing-md);
    border-bottom: 1px solid var(--ui-divider);
  }

  .og-detail-scroll {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md);
    overflow-y: auto;
  }

  .og-summary-block {
    flex: 0 0 auto;
    min-width: 0;
  }

  .og-nav-error {
    margin: 0;
    color: var(--sdk-color-danger);
    font-size: var(--text-xs);
    line-height: var(--leading-xs);
  }

  /* Narrow container mode: side panes float above the canvas, mutually exclusive, with a dismiss backdrop. */
  .og-backdrop {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--sdk-text-color-primary) 24%, transparent);
  }

  .og-workbench.is-narrow .og-aside {
    position: absolute;
    inset: 0 auto 0 0;
    z-index: 20;
    width: min(var(--shell-list-panel, 264px), 88%);
    max-width: 100%;
    box-shadow: var(--elevation-overlay);
  }

  .og-workbench.is-narrow .og-detail {
    position: absolute;
    inset: 0 0 0 auto;
    z-index: 20;
    width: min(var(--shell-inspector, 320px), 92%);
    max-width: 100%;
    box-shadow: var(--elevation-overlay);
  }
</style>
<div id="app">
  <section
    ref="rootRef"
    class="og-workbench"
    :class="{ 'is-narrow': narrow, 'has-selection': hasSelection }"
    :data-narrow="narrow ? 'true' : 'false'"
  >
    <div
      v-if="narrow && narrowDrawer !== 'none'"
      class="og-backdrop"
      aria-hidden="true"
      @click="closeNarrowDrawer"
    ></div>

    <aside v-show="showLeftPane" class="og-aside" :aria-label="t('og.explorer.title')">
      <div v-if="narrow" class="og-aside-head">
        <h2 class="og-aside-title">{{ t("og.explorer.title") }}</h2>
        <sdk-button
          size="small"
          text
          :aria-label="t('og.action.closeExplorer')"
          @click="closeNarrowDrawer"
        >{{ t("og.action.close") }}</sdk-button>
      </div>

      <div class="og-search-controls">
        <sdk-input
          v-model="search"
          size="small"
          clearable
          :placeholder="t('og.search.placeholder')"
          :aria-label="t('og.search.placeholder')"
        ></sdk-input>
        <sdk-segmented
          v-model="scope"
          class="og-scope-segmented"
          size="small"
          block
          :options="scopeOptions"
        ></sdk-segmented>
      </div>

      <div class="og-aside-scroll">
        <div v-if="showUnifiedSearchEmpty" class="og-empty-search">
          <sdk-empty :image-size="56" :description="t('og.empty.search')">
            <sdk-button size="small" @click="clearSearch">{{ t("og.search.clear") }}</sdk-button>
          </sdk-empty>
        </div>

        <section v-show="showObjectsSection" class="og-section">
          <h3 v-if="scope === 'all'" class="og-section-heading">
            <span>{{ t("og.section.objects") }}</span>
            <span v-if="objectsReady" class="og-section-count">{{ listedObjects.length }}</span>
          </h3>
          <projection slot="objectList" @update:listed="onObjectsListed"></projection>
        </section>

        <section v-show="showRelationsSection" class="og-section">
          <h3 v-if="scope === 'all'" class="og-section-heading">
            <span>{{ t("og.section.relations") }}</span>
            <span v-if="relationsReady" class="og-section-count">{{ listedRelations.length }}</span>
          </h3>
          <projection slot="relationList" @update:listed="onRelationsListed"></projection>
        </section>
      </div>
    </aside>

    <main class="og-main">
      <div class="og-toolbar">
        <div class="og-toolbar-group">
          <sdk-button
            size="small"
            text
            :aria-expanded="showLeftPane ? 'true' : 'false'"
            :aria-label="leftToggleLabel"
            @click="toggleLeftPane"
          >{{ leftToggleText }}</sdk-button>

          <div class="og-counts">
            <projection slot="objectTypesCount" class="og-count-member"></projection>
            <span class="og-toolbar-sep" aria-hidden="true">·</span>
            <projection slot="relationsCount" class="og-count-member"></projection>
          </div>
        </div>

        <div class="og-path-bar" role="group" :aria-label="t('og.path.label')">
          <span class="og-path-label">{{ t("og.path.label") }}</span>
          <projection slot="pathFromPicker" class="og-path-picker"></projection>
          <span class="og-path-arrow" aria-hidden="true">→</span>
          <projection slot="pathToPicker" class="og-path-picker"></projection>
          <sdk-button
            v-if="hasPathEndpoints"
            size="small"
            text
            @click="clearPath"
          >{{ t("og.path.clear") }}</sdk-button>
        </div>
      </div>

      <div class="og-canvas-wrap">
        <projection slot="graph" class="og-graph-member"></projection>
      </div>
    </main>

    <aside v-if="showRightPane" class="og-detail" :aria-label="t('og.action.closeDetail')">
      <template v-if="selectedObjectRef">
        <div class="og-detail-head">
          <projection slot="objectHeader">
            <template #actions>
              <sdk-button size="small" @click="openModeling">{{ t("og.action.modeling") }}</sdk-button>
              <sdk-button
                size="small"
                text
                :aria-label="t('og.action.closeDetail')"
                @click="closeDetail"
              >{{ t("og.action.close") }}</sdk-button>
            </template>
          </projection>
        </div>

        <div ref="detailScrollRef" class="og-detail-scroll">
          <p v-if="navigationError" class="og-nav-error" role="alert">{{ navigationError }}</p>
          <div class="og-summary-block">
            <projection slot="objectSummary"></projection>
          </div>

          <section class="og-section">
            <h3 class="og-section-heading">{{ t("og.section.attributes") }}</h3>
            <projection slot="objectAttributes"></projection>
          </section>

          <section class="og-section">
            <h3 class="og-section-heading">{{ t("og.section.connectedRelations") }}</h3>
            <projection slot="objectRelations"></projection>
          </section>
        </div>
      </template>

      <template v-else-if="selectedRelationRef">
        <div class="og-detail-head">
          <projection slot="relationHeader">
            <template #actions>
              <sdk-button size="small" @click="openModeling">{{ t("og.action.modeling") }}</sdk-button>
              <sdk-button
                size="small"
                text
                :aria-label="t('og.action.closeDetail')"
                @click="closeDetail"
              >{{ t("og.action.close") }}</sdk-button>
            </template>
          </projection>
        </div>

        <div ref="detailScrollRef" class="og-detail-scroll">
          <p v-if="navigationError" class="og-nav-error" role="alert">{{ navigationError }}</p>
          <div class="og-summary-block">
            <projection slot="relationSummary" @navigate="onSummaryNavigate"></projection>
          </div>
        </div>
      </template>
    </aside>
  </section>
</div>
