<!-- Projections catalog panel: opens projection details on /ontology/projections/detail and creates via a full-width form. -->
<style>
  [v-cloak] { display: none; }
  .proj-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: proj-page / inline-size;
  }

  .proj-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .proj-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }
  .proj-filter-select {
    width: 9.5rem;
  }
  .proj-filter-picker {
    width: 12rem;
    min-width: 0;
  }
  .proj-filter-picker .sdk-inline-reference-picker,
  .proj-filter-picker .sdk-inline-reference-picker-select {
    width: 100%;
  }
  .proj-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .proj-create-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    min-width: 0;
  }
  .proj-create-card {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--page-section-padding, var(--spacing-lg));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    min-width: 0;
  }
  .proj-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .proj-form-wrap .sdk-owner-form,
  .proj-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .proj-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }

  .proj-create-mode-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .proj-chart-picker {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-lighter, var(--sdk-bg-color));
  }
  .proj-chart-picker-head {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .proj-chart-picker-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .proj-chart-picker-desc {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .proj-chart-grid {
    display: grid;
    grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
    gap: var(--spacing-md);
    min-width: 0;
  }
  .proj-chart-list-col {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .proj-chart-cards-box {
    max-height: 18rem;
    overflow: auto;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
    background: var(--sdk-bg-color);
  }
  .proj-chart-preview-col {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
    background: var(--sdk-bg-color);
    min-width: 0;
    min-height: 18rem;
  }
  .proj-chart-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .proj-binding-helper {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    width: 100%;
    min-width: 0;
  }
  .proj-binding-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    padding: var(--spacing-xs) var(--spacing-sm);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-lighter, var(--sdk-bg-color));
  }
  .proj-binding-picker {
    flex: 1 1 12rem;
    min-width: 10rem;
  }
  .proj-binding-input {
    width: 9rem;
  }
  .proj-binding-id {
    flex: 1 1 10rem;
    min-width: 8rem;
  }
  .proj-binding-error {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-color-danger);
  }

  @container proj-page (max-width: 760px) {
    .proj-filter-select {
      width: 8.5rem;
    }
    .proj-filter-picker {
      width: 10.5rem;
    }
    .proj-chart-grid {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>

<div id="app" v-cloak>
  <section class="proj-page">
    <template v-if="creating">
      <page-header
        key="create-header"
        :back-label="t('action.back')"
        :title="t('form.createTitle')"
        :draft="createDraft"
        @back="cancelCreate"
      ></page-header>

      <div class="proj-create-body">
        <section class="proj-create-card">
          <div class="proj-create-mode-bar">
            <sdk-segmented v-model="createModeModel" :options="createModeOptions" size="default"></sdk-segmented>
          </div>

          <section v-if="createModeModel === 'chart'" class="proj-chart-picker">
            <div class="proj-chart-picker-head">
              <h3 class="proj-chart-picker-title">{{ t('chart.stepTitle') }}</h3>
              <p class="proj-chart-picker-desc">{{ t('chart.stepDesc') }}</p>
            </div>
            <div class="proj-chart-grid">
              <div class="proj-chart-list-col">
                <projection slot="dashboardPicker"></projection>
                <div class="proj-chart-cards-box">
                  <projection v-if="selectedDashboardKey" slot="dashboardCardsList"></projection>
                  <p v-else class="proj-chart-picker-desc" style="padding: var(--spacing-md);">{{ t('chart.noCards') }}</p>
                </div>
              </div>
              <div class="proj-chart-preview-col">
                <projection v-if="selectedChartCardKey && isSelectedCardChart" slot="chartCardPreview"></projection>
                <p v-else-if="selectedChartCardKey && !isSelectedCardChart" class="proj-chart-picker-desc">{{ t('chart.nonChartHint') }}</p>
                <p v-else class="proj-chart-picker-desc">{{ t('chart.selectHint') }}</p>
              </div>
            </div>
            <div class="proj-chart-actions">
              <span v-if="appliedChartLabel" class="proj-chart-picker-desc">{{ t('chart.appliedHint', { card: appliedChartLabel }) }}</span>
              <span v-else class="proj-chart-picker-desc"></span>
              <sdk-button type="primary" size="small" :disabled="!canApplyChartCard" @click="applySelectedChartCard">
                {{ t('chart.applyCard') }}
              </sdk-button>
            </div>
          </section>

          <div class="proj-form-wrap">
            <projection slot="createForm" @saved="onCreated">
              <template #field-data="{ value, update, readOnly }">
                <div class="proj-binding-helper">
                  <div v-if="!readOnly" class="proj-binding-bar">
                    <sdk-segmented v-model="dataBindKind" :options="dataBindKindOptions" size="small"></sdk-segmented>
                    <sdk-input v-model="dataBindKey" class="proj-binding-input" size="small" :placeholder="t('binding.datumKey')"></sdk-input>
                    <div class="proj-binding-picker">
                      <projection v-if="dataBindKind === 'metric'" slot="bindingMetricPicker"></projection>
                      <projection v-else slot="bindingObjectTypePicker"></projection>
                    </div>
                    <sdk-input v-model="dataBindManualId" class="proj-binding-id" size="small" :placeholder="t('binding.manualId')"></sdk-input>
                    <sdk-button size="small" type="primary" plain :disabled="!canApplyDataBinding" @click="applyDataBinding(value, update)">
                      {{ t('binding.apply') }}
                    </sdk-button>
                    <sdk-button size="small" text @click="showDataJson = !showDataJson">
                      {{ showDataJson ? t('binding.hideJson') : t('binding.showJson') }}
                    </sdk-button>
                  </div>
                  <template v-if="showDataJson || readOnly">
                    <sdk-input
                      type="textarea"
                      :rows="6"
                      :disabled="readOnly"
                      :model-value="formatJsonField(value, 'data')"
                      @update:model-value="onJsonFieldInput('data', $event, update)"
                    ></sdk-input>
                    <p v-if="jsonFieldErrors.data" class="proj-binding-error" role="alert">{{ jsonFieldErrors.data }}</p>
                  </template>
                </div>
              </template>

              <template #field-operations="{ value, update, readOnly }">
                <div class="proj-binding-helper">
                  <div v-if="!readOnly" class="proj-binding-bar">
                    <sdk-input v-model="opBindKey" class="proj-binding-input" size="small" :placeholder="t('binding.opKey')"></sdk-input>
                    <div class="proj-binding-picker">
                      <projection slot="bindingActionPicker"></projection>
                    </div>
                    <sdk-input v-model="opBindManualId" class="proj-binding-id" size="small" :placeholder="t('binding.manualId')"></sdk-input>
                    <sdk-button size="small" type="primary" plain :disabled="!canApplyOperationBinding" @click="applyOperationBinding(value, update)">
                      {{ t('binding.apply') }}
                    </sdk-button>
                    <sdk-button size="small" text @click="showOpsJson = !showOpsJson">
                      {{ showOpsJson ? t('binding.hideJson') : t('binding.showJson') }}
                    </sdk-button>
                  </div>
                  <template v-if="showOpsJson || readOnly">
                    <sdk-input
                      type="textarea"
                      :rows="5"
                      :disabled="readOnly"
                      :model-value="formatJsonField(value, 'operations')"
                      @update:model-value="onJsonFieldInput('operations', $event, update)"
                    ></sdk-input>
                    <p v-if="jsonFieldErrors.operations" class="proj-binding-error" role="alert">{{ jsonFieldErrors.operations }}</p>
                  </template>
                </div>
              </template>
            </projection>
          </div>
        </section>
      </div>
    </template>

    <page-header v-else key="catalog-header" :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="proj-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t('action.create') }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div v-show="!creating" class="proj-catalog">
      <projection slot="catalogue" class="proj-list-slot" @choose="openDetail" @clear-filters="clearFilters">
        <template #filters>
          <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="default"></sdk-segmented>
          <div class="proj-filter-picker">
            <projection slot="componentPicker"></projection>
          </div>
          <div class="proj-filter-picker">
            <projection slot="objectTypePicker"></projection>
          </div>
          <sdk-select v-model="sortModel" class="proj-filter-select" :aria-label="t('sort.label')">
            <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
            <sdk-option value="name" :label="t('sort.name')"></sdk-option>
          </sdk-select>
        </template>
      </projection>
    </div>
  </section>
</div>
