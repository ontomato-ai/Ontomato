<!-- Projections catalog panel: opens projection details on /ontology/projections/detail and creates in a centered dialog. -->
<style>
  [v-cloak] { display: none; }
  .proj-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: proj-page / inline-size;
  }

  .proj-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .proj-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }
  .proj-filter-select {
    width: 9.5rem;
  }
  .proj-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .proj-create-body :deep(.sdk-owner-form),
  .proj-create-body :deep(.sdk-owner-form-inner) {
    height: auto;
  }
  .proj-create-body :deep(.sdk-owner-form-body) {
    overflow: visible;
  }

  @container proj-page (max-width: 760px) {
    .proj-filter-select {
      width: 8.5rem;
    }
  }
</style>

<div id="app" v-cloak>
  <section class="proj-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="proj-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t('action.create') }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="proj-catalog">
      <projection slot="catalogue" class="proj-list-slot" @choose="openDetail">
        <template #filters>
          <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="default"></sdk-segmented>
          <sdk-select v-model="sortModel" class="proj-filter-select" :aria-label="t('sort.label')">
            <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
            <sdk-option value="name" :label="t('sort.name')"></sdk-option>
          </sdk-select>
        </template>
      </projection>
    </div>

    <sdk-dialog
      v-model="createDialog"
      :title="t('form.createTitle')"
      width="640px"
      append-to-body
      destroy-on-close
    >
      <div class="proj-create-body">
        <projection
          v-if="creating"
          slot="createForm"
          @saved="onCreated"
          @cancel="requestCloseCreate"
        >
          <template #default>
            <object-form-fields :fields="['/name', '/id', '/description', '/visibility', '/componentId', '/data']"></object-form-fields>
          </template>
          <template #actions="{ saving, asking, save }">
            <sdk-button text :disabled="saving" @click="requestCloseCreate">{{ t('action.cancel') }}</sdk-button>
            <sdk-button type="primary" :disabled="asking" :loading="saving" @click="save">{{ t('action.createSubmit') }}</sdk-button>
          </template>
        </projection>
      </div>
    </sdk-dialog>
  </section>
</div>
