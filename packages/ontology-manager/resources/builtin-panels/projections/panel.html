<!-- Projections directory panel: official projections, read-only outputs, and bound operations. -->
<style>
  [v-cloak] { display: none; }
  .proj-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: proj-page / inline-size;
  }

  .proj-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--spacing-lg);
    align-items: start;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    min-width: 0;
  }
  @container proj-page (min-width: 960px) {
    .proj-body.with-detail {
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    }
  }

  .proj-list-pane {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .proj-filter-select {
    width: 9.5rem;
  }
  .proj-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .proj-detail-pane {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .proj-detail-view {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .proj-detail-header-card {
    padding: var(--spacing-md) var(--spacing-lg);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    min-width: 0;
  }
  .proj-tabs {
    margin-bottom: calc(var(--spacing-xs) * -1);
  }

  .proj-card {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--page-section-padding, var(--spacing-lg));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    min-width: 0;
  }
  .proj-card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .proj-card-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .proj-card-subtitle {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .proj-muted {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }

  .proj-io-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--spacing-md);
  }
  @container proj-page (min-width: 720px) {
    .proj-io-grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
  }

  .proj-definition-details {
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    padding: var(--spacing-sm) var(--spacing-md);
    background: var(--sdk-bg-color);
  }
  .proj-definition-details > summary {
    cursor: pointer;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .proj-definition-body {
    margin-top: var(--spacing-sm);
  }
  .proj-definition-body :deep(.sdk-object-summary-text) {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: var(--text-xs);
    max-height: 20rem;
    overflow: auto;
    display: block;
  }

  .proj-share-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--spacing-lg);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .proj-share-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .proj-share-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }

  .proj-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .proj-form-wrap :deep(.sdk-owner-form),
  .proj-form-wrap :deep(.sdk-owner-form-inner) {
    height: auto;
  }
  .proj-form-wrap :deep(.sdk-owner-form-body) {
    overflow: visible;
  }

  .proj-state-box {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-lg);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .proj-dialog-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }
  .proj-dialog-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--spacing-sm);
  }
</style>

<div id="app" v-cloak>
  <section class="proj-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="proj-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t('action.create') }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="proj-body" :class="{ 'with-detail': showDetail }">
      <div class="proj-list-pane">
        <projection slot="catalogue" @choose="onChooseProjection">
          <template #filters>
            <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="default"></sdk-segmented>
            <sdk-select v-model="sortModel" class="proj-filter-select" :aria-label="t('sort.label')">
              <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
              <sdk-option value="name" :label="t('sort.name')"></sdk-option>
            </sdk-select>
          </template>
        </projection>
      </div>

      <div v-if="showDetail" class="proj-detail-pane">
        <!-- Create / Edit form mode -->
        <section v-if="isFormMode" class="proj-card">
          <div class="proj-card-head">
            <div>
              <h2 class="proj-card-title">{{ selectedKey ? t('form.editTitle') : t('form.createTitle') }}</h2>
              <p class="proj-card-subtitle">{{ t('form.partialHint') }}</p>
            </div>
            <sdk-button size="small" @click="closeFormGuarded">{{ t('action.close') }}</sdk-button>
          </div>
          <div class="proj-form-wrap">
            <projection slot="form" @saved="onSaved" @discarded="closeForm" @cancel="closeForm"></projection>
          </div>
        </section>

        <!-- Selected projection detail view -->
        <div v-else-if="selectedKey" class="proj-detail-view">
          <div class="proj-detail-header-card">
            <projection slot="headerTitle" :fallback-title="selectedKey">
              <template #actions>
                <sdk-button size="small" @click="openClass">{{ t('action.openClass') }}</sdk-button>
                <sdk-button v-if="recordReady && canEdit" size="small" @click="startEdit">{{ t('action.edit') }}</sdk-button>
                <sdk-button v-if="recordReady && canCopy" size="small" @click="openCopy">{{ t('action.copy') }}</sdk-button>
                <sdk-button v-if="recordReady && canDelete" size="small" type="danger" plain @click="openDelete">{{ t('action.delete') }}</sdk-button>
              </template>
            </projection>
          </div>

          <div v-if="recordStatus === 'loading'" class="proj-state-box">
            <sdk-alert type="info" :closable="false" :title="t('detail.loading')"></sdk-alert>
          </div>
          <div v-else-if="recordStatus === 'forbidden'" class="proj-state-box">
            <sdk-alert type="warning" :closable="false" :title="t('detail.forbidden')"></sdk-alert>
          </div>
          <div v-else-if="recordStatus === 'error'" class="proj-state-box">
            <sdk-alert type="error" :closable="false" :title="recordErrorText"></sdk-alert>
            <div>
              <sdk-button size="small" @click="refresh">{{ t('action.retry') }}</sdk-button>
            </div>
          </div>
          <div v-else-if="recordStatus === 'empty'" class="proj-state-box">
            <sdk-alert type="warning" :closable="false" :title="t('detail.missing')"></sdk-alert>
          </div>

          <template v-else-if="recordReady">
            <sdk-alert v-if="isChart" type="info" :closable="false" :title="t('detail.chartHint')"></sdk-alert>

            <sdk-tabs v-model="tabModel" class="proj-tabs">
              <sdk-tab-pane name="overview" :label="t('tab.overview')"></sdk-tab-pane>
              <sdk-tab-pane name="definition" :label="t('tab.definition')"></sdk-tab-pane>
              <sdk-tab-pane name="usage" :label="t('tab.usage')"></sdk-tab-pane>
              <sdk-tab-pane v-if="canGrant" name="grants" :label="t('tab.grants')"></sdk-tab-pane>
            </sdk-tabs>

            <!-- Tab 1: Overview & inline preview -->
            <template v-if="tabModel === 'overview'">
              <section class="proj-card">
                <h3 class="proj-card-title">{{ t('section.summary') }}</h3>
                <projection slot="summary" @navigate="onNavigateReference"></projection>
              </section>

              <section class="proj-card">
                <h3 class="proj-card-title">{{ t('section.preview') }}</h3>
                <projection slot="preview"></projection>
              </section>
            </template>

            <!-- Tab 2: Definition & bindings -->
            <template v-else-if="tabModel === 'definition'">
              <section class="proj-card">
                <h3 class="proj-card-title">{{ t('section.data') }}</h3>
                <projection slot="dataList" @navigate="onNavigateReference"></projection>
              </section>

              <section class="proj-card">
                <h3 class="proj-card-title">{{ t('section.config') }}</h3>
                <projection slot="configList"></projection>
              </section>

              <div class="proj-io-grid">
                <section class="proj-card">
                  <h3 class="proj-card-title">{{ t('section.inputs') }}</h3>
                  <projection slot="inputsList"></projection>
                </section>
                <section class="proj-card">
                  <h3 class="proj-card-title">{{ t('section.outputs') }}</h3>
                  <projection slot="outputsList"></projection>
                </section>
              </div>

              <section class="proj-card">
                <h3 class="proj-card-title">{{ t('section.operations') }}</h3>
                <projection slot="operationsList" @navigate="onNavigateReference"></projection>
              </section>

              <details class="proj-definition-details">
                <summary>{{ t('source.definition') }}</summary>
                <div class="proj-definition-body">
                  <projection slot="definitionSummary"></projection>
                </div>
              </details>
            </template>

            <!-- Tab 3: Used by panels -->
            <template v-else-if="tabModel === 'usage'">
              <section class="proj-card">
                <div class="proj-card-head">
                  <h3 class="proj-card-title">{{ t('section.usedBy') }}</h3>
                  <span class="proj-muted">{{ t('usedBy.count', { count: usedByCount }) }}</span>
                </div>
                <projection slot="usedByList" @choose="onChoosePanel" @navigate="onNavigateReference"></projection>
                <p v-if="hiddenUsedByCount > 0" class="proj-muted">
                  {{ t('usedBy.hiddenHint', { count: hiddenUsedByCount }) }}
                </p>
              </section>
            </template>

            <!-- Tab 4: Permissions & sharing -->
            <template v-else-if="tabModel === 'grants' && canGrant">
              <div class="proj-share-bar">
                <div class="proj-share-left">
                  <strong class="proj-card-title">{{ t('grants.shareTitle') }}</strong>
                  <span class="proj-muted"><projection slot="shareStatusDesc"></projection></span>
                </div>
                <div class="proj-share-actions">
                  <projection v-if="domainShared" slot="shareDisable" @done="onShareDone"></projection>
                  <projection v-else slot="shareEnable" @done="onShareDone"></projection>
                  <sdk-button type="primary" size="small" @click="openGrantDialog">{{ t('grants.add') }}</sdk-button>
                </div>
              </div>

              <projection slot="grantsList"></projection>
            </template>
          </template>
        </div>
      </div>
    </div>

    <!-- Copy projection dialog using bound OperationButton -->
    <sdk-dialog
      v-model="copyDialogOpen"
      :title="t('copy.title')"
      width="440px"
      append-to-body
      destroy-on-close
    >
      <sdk-form label-position="top">
        <sdk-form-item :label="t('copy.nameLabel')">
          <sdk-input v-model="copyNameModel"></sdk-input>
        </sdk-form-item>
        <sdk-form-item :label="t('copy.idLabel')">
          <sdk-input v-model="copyIdModel"></sdk-input>
        </sdk-form-item>
      </sdk-form>
      <template #footer>
        <div class="proj-dialog-footer">
          <sdk-button @click="copyDialogOpen = false">{{ t('action.cancel') }}</sdk-button>
          <projection slot="copySubmit" :disabled="!copyReady" @done="onCopyDone"></projection>
        </div>
      </template>
    </sdk-dialog>

    <!-- Delete confirmation dialog using bound OperationButton -->
    <sdk-dialog
      v-model="deleteDialogOpen"
      :title="t('delete.title')"
      width="460px"
      append-to-body
      destroy-on-close
    >
      <div class="proj-dialog-body">
        <p class="proj-muted">{{ t('delete.confirm', { name: selectedLabel || selectedKey }) }}</p>
        <sdk-alert
          v-if="usedByCount > 0"
          type="warning"
          :closable="false"
          :title="t('delete.inUseWarning', { count: usedByCount })"
        ></sdk-alert>
      </div>
      <template #footer>
        <div class="proj-dialog-footer">
          <sdk-button @click="deleteDialogOpen = false">{{ t('action.cancel') }}</sdk-button>
          <projection slot="deleteSubmit" :disabled="deleteRevision == null" @done="onDeleteDone"></projection>
        </div>
      </template>
    </sdk-dialog>

    <!-- Add grant dialog using official ReferencePicker & bound OperationButton -->
    <sdk-dialog
      v-model="grantDialogOpen"
      :title="t('grants.dialogTitle')"
      width="480px"
      append-to-body
      destroy-on-close
    >
      <sdk-form label-position="top">
        <sdk-form-item :label="t('grants.kind')">
          <sdk-segmented v-model="grantPrincipalKindModel" :options="grantKindOptions" size="default"></sdk-segmented>
        </sdk-form-item>
        <sdk-form-item :label="grantPrincipalKindModel === 'role' ? t('grants.role') : t('grants.principal')">
          <projection v-if="grantPrincipalKindModel === 'role'" slot="rolePicker"></projection>
          <projection v-else slot="userPicker"></projection>
        </sdk-form-item>
        <sdk-form-item :label="t('grants.verb')">
          <sdk-select v-model="grantVerbModel" style="width: 100%">
            <sdk-option value="use" :label="t('grants.use')"></sdk-option>
            <sdk-option value="edit" :label="t('grants.edit')"></sdk-option>
          </sdk-select>
        </sdk-form-item>
      </sdk-form>
      <template #footer>
        <div class="proj-dialog-footer">
          <sdk-button @click="grantDialogOpen = false">{{ t('action.cancel') }}</sdk-button>
          <projection slot="grantSubmit" :disabled="!grantPrincipalId" @done="onGrantAdded"></projection>
        </div>
      </template>
    </sdk-dialog>
  </section>
</div>
