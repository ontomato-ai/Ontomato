<!--
  Workflows catalog panel: full-width table with inline row actions and three modals
  (read-only definition view, create workflow draft form, and effective capability grants audit).
  All reads and writes flow through declared platform:Workflow projections and operations.
-->
<style>
  [v-cloak] { display: none; }
  .wf-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: wf-page / inline-size;
  }
  .wf-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .wf-catalog {
    min-width: 0;
  }
  .wf-status-badges {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .wf-catalog .sdk-object-list-table .sdk-object-list-col-shrink {
    min-width: 150px;
    max-width: 210px;
  }
  .wf-catalog .sdk-object-list-table .sdk-object-list-col-shrink .sdk-object-list-cell-main {
    max-width: 186px;
  }
  @container wf-page (min-width: 1360px) {
    .wf-catalog .sdk-object-list-table .sdk-object-list-col-shrink {
      max-width: 28rem;
    }
    .wf-catalog .sdk-object-list-table .sdk-object-list-col-shrink .sdk-object-list-cell-main {
      max-width: 26rem;
    }
  }
  .wf-grant-link {
    display: inline-block;
    max-width: 100%;
    white-space: normal;
    padding: 0;
    border: 0;
    background: none;
    color: var(--brand-link, var(--sdk-color-primary));
    font: inherit;
    font-size: var(--text-xs);
    line-height: 1.5;
    text-align: start;
    cursor: pointer;
  }
  .wf-grant-link:hover {
    text-decoration: underline;
  }
  .wf-grant-link.is-warning {
    color: var(--sdk-color-warning);
  }
  .wf-dialog-body {
    max-height: min(68vh, 42rem);
    overflow-y: auto;
    padding-inline-end: 4px;
    min-width: 0;
  }
  .wf-dialog-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--spacing-sm);
  }
  .wf-grants-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    max-height: min(68vh, 42rem);
    overflow-y: auto;
    padding-inline-end: 4px;
    min-width: 0;
  }
  .wf-grants-body > * {
    flex: 0 0 auto;
    min-width: 0;
  }
  .wf-grants-desc {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    line-height: 1.6;
  }
  .wf-grants-group {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .wf-grants-group h4 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .wf-grants-hint {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: 1.5;
  }
  .wf-grant-role {
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size: var(--text-xs);
  }
</style>
<div id="app" v-cloak>
  <div class="wf-page">
    <page-header :title="t('pageTitle')" :description="t('pageDescription')">
      <template #actions>
        <sdk-button
          text
          icon="refresh-cw"
          :loading="refreshing"
          :aria-label="t('action.refresh')"
          :title="t('action.refresh')"
          @click="refresh"
        ></sdk-button>
        <sdk-button type="primary" icon="plus" @click="startCreate">{{ t('action.newWorkflow') }}</sdk-button>
      </template>
    </page-header>

    <section class="wf-body">
      <div class="wf-catalog">
        <projection slot="catalog" @row-action="onRowAction">
          <template #cell-statusBadges="{ value, tone }">
            <span class="wf-status-badges">
              <sdk-tag
                v-for="(badge, idx) in (Array.isArray(value) ? value : [value])"
                :key="idx"
                size="small"
                effect="light"
                :type="idx === 0 ? (tone === 'success' || tone === 'warning' || tone === 'danger' ? tone : 'info') : 'warning'"
              >
                {{ badge }}
              </sdk-tag>
            </span>
          </template>
          <template #cell-grantsSummary="{ ref, displayText, tone }">
            <button
              type="button"
              class="wf-grant-link"
              :class="{ 'is-warning': tone === 'warning' }"
              :title="displayText"
              @click.stop="openGrants(ref)"
            >
              {{ displayText }}
            </button>
          </template>
        </projection>
      </div>
    </section>

    <!-- Read-only workflow definition modal -->
    <sdk-dialog
      v-model="viewDialogOpen"
      :title="viewDialogTitle"
      width="min(880px, calc(100% - 2rem))"
      append-to-body
      destroy-on-close
    >
      <div v-if="viewDialogOpen" :key="viewingKey" class="wf-dialog-body">
        <projection slot="viewForm"></projection>
      </div>
      <template #footer>
        <div class="wf-dialog-footer">
          <sdk-button @click="closeView">{{ t('action.close') }}</sdk-button>
        </div>
      </template>
    </sdk-dialog>

    <!-- Create workflow draft modal -->
    <sdk-dialog
      v-model="createDialogOpen"
      :before-close="beforeCloseCreate"
      :title="t('create.title')"
      width="min(880px, calc(100% - 2rem))"
      append-to-body
      destroy-on-close
    >
      <div v-if="createDialogOpen" class="wf-dialog-body">
        <projection
          slot="createForm"
          @saved="onCreateSaved"
          @cancel="requestCloseCreate"
          @discarded="closeCreateImmediate"
        ></projection>
      </div>
      <template #footer>
        <div class="wf-dialog-footer">
          <sdk-button @click="requestCloseCreate">{{ t('action.cancel') }}</sdk-button>
          <sdk-button
            type="primary"
            :disabled="!createDraft?.canSave"
            :loading="Boolean(createDraft?.saving)"
            @click="saveCreate"
          >
            {{ t('action.saveDraft') }}
          </sdk-button>
        </div>
      </template>
    </sdk-dialog>

    <!-- Effective capability grants modal -->
    <sdk-dialog
      v-model="grantsDialogOpen"
      :title="grantsDialogTitle"
      width="min(760px, calc(100% - 2rem))"
      append-to-body
      destroy-on-close
    >
      <div
        v-if="grantsDialogOpen"
        :key="inspectingGrantsKey"
        v-sdk-loading="grantsLoading && !grantsHasWorkflowAuthority && !grantsError"
        class="wf-grants-body"
      >
        <p class="wf-grants-desc">{{ t('grants.desc') }}</p>

        <sdk-empty v-if="grantsError" :description="t('grants.unavailable')" :image-size="60"></sdk-empty>
        <sdk-empty v-else-if="grantsEmpty" :description="t('grants.empty')" :image-size="60"></sdk-empty>

        <section v-show="!grantsError && grantStates.caseScoped.count > 0" class="wf-grants-group">
          <h4>{{ t('grants.caseScopedTitle') }}</h4>
          <p class="wf-grants-hint">{{ t('grants.caseScopedHint') }}</p>
          <projection slot="grantCaseScopedSteps">
            <template #cell-roleCode="{ displayText }">
              <span class="wf-grant-role">{{ displayText }}</span>
            </template>
          </projection>
        </section>

        <section v-show="!grantsError && grantStates.inForce.count > 0" class="wf-grants-group">
          <h4><projection slot="grantsInForceTitle"></projection></h4>
          <projection slot="grantInForce">
            <template #cell-roleCode="{ displayText }">
              <span class="wf-grant-role">{{ displayText }}</span>
            </template>
          </projection>
        </section>

        <section v-show="!grantsError && grantStates.superseded.count > 0" class="wf-grants-group">
          <h4>{{ t('grants.supersededTitle') }}</h4>
          <p class="wf-grants-hint">{{ t('grants.supersededHint') }}</p>
          <projection slot="grantSuperseded">
            <template #cell-roleCode="{ displayText }">
              <span class="wf-grant-role">{{ displayText }}</span>
            </template>
          </projection>
        </section>

        <section v-show="!grantsError && grantsHasWorkflowAuthority && grantStates.direct.count > 0" class="wf-grants-group">
          <h4>{{ t('grants.directTitle') }}</h4>
          <p class="wf-grants-hint">{{ t('grants.directHint') }}</p>
          <projection slot="grantDirect">
            <template #cell-roleCode="{ displayText }">
              <span class="wf-grant-role">{{ displayText }}</span>
            </template>
          </projection>
        </section>
      </div>
      <template #footer>
        <div class="wf-dialog-footer">
          <sdk-button :loading="refreshing" @click="refresh">{{ t('grants.refresh') }}</sdk-button>
          <sdk-button type="primary" @click="closeGrants">{{ t('action.close') }}</sdk-button>
        </div>
      </template>
    </sdk-dialog>
  </div>
</div>
