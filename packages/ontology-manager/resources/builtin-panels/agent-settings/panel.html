<!--
  Agents catalog panel: full-width searchable ObjectList table backed by platform:AgentDefinition.list,
  plus a centered creation dialog for minimal required fields (/name and optional /description).
  Shared by Ontology Manager (/ontology/agents -> /ontology/agents/detail) and
  Agent Platform (/agents/settings -> /agents/settings/detail) via the entry-wired `detailPath` input.
-->
<style>
  [v-cloak] { display: none; }
  .agents-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: agents-page / inline-size;
  }
  .agents-catalog {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .agents-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }
  .agents-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .agents-forbidden {
    margin: 0;
    padding: var(--spacing-lg) var(--page-gutter);
    color: var(--sdk-color-danger-text);
    font-size: var(--text-sm);
  }
  .agents-create-body .sdk-owner-form,
  .agents-create-body .sdk-owner-form-inner {
    height: auto;
  }
  .agents-create-body .sdk-owner-form-body {
    overflow: visible;
  }
  .agents-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }

  @container agents-page (max-width: 560px) {
    .agents-catalog {
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + 56px);
    }
  }
</style>
<div id="app" v-cloak>
  <section class="agents-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button v-if="listStatus !== 'forbidden'" type="primary" :disabled="creating" @click="startCreate">
          <svg class="agents-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t("agents.new") }}</span>
        </sdk-button>
      </template>
    </page-header>

    <p v-if="listStatus === 'forbidden'" class="agents-forbidden" role="alert">{{ t("agents.accessDenied") }}</p>
    <div v-show="listStatus !== 'forbidden'" class="agents-catalog">
      <projection slot="list" class="agents-list-slot" @choose="openDetail"></projection>
    </div>

    <sdk-dialog
      v-model="createDialog"
      :title="t('agents.new')"
      width="540px"
      append-to-body
      destroy-on-close
    >
      <div class="agents-create-body">
        <projection
          v-if="createDialog"
          slot="createForm"
          @saved="onCreated"
          @discarded="cancelCreate"
          @cancel="cancelCreate"
        >
          <template #default>
            <object-form-fields :fields="['/name', '/description']"></object-form-fields>
          </template>
        </projection>
      </div>
    </sdk-dialog>
  </section>
</div>
