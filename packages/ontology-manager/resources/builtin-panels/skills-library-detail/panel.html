<style>
  [v-cloak] { display: none; }
  .skill-detail-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: skill-detail-page / inline-size;
  }
  .skill-detail-actions {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--component-gap);
  }
  .skill-detail-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-md);
    padding: var(--spacing-2xl) var(--page-gutter);
    text-align: center;
  }
  .skill-detail-note {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }
  .skill-detail-state-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--spacing-sm);
  }
  .skill-detail-body {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--spacing-lg) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
  }
  .skill-package {
    display: grid;
    grid-template-columns: clamp(13rem, 24%, 18rem) minmax(0, 1fr);
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .package-tree {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-sm);
    overflow: hidden;
    border-right: 1px solid var(--ui-divider);
  }
  .package-viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md) var(--spacing-lg);
    overflow: hidden;
  }
  .skill-fill {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  @container skill-detail-page (max-width: 45rem) {
    .skill-detail-body {
      overflow-y: auto;
      padding: var(--spacing-sm) var(--spacing-md) calc(var(--spacing-md) + var(--pane-dock-space, 0px));
    }
    .skill-package {
      grid-template-columns: minmax(0, 1fr);
      flex: 0 0 auto;
      overflow: visible;
    }
    .package-tree {
      max-height: 14rem;
      border-right: 0;
      border-bottom: 1px solid var(--ui-divider);
    }
    .package-viewer {
      min-height: 20rem;
      padding: var(--spacing-md);
      overflow: visible;
    }
  }
</style>
<div id="app" v-cloak>
  <section class="skill-detail-page">
    <page-header :back-label="t('panel.back')" @back="goBack">
      <template #title>
        <projection v-if="selectedKey" slot="headerTitle" :fallback-title="selectedKey"></projection>
        <h1 v-else>{{ t("panel.detailTitle") }}</h1>
      </template>
      <template v-if="detailReady" #description>
        <projection slot="summary"></projection>
      </template>
      <template #actions>
        <div v-show="detailReady" class="skill-detail-actions">
          <projection slot="exportSkill"></projection>
          <projection slot="remove" @done="onRemoveDone"></projection>
        </div>
      </template>
    </page-header>

    <div v-if="!selectedKey" class="skill-detail-state">
      <sdk-empty :description="t('panel.notFound')"></sdk-empty>
      <div class="skill-detail-state-actions">
        <sdk-button type="primary" @click="goBack">{{ t("panel.back") }}</sdk-button>
      </div>
    </div>
    <div v-else-if="detailStatus === 'loading' || detailStatus === 'awaiting'" class="skill-detail-state" role="status">
      <p class="skill-detail-note">{{ t("panel.loading") }}</p>
    </div>
    <div v-else-if="detailStatus === 'forbidden'" class="skill-detail-state" role="alert">
      <sdk-empty :description="t('panel.forbidden')"></sdk-empty>
      <div class="skill-detail-state-actions">
        <sdk-button @click="goBack">{{ t("panel.back") }}</sdk-button>
      </div>
    </div>
    <div v-else-if="detailStatus === 'error'" class="skill-detail-state" role="alert">
      <sdk-empty :description="detailErrorText"></sdk-empty>
      <div class="skill-detail-state-actions">
        <sdk-button @click="retry">{{ t("panel.retry") }}</sdk-button>
        <sdk-button type="primary" @click="goBack">{{ t("panel.back") }}</sdk-button>
      </div>
    </div>
    <div v-else-if="!detailReady" class="skill-detail-state">
      <sdk-empty :description="t('panel.notFound')"></sdk-empty>
      <div class="skill-detail-state-actions">
        <sdk-button type="primary" @click="goBack">{{ t("panel.back") }}</sdk-button>
      </div>
    </div>

    <div v-if="selectedKey" v-show="detailReady" class="skill-detail-body">
      <div class="skill-package">
        <div class="package-tree">
          <projection slot="tree" class="skill-fill"></projection>
        </div>
        <div class="package-viewer">
          <projection slot="content" class="skill-fill"></projection>
        </div>
      </div>
    </div>
  </section>
</div>
