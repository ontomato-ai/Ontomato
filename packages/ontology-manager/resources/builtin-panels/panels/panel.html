<!--
  Panel directory (product layer): lists panels available in this domain through `ObjectList`, paired with a detail
  pane powered by `ObjectHeader`, `ObjectSummary`, `ObjectTree` + `ObjectTextReader`, official `ObjectList` sub-tables
  (members, usage, grants), bound `OperationButton` / `ReferencePicker` controls, `ObjectForm`, and inline `<projection slot="preview">`.
-->
<style>
  [v-cloak] { display: none; }
  .pd-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: pd-page / inline-size;
  }

  .pd-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .pd-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--page-content-gap);
    align-items: start;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    min-width: 0;
  }

  @container pd-page (min-width: 68rem) {
    .pd-body.with-detail {
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.15fr);
    }
  }

  .pd-pane {
    min-width: 0;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    padding: var(--spacing-md);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }

  .pd-detail {
    container: pd-detail / inline-size;
  }

  .pd-filter-select {
    width: 9.5rem;
  }

  .pd-detail-head {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }

  .pd-detail-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
  }

  .pd-state-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-2xl) var(--spacing-md);
    text-align: center;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }

  .pd-tabs {
    margin-bottom: calc(var(--spacing-xs) * -1);
  }

  .pd-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }

  .pd-section-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }

  .pd-section-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }

  .pd-muted {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }

  .pd-source-grid {
    display: grid;
    grid-template-columns: minmax(10rem, 13.5rem) minmax(0, 1fr);
    min-height: 22rem;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  .pd-source-tree {
    min-width: 0;
    padding: var(--spacing-sm);
    border-inline-end: 1px solid var(--sdk-border-color, var(--ui-border));
    overflow: auto;
  }

  .pd-source-viewer {
    min-width: 0;
    padding: var(--spacing-sm) var(--spacing-md);
    overflow: auto;
  }

  .pd-share-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }

  .pd-share-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .pd-share-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
  }

  .pd-form-wrap :deep(.sdk-owner-form),
  .pd-form-wrap :deep(.sdk-owner-form-inner) {
    height: auto;
  }

  .pd-form-wrap :deep(.sdk-owner-form-body) {
    overflow: visible;
  }

  .pd-preview-box {
    min-width: 0;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    padding: var(--spacing-sm);
    overflow: auto;
  }

  .pd-dialog-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--spacing-sm);
  }

  @container pd-detail (max-width: 40rem) {
    .pd-source-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    .pd-source-tree {
      max-height: 12rem;
      border-inline-end: 0;
      border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    }
  }

  @container pd-page (max-width: 48rem) {
    .pd-filter-select {
      width: 8.5rem;
    }
  }
</style>

<div id="app" v-cloak>
  <section class="pd-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="pd-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t('action.create') }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="pd-body" :class="{ 'with-detail': showDetail }">
      <aside class="pd-pane">
        <projection slot="catalogue">
          <template #filters>
            <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="default"></sdk-segmented>
            <sdk-select v-model="sortModel" class="pd-filter-select" :aria-label="t('list.sort')">
              <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
              <sdk-option value="name" :label="t('sort.name')"></sdk-option>
            </sdk-select>
            <sdk-select v-model="templateFilterModel" class="pd-filter-select" :aria-label="t('list.template')">
              <sdk-option value="all" :label="t('template.all')"></sdk-option>
              <sdk-option value="template" :label="t('template.only')"></sdk-option>
              <sdk-option value="ordinary" :label="t('template.ordinary')"></sdk-option>
            </sdk-select>
          </template>
        </projection>
      </aside>

      <main v-if="showDetail" class="pd-pane pd-detail">
        <!-- Edit or create form -->
        <section v-if="isFormMode" class="pd-section">
          <div class="pd-section-bar">
            <h2 class="pd-section-title">{{ creating ? t('form.new') : t('form.edit') }}</h2>
            <sdk-button size="small" @click="cancelForm">{{ t('action.cancel') }}</sdk-button>
          </div>
          <div class="pd-form-wrap">
            <projection slot="form" @saved="onSaved" @discarded="cancelForm" @cancel="cancelForm"></projection>
          </div>
        </section>

        <!-- Detail view -->
        <template v-else-if="selectedKey">
          <div class="pd-detail-head">
            <projection slot="headerTitle" :fallback-title="selectedKey">
              <template v-if="recordReady" #actions>
                <div class="pd-detail-actions">
                  <sdk-button v-if="canEdit" size="small" type="primary" plain @click="startEdit">{{ t('action.edit') }}</sdk-button>
                  <sdk-button v-if="canEdit" size="small" @click="openCopyDialog('copy')">{{ t('action.copy') }}</sdk-button>
                  <sdk-button v-if="isTemplate" size="small" @click="openCopyDialog('fromTemplate')">{{ t('action.fromTemplate') }}</sdk-button>
                  <sdk-button v-if="canEdit" size="small" @click="openCopyDialog('saveAsTemplate')">{{ t('action.saveAsTemplate') }}</sdk-button>
                  <projection v-if="canDelete" slot="deletePanel" @done="onDeleteDone"></projection>
                  <sdk-button size="small" text @click="closeDetail">{{ t('action.close') }}</sdk-button>
                </div>
              </template>
            </projection>
          </div>

          <div v-if="recordStatus === 'loading' || recordStatus === 'awaiting'" class="pd-state-box">
            <span>{{ t('detail.loading') }}</span>
          </div>
          <div v-else-if="recordStatus === 'forbidden'" class="pd-state-box">
            <span>{{ t('detail.forbidden') }}</span>
            <sdk-button size="small" @click="closeDetail">{{ t('action.close') }}</sdk-button>
          </div>
          <div v-else-if="recordStatus === 'error' || recordStatus === 'empty'" class="pd-state-box">
            <span>{{ recordErrorText }}</span>
            <sdk-button size="small" @click="refresh">{{ t('action.retry') }}</sdk-button>
          </div>

          <template v-else-if="recordReady">
            <info-banner v-if="!canEdit" tone="info" :text="t('detail.readonly')"></info-banner>

            <sdk-tabs v-model="tabModel" class="pd-tabs">
              <sdk-tab-pane name="overview" :label="t('tab.overview')"></sdk-tab-pane>
              <sdk-tab-pane name="source" :label="t('tab.source')"></sdk-tab-pane>
              <sdk-tab-pane name="members" :label="t('tab.members')"></sdk-tab-pane>
              <sdk-tab-pane name="usage" :label="t('tab.usage')"></sdk-tab-pane>
              <sdk-tab-pane v-if="canGrant" name="grants" :label="t('tab.grants')"></sdk-tab-pane>
              <sdk-tab-pane name="preview" :label="t('tab.preview')"></sdk-tab-pane>
            </sdk-tabs>

            <!-- Tab 1: Overview -->
            <section v-if="tabModel === 'overview'" class="pd-section">
              <projection slot="overviewSummary"></projection>
            </section>

            <!-- Tab 2: Source files (ObjectTree + ObjectTextReader) -->
            <section v-else-if="tabModel === 'source'" class="pd-section">
              <div class="pd-source-grid">
                <div class="pd-source-tree">
                  <projection slot="sourceTree"></projection>
                </div>
                <div class="pd-source-viewer">
                  <projection slot="sourceViewer"></projection>
                </div>
              </div>
            </section>

            <!-- Tab 3: Members -->
            <section v-else-if="tabModel === 'members'" class="pd-section">
              <projection slot="membersList" @navigate="onNavigateReference"></projection>
            </section>

            <!-- Tab 4: Usage -->
            <section v-else-if="tabModel === 'usage'" class="pd-section">
              <div class="pd-section-bar">
                <sdk-button size="small" @click="openAddress('/ontology/applications')">{{ t('action.allApplications') }}</sdk-button>
              </div>
              <info-banner
                v-if="hiddenUsedByCount > 0"
                tone="info"
                :text="t('usage.hidden', { count: hiddenUsedByCount })"
              ></info-banner>
              <projection
                slot="usedByList"
                @navigate="onNavigateReference"
                @row-action="onUsedByRowAction"
              ></projection>
            </section>

            <!-- Tab 5: Grants & Domain Sharing -->
            <section v-else-if="tabModel === 'grants' && canGrant" class="pd-section">
              <div class="pd-share-bar">
                <div class="pd-share-left">
                  <strong class="pd-section-title">{{ t('grants.shareTitle') }}</strong>
                  <span class="pd-muted"><projection slot="shareStatusDesc"></projection></span>
                  <span class="pd-muted">{{ t('grants.shareNote') }}</span>
                </div>
                <div class="pd-share-actions">
                  <projection v-if="domainShared" slot="shareDisable" @done="onShareDone"></projection>
                  <projection v-else slot="shareEnable" @done="onShareDone"></projection>
                  <sdk-button type="primary" size="small" @click="openGrantDialog">{{ t('action.addGrant') }}</sdk-button>
                </div>
              </div>
              <projection slot="grantsList"></projection>
            </section>

            <!-- Tab 6: Live Inline Preview -->
            <section v-else-if="tabModel === 'preview'" class="pd-section">
              <h3 class="pd-section-title">{{ t('preview.live') }}</h3>
              <div class="pd-preview-box">
                <projection slot="preview"></projection>
              </div>
            </section>
          </template>
        </template>
      </main>
    </div>

    <!-- Copy / Save as template / Create from template dialog -->
    <sdk-dialog
      v-model="copyDialogOpen"
      :title="copyDialogTitle"
      width="480px"
      append-to-body
      destroy-on-close
    >
      <sdk-form label-position="top">
        <p class="pd-muted" style="margin-bottom: var(--spacing-sm);">{{ copyDialogNote }}</p>
        <sdk-form-item :label="t('copy.newId')">
          <sdk-input v-model="copyIdModel" :placeholder="t('copy.idPlaceholder')"></sdk-input>
        </sdk-form-item>
        <sdk-form-item :label="t('copy.newName')">
          <sdk-input v-model="copyNameModel"></sdk-input>
        </sdk-form-item>
      </sdk-form>
      <template #footer>
        <div class="pd-dialog-footer">
          <sdk-button @click="copyDialogOpen = false">{{ t('action.cancel') }}</sdk-button>
          <projection
            slot="copySubmit"
            :label-key="copyActionLabelKey"
            :disabled="!canSubmitCopy"
            @done="onCopyDone"
          ></projection>
        </div>
      </template>
    </sdk-dialog>

    <!-- Add Grant dialog using official ReferencePicker & OperationButton -->
    <sdk-dialog
      v-model="grantDialogOpen"
      :title="t('grants.dialogTitle')"
      width="480px"
      append-to-body
      destroy-on-close
    >
      <sdk-form label-position="top">
        <sdk-form-item :label="t('grants.kind')">
          <sdk-segmented v-model="grantPrincipalKindModel" :options="grantKindOptions" size="default"></sdk-segmented>
        </sdk-form-item>
        <sdk-form-item :label="grantPrincipalKindModel === 'role' ? t('grants.role') : t('grants.principal')">
          <projection v-if="grantPrincipalKindModel === 'role'" slot="rolePicker"></projection>
          <projection v-else slot="userPicker"></projection>
        </sdk-form-item>
        <sdk-form-item :label="t('grants.verb')">
          <sdk-select v-model="grantVerbModel" style="width: 100%">
            <sdk-option value="use" :label="t('grants.use')"></sdk-option>
            <sdk-option value="edit" :label="t('grants.edit')"></sdk-option>
          </sdk-select>
        </sdk-form-item>
      </sdk-form>
      <template #footer>
        <div class="pd-dialog-footer">
          <sdk-button @click="grantDialogOpen = false">{{ t('action.cancel') }}</sdk-button>
          <projection slot="grantSubmit" :disabled="!grantPrincipalId" @done="onGrantAdded"></projection>
        </div>
      </template>
    </sdk-dialog>
  </section>
</div>
