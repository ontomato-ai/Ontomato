<!--
  Panels catalog (product layer): full-width directory of domain-available panels powered by `ObjectList`,
  plus an unavailable panels section and a centered `<sdk-dialog>` create form (`ObjectForm`).
-->
<style>
  [v-cloak] { display: none; }
  .pd-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: pd-page / inline-size;
  }

  .pd-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .pd-catalog {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }

  .pd-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }

  .pd-filter-select {
    width: 9.5rem;
  }

  .pd-unavailable-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    min-width: 0;
  }

  .pd-section-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }

  .pd-section-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }

  .pd-create-body .sdk-owner-form,
  .pd-create-body .sdk-owner-form-inner {
    height: auto;
  }

  .pd-create-body .sdk-owner-form-body {
    overflow: visible;
  }

  @container pd-page (max-width: 48rem) {
    .pd-filter-select {
      width: 8.5rem;
    }
  }
</style>

<div id="app" v-cloak>
  <section class="pd-page">
    <page-header :title="t('panel.name')" :description="t('panel.description')">
      <template #actions>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="pd-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          <span>{{ t('action.create') }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="pd-catalog">
      <projection slot="catalogue" class="pd-list-slot" @choose="openDetail">
        <template #filters>
          <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="default"></sdk-segmented>
          <sdk-select v-model="sortModel" class="pd-filter-select" :aria-label="t('list.sort')">
            <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
            <sdk-option value="name" :label="t('sort.name')"></sdk-option>
          </sdk-select>
          <sdk-select v-model="templateFilterModel" class="pd-filter-select" :aria-label="t('list.template')">
            <sdk-option value="all" :label="t('template.all')"></sdk-option>
            <sdk-option value="template" :label="t('template.only')"></sdk-option>
            <sdk-option value="ordinary" :label="t('template.ordinary')"></sdk-option>
          </sdk-select>
        </template>
      </projection>

      <section v-show="hasUnavailablePanels" class="pd-unavailable-section">
        <div class="pd-section-bar">
          <h2 class="pd-section-title">{{ t('unavailable.title') }}</h2>
        </div>
        <projection slot="unavailableList" @choose="openDetail"></projection>
      </section>
    </div>

    <sdk-dialog
      v-model="createDialog"
      :title="t('action.create')"
      width="560px"
      append-to-body
      destroy-on-close
    >
      <div class="pd-create-body">
        <projection
          v-if="createDialog"
          slot="createForm"
          @saved="onCreated"
          @discarded="onCreateCancelled"
          @cancel="onCreateCancelled"
        >
          <template #default>
            <object-form-fields :fields="['/name', '/id', '/description', '/visibility', '/template']"></object-form-fields>
          </template>
        </projection>
      </div>
    </sdk-dialog>
  </section>
</div>
