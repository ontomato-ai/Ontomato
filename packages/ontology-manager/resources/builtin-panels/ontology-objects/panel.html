<style>
  .ot-root {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: objects-page / inline-size;
  }

  .ot-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .ot-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ot-toolbar .ot-search {
    width: 260px;
    max-width: 100%;
  }
  .ot-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .ot-count {
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .ot-table-host {
    margin-top: var(--spacing-lg);
    min-width: 0;
  }
  .ot-table-host .sdk-object-list,
  .ot-detail-list-host .sdk-object-list {
    height: auto;
    gap: 0;
  }
  .ot-table-host .sdk-object-list-table td {
    height: var(--list-row-height, 44px);
  }
  .ot-table-host .sdk-object-list-table td:first-child .sdk-object-list-cell-main,
  .ot-detail-list-host .sdk-object-list-table td:first-child .sdk-object-list-cell-main {
    color: var(--sdk-text-color-primary);
    font-weight: var(--font-semibold);
  }
  .ot-table-host .sdk-object-list-table td:nth-child(2) .sdk-object-list-cell-main {
    color: var(--sdk-text-color-secondary);
  }
  .ot-detail-list-host {
    margin-top: var(--spacing-md);
    min-width: 0;
  }
  .ot-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .ot-status {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .ot-failure {
    color: var(--sdk-color-danger-text);
  }

  .ot-detail-view {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
  }
  .ot-missing {
    display: flex;
    flex: 1 1 auto;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-2xl) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .ot-detail-body {
    display: grid;
    grid-template-columns: minmax(280px, 0.85fr) minmax(440px, 1.5fr);
    gap: var(--page-content-gap);
    padding: var(--page-content-gap) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    align-items: start;
  }
  .ot-detail-main {
    display: flex;
    flex-direction: column;
    gap: var(--page-content-gap);
    min-width: 0;
  }
  .ot-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--page-section-padding, var(--spacing-lg));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .ot-card-title {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm) var(--spacing-md);
  }
  .ot-card-title-group {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ot-card-title h2 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .ot-pill-count {
    padding: 2px 8px;
    border-radius: var(--radius-full, 999px);
    background: var(--sdk-fill-color-light, var(--ui-fill-tertiary));
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }
  .ot-basic-form {
    margin-top: var(--spacing-md);
  }
  .ot-basic-form .sdk-owner-form,
  .ot-basic-form .sdk-owner-form-inner,
  .ot-create-body .sdk-owner-form,
  .ot-create-body .sdk-owner-form-inner,
  .ot-drawer-body .sdk-owner-form,
  .ot-drawer-body .sdk-owner-form-inner {
    height: auto;
  }
  .ot-basic-form .sdk-owner-form-body,
  .ot-create-body .sdk-owner-form-body,
  .ot-drawer-body .sdk-owner-form-body {
    overflow: visible;
  }
  .ot-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }
  .ot-summary {
    margin-top: var(--spacing-lg);
    padding-top: var(--spacing-md);
    border-top: 1px solid var(--sdk-border-color-light, var(--ui-divider));
  }
  .ot-pk-alert {
    margin-top: var(--spacing-md);
  }
  .ot-create-body {
    padding-top: var(--spacing-xs);
  }
  .ot-drawer-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .ot-drawer-footer {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .ot-drawer-footer-group {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--spacing-sm);
  }

  @container objects-page (max-width: 900px) {
    .ot-detail-body {
      grid-template-columns: minmax(0, 1fr);
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + 56px);
    }
  }
  @container objects-page (max-width: 560px) {
    .ot-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .ot-toolbar .ot-search {
      width: 100%;
    }
  }
</style>
<div id="app">
  <section ref="rootRef" class="ot-root">
    <!-- Catalog view: official ObjectList table; clicking a row opens detail view. -->
    <template v-if="!selectedKey">
      <page-header :title="t('panel.name')" :description="t('panel.description')">
        <template #actions>
          <sdk-button text :aria-label="t('ot.refresh')" :title="t('ot.refresh')" @click="refresh">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          </sdk-button>
          <sdk-button type="primary" :disabled="creating" @click="startCreate">
            <svg class="ot-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            <span>{{ t("ot.command.create") }}</span>
          </sdk-button>
        </template>
      </page-header>
      <div class="ot-catalog">
        <div class="ot-toolbar">
          <sdk-input v-model="search" class="ot-search" :placeholder="t('ot.search')" :aria-label="t('ot.search')" clearable>
            <template #prefix>
              <svg class="ot-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
            </template>
          </sdk-input>
          <span v-if="catalogCount !== null" class="ot-count">{{ t("ot.items", { count: catalogCount }) }}</span>
        </div>
        <div class="ot-table-host">
          <projection slot="catalog" @choose="openClass">
            <template #empty>
              <sdk-empty :description="t('ot.empty')"></sdk-empty>
            </template>
          </projection>
        </div>
      </div>
    </template>

    <!-- Detail view -->
    <div v-else class="ot-detail-view">
      <page-header :back-label="t('ot.back')" :draft="objectDraft" @back="goBack">
        <template #title>
          <span v-show="detailStatus === 'ready'">
            <projection slot="detail"></projection>
          </span>
          <h1 v-if="detailStatus !== 'ready'">{{ selectedKey }}</h1>
        </template>
        <template #actions>
          <template v-if="detailStatus === 'ready'">
            <sdk-button @click="configureView">
              <svg class="ot-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
              <span>{{ t("ot.configureView") }}</span>
            </sdk-button>
            <projection slot="deleteObject" @done="onDeleteObjectDone"></projection>
            <sdk-button @click="browseData">
              <svg class="ot-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/></svg>
              <span>{{ t("ot.browseData") }}</span>
            </sdk-button>
          </template>
        </template>
      </page-header>

      <p v-if="detailStatus === 'loading'" class="ot-status" role="status">{{ t("ot.loading") }}</p>
      <p v-else-if="detailStatus === 'forbidden'" class="ot-status ot-failure">{{ t("ot.forbidden") }}</p>
      <div v-else-if="detailStatus !== 'ready'" class="ot-missing">
        <sdk-empty :description="t('ot.missing')"></sdk-empty>
      </div>

      <div v-else class="ot-detail-body">
        <section class="ot-card">
          <div class="ot-card-title">
            <h2>{{ t("ot.basicInfo") }}</h2>
          </div>
          <div class="ot-basic-form">
            <projection slot="objectForm" @saved="objectSaved" @discarded="formDiscarded"></projection>
          </div>
          <div class="ot-summary">
            <projection slot="summary"></projection>
          </div>
          <info-banner
            v-if="primaryKeyStatus === 'ok'"
            class="ot-pk-alert"
            compact
            tone="success"
            :text="t('ot.pkOk', { name: primaryKeyName || '-' })"
          ></info-banner>
          <info-banner
            v-else-if="primaryKeyStatus === 'missing'"
            class="ot-pk-alert"
            compact
            tone="warning"
            :text="t('ot.pkMissing')"
          ></info-banner>
          <info-banner
            v-else-if="primaryKeyStatus === 'multiple'"
            class="ot-pk-alert"
            compact
            tone="danger"
            :text="t('ot.pkMultiple')"
          ></info-banner>
          <info-banner
            v-else-if="primaryKeyStatus === 'disabled'"
            class="ot-pk-alert"
            compact
            tone="warning"
            :text="t('ot.pkDisabled')"
          ></info-banner>
          <info-banner
            v-else-if="primaryKeyStatus"
            class="ot-pk-alert"
            compact
            tone="info"
            :text="t('ot.pkUnknown', { status: primaryKeyStatus })"
          ></info-banner>
        </section>

        <div class="ot-detail-main">
          <section class="ot-card">
            <div class="ot-card-title">
              <div class="ot-card-title-group">
                <h2>{{ t("ot.attributes") }}</h2>
                <span v-if="attributeCount !== null" class="ot-pill-count">{{ t("ot.items", { count: attributeCount }) }}</span>
              </div>
              <sdk-button @click="startCreateAttribute">
                <svg class="ot-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>{{ t("ot.createAttribute") }}</span>
              </sdk-button>
            </div>
            <div class="ot-detail-list-host">
              <projection slot="attributes">
                <template #empty>
                  <sdk-empty :description="t('ot.noAttributes')" :image-size="72"></sdk-empty>
                </template>
              </projection>
            </div>
          </section>

          <section class="ot-card">
            <div class="ot-card-title">
              <div class="ot-card-title-group">
                <h2>{{ t("ot.relations") }}</h2>
                <span v-if="relationCount !== null" class="ot-pill-count">{{ t("ot.items", { count: relationCount }) }}</span>
              </div>
            </div>
            <div class="ot-detail-list-host">
              <projection slot="relations" @choose="openRelation">
                <template #empty>
                  <sdk-empty :description="t('ot.noRelations')" :image-size="72"></sdk-empty>
                </template>
              </projection>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- Edit attribute drawer (mutually exclusive with create attribute dialog). -->
    <sdk-drawer
      :model-value="editAttributeDrawer"
      :size="drawerSize"
      :before-close="handleAttributeDrawerClose"
      append-to-body
      destroy-on-close
    >
      <template #header>
        <projection v-if="editAttributeDrawer" slot="attributeDetail"></projection>
      </template>
      <div class="ot-drawer-body">
        <projection v-if="editAttributeDrawer" slot="attributeForm" @saved="attributeSaved" @discarded="closeAttribute"></projection>
      </div>
      <template v-if="editAttributeDrawer && attributeDetailStatus === 'ready'" #footer>
        <div class="ot-drawer-footer">
          <div class="ot-drawer-footer-group">
            <projection v-if="isPrimaryKey === false" slot="setPrimaryKey" @done="onSetPrimaryKeyDone"></projection>
            <projection slot="deleteAttribute" @done="onDeleteAttributeDone"></projection>
          </div>
          <div class="ot-drawer-footer-group">
            <sdk-button v-if="attributeDraft && attributeDraft.dirty" :disabled="attributeDraft.saving" @click="attributeDraft.discard()">
              {{ t("ot.discard") }}
            </sdk-button>
            <sdk-button
              type="primary"
              :loading="Boolean(attributeDraft && attributeDraft.saving)"
              :disabled="!attributeDraft || !attributeDraft.canSave"
              @click="attributeDraft && attributeDraft.save()"
            >
              {{ t("ot.save") }}
            </sdk-button>
          </div>
        </div>
      </template>
    </sdk-drawer>

    <!-- Create object type dialog (mutually exclusive with detail view since creating clears selected). -->
    <sdk-dialog v-model="createObjectDialog" :title="t('ot.create')" :width="dialogWidth" append-to-body destroy-on-close>
      <div class="ot-create-body">
        <projection v-if="createObjectDialog" slot="objectForm" @saved="objectSaved" @discarded="formDiscarded" @cancel="cancelCreate"></projection>
      </div>
    </sdk-dialog>

    <!-- Create attribute dialog inside detail view (mutually exclusive with edit attribute drawer). -->
    <sdk-dialog v-model="createAttributeDialog" :title="t('ot.attributeCreator')" :width="dialogWidth" append-to-body destroy-on-close>
      <div class="ot-create-body">
        <projection v-if="createAttributeDialog" slot="attributeForm" @saved="attributeSaved" @discarded="cancelCreateAttribute" @cancel="cancelCreateAttribute"></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
