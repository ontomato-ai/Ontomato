<style>
  .ot-root {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: objects-page / inline-size;
  }

  /* Catalog view: own page gutter matching original OntologyModelCatalog, plus scroll clearance for floating composer. */
  .ot-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + 56px);
  }
  .ot-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ot-toolbar .ot-search {
    width: 260px;
    max-width: 100%;
  }
  .ot-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .ot-count {
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .ot-table {
    max-width: 100%;
    margin-top: var(--spacing-lg);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: auto;
  }
  .ot-row {
    display: grid;
    align-items: center;
    column-gap: var(--spacing-md);
    width: 100%;
    box-sizing: border-box;
    border: 0;
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-regular);
    font: inherit;
    font-size: var(--text-sm);
    text-align: left;
    transition: background-color var(--transition-fast);
  }
  .ot-row:last-child {
    border-bottom: 0;
  }
  .ot-head {
    min-height: var(--table-head-height, 36px);
    padding: 0 var(--spacing-md);
    border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    background: var(--sdk-fill-color, var(--ui-fill-tertiary));
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  button.ot-row {
    min-height: var(--list-row-height, 44px);
    padding: 8px var(--spacing-md);
    cursor: pointer;
  }
  button.ot-row:hover {
    background: var(--sdk-fill-color-light, var(--ui-fill-tertiary));
  }
  .ot-catalog-grid {
    grid-template-columns: minmax(220px, 1.4fr) minmax(240px, 2fr) 88px 88px 20px;
  }
  .ot-chevron {
    color: var(--sdk-text-color-placeholder);
    justify-self: end;
  }
  .ot-name {
    min-width: 0;
  }
  .ot-name strong,
  .ot-name small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ot-name strong {
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .ot-name small {
    margin-top: 2px;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }
  .ot-ellipsis {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ot-catalog-desc {
    color: var(--sdk-text-color-secondary);
  }
  .ot-status {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .ot-failure {
    color: var(--sdk-color-danger-text);
  }
  .ot-create-body {
    padding-top: var(--spacing-xs);
  }

  @container objects-page (max-width: 900px) {
    .ot-catalog-grid {
      grid-template-columns: minmax(190px, 1fr) 64px 20px;
    }
    .ot-catalog-grid > :nth-child(2),
    .ot-catalog-grid > :nth-child(4) {
      display: none;
    }
  }
  @container objects-page (max-width: 560px) {
    .ot-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .ot-toolbar .ot-search {
      width: 100%;
    }
  }
</style>
<div id="app">
  <section class="ot-root">
    <!-- Catalog: full-width table of object types; clicking any row opens the dedicated detail entry. -->
    <div class="ot-catalog">
      <div class="ot-toolbar">
        <sdk-input v-model="search" class="ot-search" :placeholder="t('ot.search')" clearable>
          <template #prefix>
            <svg class="ot-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          </template>
        </sdk-input>
        <span v-if="catalogCount !== null" class="ot-count">{{ t("ot.items", { count: catalogCount }) }}</span>
      </div>
      <div class="ot-table">
        <div class="ot-row ot-head ot-catalog-grid">
          <span>{{ t("ot.colType") }}</span>
          <span>{{ t("ot.colDescription") }}</span>
          <span>{{ t("ot.colAttributes") }}</span>
          <span>{{ t("ot.colBusinessKeys") }}</span>
          <span></span>
        </div>
        <p v-if="catalog.status === 'loading'" class="ot-status" role="status">{{ t("ot.loading") }}</p>
        <p v-else-if="catalog.status === 'forbidden'" class="ot-status ot-failure">{{ t("ot.forbidden") }}</p>
        <p v-else-if="catalog.status === 'error'" class="ot-status ot-failure">{{ catalog.message }}</p>
        <template v-else>
          <button v-for="row in filteredRows" :key="row.primaryKey" type="button" class="ot-row ot-catalog-grid"
            @click="openClass(row.primaryKey)">
            <span class="ot-name"><strong>{{ row.label }}</strong><small>{{ row.fields.className }}</small></span>
            <span class="ot-ellipsis ot-catalog-desc">{{ row.fields.classDesc }}</span>
            <span>{{ row.fields.attributeCount }}</span>
            <span>{{ row.fields.businessKeyCount }}</span>
            <svg class="ot-chevron" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
          </button>
          <sdk-empty v-if="filteredRows.length === 0" :description="t('ot.empty')"></sdk-empty>
        </template>
      </div>
    </div>

    <!-- Create object type dialog -->
    <sdk-dialog v-model="createObjectDialog" :title="t('ot.create')" width="520px" append-to-body destroy-on-close>
      <div class="ot-create-body">
        <projection v-if="createObjectDialog" slot="createForm" @saved="objectSaved" @discarded="cancelCreate" @cancel="cancelCreate"></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
