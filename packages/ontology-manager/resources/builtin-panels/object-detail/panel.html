<style>
  .od-root {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: object-detail-page / inline-size;
  }

  .od-probe {
    display: none;
  }

  .od-body {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .od-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }

  .od-title-group {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
    max-width: 100%;
  }

  .od-title-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .od-favorite {
    flex-shrink: 0;
    width: var(--control-height, 32px);
    min-height: var(--control-height, 32px);
    padding: 0;
    color: var(--sdk-text-color-secondary);
  }

  .od-favorite.od-star-active {
    color: var(--sdk-color-primary);
  }

  .od-dialog-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }

  .od-dialog-section-label {
    margin: 0 0 var(--spacing-xs);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
  }

  .od-dialog-summary {
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color-light, var(--ui-divider));
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-lighter, var(--ui-fill-quaternary));
  }

  .od-dialog-form .sdk-owner-form,
  .od-dialog-form .sdk-owner-form-inner {
    height: auto;
  }

  .od-dialog-form .sdk-owner-form-body {
    overflow: visible;
  }

  .od-dialog-extras {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding-top: var(--spacing-sm);
    border-top: 1px solid var(--sdk-border-color-light, var(--ui-divider));
  }
</style>
<div id="app">
  <section ref="rootRef" class="od-root">
    <!-- Non-visual probes keeping owner reads live for header capability and favorite status outputs. -->
    <div v-if="selectedClassKey" class="od-probe" aria-hidden="true">
      <projection slot="detailBinding"></projection>
    </div>
    <div v-if="hasSelected" class="od-probe" aria-hidden="true">
      <projection slot="favoriteStatus"></projection>
    </div>

    <page-header :back-label="t('od.back')" @back="goBack">
      <template #title>
        <span class="od-title-group">
          <span v-if="hasSelected" v-show="headerStatus === 'ready'" class="od-title-text">
            <projection slot="headerTitle"></projection>
          </span>
          <h1 v-if="!hasSelected || headerStatus !== 'ready'" class="od-title-text">{{ fallbackHeading }}</h1>
          <sdk-button
            v-if="hasSelected"
            text
            class="od-favorite"
            :class="{ 'od-star-active': favorited }"
            :loading="favoriteBusy"
            :disabled="favoriteBusy || headerStatus !== 'ready'"
            :aria-label="favorited ? t('od.favoriteRemove') : t('od.favoriteAdd')"
            :aria-pressed="favorited"
            :title="favorited ? t('od.favoriteRemove') : t('od.favoriteAdd')"
            @click="toggleFavorite"
          >
            <svg
              v-if="!favoriteBusy"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              :fill="favorited ? 'currentColor' : 'none'"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
          </sdk-button>
        </span>
      </template>
      <template #actions>
        <sdk-button text :loading="refreshing" :aria-label="t('od.refresh')" :title="t('od.refresh')" @click="refresh">
          <svg v-if="!refreshing" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </sdk-button>
        <sdk-button v-if="hasSelected && canConfigure" @click="openConfigureDialog">
          <svg class="od-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
          <span>{{ t("od.configurePresentation") }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="od-body">
      <projection slot="body"></projection>
    </div>

    <!-- In-page presentation configuration dialog (local UI state only, never enters URL). -->
    <sdk-dialog
      v-model="configureDialog"
      :title="t('od.configureTitle')"
      :width="dialogWidth"
      :before-close="handleConfigureDialogClose"
      append-to-body
      destroy-on-close
    >
      <div v-if="configureDialog && selectedClassKey" class="od-dialog-body">
        <div class="od-dialog-summary">
          <p class="od-dialog-section-label">{{ t("od.currentBinding") }}</p>
          <projection slot="detailBindingSummary"></projection>
        </div>
        <div class="od-dialog-form">
          <projection slot="detailPanelForm" @saved="onDetailPanelSaved">
            <template #field-panelId>
              <projection slot="detailPanelPicker"></projection>
            </template>
          </projection>
        </div>
        <div class="od-dialog-extras">
          <projection slot="clearDetailPanel" @done="onDetailPanelCleared"></projection>
          <sdk-button text type="primary" @click="openPanelsDirectory">
            {{ t("od.managePanels") }}
          </sdk-button>
        </div>
      </div>
    </sdk-dialog>
  </section>
</div>
