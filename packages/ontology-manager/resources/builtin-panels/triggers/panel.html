<style>
  [v-cloak] {
    display: none;
  }
  .triggers-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: triggers-page / inline-size;
  }
  .triggers-search {
    width: 200px;
    max-width: 100%;
  }
  .triggers-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .triggers-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  .triggers-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
    min-height: 0;
    padding: var(--page-content-gap) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .triggers-note {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs) var(--spacing-sm);
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: 1.5;
  }
  .triggers-note-icon {
    flex-shrink: 0;
    color: var(--sdk-text-color-secondary);
  }
  .triggers-note-text {
    flex: 1 1 260px;
    min-width: 0;
  }
  .triggers-stats {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    flex-shrink: 0;
  }
  .triggers-stat-inner {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
  }
  .triggers-stat-count {
    display: inline-flex;
    align-items: baseline;
  }
  .triggers-table-host {
    min-width: 0;
  }
  .triggers-table-host .sdk-object-list {
    height: auto;
  }

  @container triggers-page (max-width: 640px) {
    .triggers-search {
      width: 160px;
      flex: 1 1 140px;
    }
  }
</style>
<div id="app" v-cloak>
  <section class="triggers-page">
    <page-header :title="t('page.title')" :description="t('page.description')">
      <template #actions>
        <sdk-input
          class="triggers-search"
          v-model="search"
          :placeholder="t('search.placeholder')"
          :aria-label="t('search.placeholder')"
          clearable
        >
          <template #prefix>
            <svg class="triggers-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" />
              <path d="m10.5 10.5 3 3" />
            </svg>
          </template>
        </sdk-input>
        <sdk-button text :aria-label="t('action.refresh')" :title="t('action.refresh')" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="triggers-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          <span>{{ t("action.new") }}</span>
        </sdk-button>
      </template>
    </page-header>

    <div class="triggers-body">
      <p class="triggers-note">
        <svg class="triggers-note-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5" />
          <path d="M16 2v4" />
          <path d="M8 2v4" />
          <path d="M3 10h5" />
          <path d="M17.5 17.5 16 16.3V14" />
          <circle cx="16" cy="16" r="6" />
        </svg>
        <span class="triggers-note-text">{{ t("note.text") }}</span>
        <span class="triggers-stats">
          <sdk-tag size="small" effect="plain" type="info">
            <span class="triggers-stat-inner">
              <span>{{ t("stats.armed") }}</span>
              <projection slot="armedStats" class="triggers-stat-count"></projection>
            </span>
          </sdk-tag>
          <sdk-tag size="small" effect="plain" type="info">
            <span class="triggers-stat-inner">
              <span>{{ t("stats.total") }}</span>
              <projection slot="totalStats" class="triggers-stat-count"></projection>
            </span>
          </sdk-tag>
        </span>
      </p>

      <div class="triggers-table-host">
        <projection slot="triggers" @row-action="onRowAction"></projection>
      </div>
    </div>

    <sdk-dialog
      v-model="dialog"
      :title="dialogTitle"
      width="min(39rem, calc(100% - 2rem))"
      append-to-body
      destroy-on-close
    >
      <div
        v-if="dialogOpen"
        :key="creating ? 'create' : editing.primaryKey"
        style="display: flex; flex-direction: column; min-width: 0; padding-top: 2px;"
      >
        <projection
          v-if="creating"
          slot="createForm"
          @saved="onFormSaved"
          @discarded="closeDialog"
          @cancel="closeDialog"
        ></projection>
        <projection
          v-else-if="editing"
          slot="editForm"
          @saved="onFormSaved"
          @discarded="closeDialog"
          @cancel="closeDialog"
        ></projection>
      </div>
      <template #footer>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-sm);">
          <sdk-button :disabled="Boolean(activeDraft && activeDraft.saving)" @click="cancelDialog">
            {{ t("action.cancel") }}
          </sdk-button>
          <sdk-button
            type="primary"
            :loading="Boolean(activeDraft && activeDraft.saving)"
            :disabled="!activeDraft || !activeDraft.canSave"
            @click="activeDraft && activeDraft.save()"
          >
            {{ t("action.save") }}
          </sdk-button>
        </div>
      </template>
    </sdk-dialog>
  </section>
</div>
