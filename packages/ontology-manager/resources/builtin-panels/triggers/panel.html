<style>
  [v-cloak] {
    display: none;
  }
  .triggers-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: triggers-page / inline-size;
  }
  .triggers-search {
    width: 200px;
    max-width: 100%;
  }
  .triggers-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
    min-height: 0;
    padding: var(--page-content-gap) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .triggers-note {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs) var(--spacing-sm);
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: 1.5;
  }
  .triggers-note-icon {
    flex-shrink: 0;
    color: var(--sdk-text-color-secondary);
  }
  .triggers-note-text {
    flex: 1 1 260px;
    min-width: 0;
  }
  .triggers-stats {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    flex-shrink: 0;
  }
  .triggers-stat-chip {
    display: inline-flex;
    align-items: center;
    padding: 1px 8px;
    border: 1px solid var(--sdk-border-color-light);
    border-radius: var(--radius-sm, 4px);
    background: transparent;
  }
  .triggers-title-cell {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
  }
  .triggers-version {
    font-size: 11px;
    color: var(--sdk-text-color-secondary);
    flex-shrink: 0;
  }
  .triggers-table-host {
    min-width: 0;
  }
  .triggers-table-host .sdk-object-list {
    height: auto;
  }

  @container triggers-page (max-width: 640px) {
    .triggers-search {
      width: 160px;
      flex: 1 1 140px;
    }
  }
</style>
<div id="app" v-cloak>
  <section class="triggers-page">
    <page-header :title="t('page.title')" :description="t('page.description')">
      <template #actions>
        <sdk-input
          class="triggers-search"
          v-model="search"
          :prefix-icon="searchIcon"
          :placeholder="t('search.placeholder')"
          :aria-label="t('search.placeholder')"
          clearable
        ></sdk-input>
        <sdk-button
          text
          icon="refresh-cw"
          :loading="refreshing"
          :aria-label="t('action.refresh')"
          :title="t('action.refresh')"
          @click="refresh"
        ></sdk-button>
        <sdk-button type="primary" icon="plus" :disabled="creating" @click="startCreate">
          {{ t("action.new") }}
        </sdk-button>
      </template>
    </page-header>

    <div class="triggers-body">
      <p class="triggers-note">
        <component :is="scheduleIcon" :size="14" class="triggers-note-icon" aria-hidden="true" />
        <span class="triggers-note-text">{{ t("note.text") }}</span>
        <span class="triggers-stats">
          <span class="triggers-stat-chip">
            <projection slot="armedStats"></projection>
          </span>
          <span class="triggers-stat-chip">
            <projection slot="totalStats"></projection>
          </span>
        </span>
      </p>

      <div class="triggers-table-host">
        <projection slot="triggers" @row-action="onRowAction">
          <template #cell-triggerTitle="{ value }">
            <span class="triggers-title-cell">
              <span>{{ Array.isArray(value) ? value[0] : value }}</span>
              <span v-if="Array.isArray(value) && value[1]" class="triggers-version">{{ value[1] }}</span>
            </span>
          </template>
        </projection>
      </div>
    </div>

    <sdk-dialog
      v-model="dialog"
      :before-close="beforeCloseDialog"
      :title="dialogTitle"
      width="min(39rem, calc(100% - 2rem))"
      append-to-body
      destroy-on-close
    >
      <div
        v-if="dialogOpen"
        :key="creating ? 'create' : editing.primaryKey"
        style="display: flex; flex-direction: column; min-width: 0; padding-top: 2px;"
      >
        <projection
          v-if="creating"
          slot="createForm"
          @saved="onFormSaved"
          @discarded="closeDialog"
          @cancel="cancelDialog"
        ></projection>
        <projection
          v-else-if="editing"
          slot="editForm"
          @saved="onFormSaved"
          @discarded="closeDialog"
          @cancel="cancelDialog"
        ></projection>
      </div>
      <template #footer>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: var(--spacing-sm);">
          <sdk-button :disabled="Boolean(activeDraft && activeDraft.saving)" @click="cancelDialog">
            {{ t("action.cancel") }}
          </sdk-button>
          <sdk-button
            type="primary"
            :loading="Boolean(activeDraft && activeDraft.saving)"
            :disabled="!activeDraft || Boolean(activeDraft.saving)"
            @click="activeDraft && activeDraft.save()"
          >
            {{ t("action.save") }}
          </sdk-button>
        </div>
      </template>
    </sdk-dialog>
  </section>
</div>
