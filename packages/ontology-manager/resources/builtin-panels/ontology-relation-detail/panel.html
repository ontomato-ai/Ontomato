<style>
  .relation-detail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: relation-detail-page / inline-size;
  }
  .relation-detail-body {
    display: grid;
    grid-template-columns: minmax(320px, 0.85fr) minmax(420px, 1.15fr);
    gap: var(--page-content-gap);
    padding: var(--page-content-gap) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    align-items: stretch;
  }
  .relation-detail-error {
    grid-column: 1 / -1;
  }
  .relation-error-state {
    padding: var(--page-content-gap) var(--page-gutter);
  }
  .relation-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--page-section-padding, var(--spacing-lg-xl, 20px));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .relation-card h2 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .relation-form-wrap {
    margin-top: var(--spacing-lg);
  }
  .relation-form-wrap .sdk-owner-form,
  .relation-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .relation-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .relation-ends {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
    align-items: stretch;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-lg);
  }
  .relation-ends > * {
    min-width: 0;
  }
  .relation-arrow {
    display: grid;
    place-items: center;
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relation-connection-note {
    margin-top: var(--spacing-lg);
  }
  .relation-note {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .relation-failure {
    color: var(--sdk-color-danger-text);
  }
  .relation-missing {
    padding: var(--spacing-2xl) var(--page-gutter);
  }

  @container relation-detail-page (max-width: 850px) {
    .relation-detail-body {
      grid-template-columns: minmax(0, 1fr);
      padding-block: var(--spacing-md) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
      gap: var(--page-content-gap);
    }
    .relation-ends {
      grid-template-columns: minmax(0, 1fr);
    }
    .relation-arrow {
      height: 24px;
    }
    .relation-arrow svg {
      transform: rotate(90deg);
    }
  }
</style>
<div id="app">
  <section class="relation-detail">
    <page-header
      :back-label="t('rel.back')"
      :draft="detailDraft"
      @back="goBack"
    >
      <template v-if="selectedKey" #title>
        <span v-show="recordStatus === 'ready'">
          <projection slot="headerTitle"></projection>
        </span>
        <h1 v-if="recordStatus !== 'ready'">{{ selectedKey }}</h1>
      </template>
      <template v-if="showDetailBody" #actions>
        <projection slot="remove" @done="onRemoveDone"></projection>
      </template>
    </page-header>
    <div v-if="!selectedKey" class="relation-missing">
      <sdk-empty :description="t('rel.missing')"></sdk-empty>
    </div>
    <p v-else-if="recordStatus === 'forbidden'" class="relation-note relation-failure" role="alert">{{ t("rel.forbidden") }}</p>
    <div v-else-if="recordStatus === 'empty' || recordStatus === 'missing'" class="relation-missing">
      <sdk-empty :description="t('rel.missing')"></sdk-empty>
    </div>
    <div v-else-if="!recordEverReady && recordStatus === 'error'" class="relation-error-state" role="alert">
      <info-banner tone="danger" :text="recordErrorText"></info-banner>
    </div>
    <p v-else-if="!showDetailBody" class="relation-note" role="status">{{ t("rel.loading") }}</p>
    <div v-else class="relation-detail-body">
      <info-banner
        v-if="recordStatus === 'error'"
        class="relation-detail-error"
        tone="danger"
        :text="recordErrorText"
        role="alert"
      ></info-banner>
      <section class="relation-card">
        <h2>{{ t("rel.basicInfo") }}</h2>
        <div class="relation-form-wrap">
          <projection slot="form"></projection>
        </div>
      </section>
      <section class="relation-card">
        <h2>{{ t("rel.connections") }}</h2>
        <div class="relation-ends">
          <projection slot="fromCard" @navigate="openObjectType"></projection>
          <span class="relation-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <projection slot="toCard" @navigate="openObjectType"></projection>
        </div>
        <info-banner
          class="relation-connection-note"
          tone="info"
          :text="t('rel.connectionNote')"
        ></info-banner>
      </section>
    </div>
  </section>
</div>
