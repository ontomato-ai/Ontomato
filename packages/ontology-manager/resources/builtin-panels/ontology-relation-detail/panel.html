<style>
  .relation-detail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: relation-detail-page / inline-size;
  }
  .relation-detail-body {
    display: grid;
    grid-template-columns: minmax(320px, 0.85fr) minmax(420px, 1.15fr);
    gap: var(--page-content-gap);
    padding: var(--page-content-gap) var(--page-gutter);
    align-items: stretch;
  }
  .relation-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--page-section-padding, var(--spacing-lg-xl, 20px));
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .relation-card h2 {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
  }
  .relation-form-wrap {
    margin-top: var(--spacing-lg);
  }
  .relation-form-wrap .sdk-owner-form,
  .relation-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .relation-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .relation-ends {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
    align-items: stretch;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-lg);
  }
  .relation-end {
    min-width: 0;
    overflow-wrap: anywhere;
    display: block;
    width: 100%;
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--sdk-text-color-primary);
    font: inherit;
    text-align: start;
    cursor: pointer;
    transition: background-color var(--transition-fast), border-color var(--transition-fast);
  }
  .relation-end:hover {
    border-color: var(--sdk-color-primary-light-5, var(--brand-link));
    background: var(--brand-primary-tint, var(--ui-fill-tertiary));
  }
  .relation-end:focus-visible {
    outline: 2px solid var(--sdk-color-primary, var(--brand-link));
    outline-offset: 2px;
  }
  .relation-end small,
  .relation-end strong,
  .relation-end em {
    display: block;
  }
  .relation-end small,
  .relation-end em {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    font-style: normal;
  }
  .relation-end strong {
    margin: 3px 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .relation-end .relation-api-name {
    color: var(--sdk-text-color-placeholder);
    font-family: var(--font-mono);
  }
  .relation-arrow {
    display: grid;
    place-items: center;
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relation-connection-note {
    margin: var(--spacing-lg) 0 0;
    background-color: var(--sdk-color-primary-light-9, var(--brand-primary-tint));
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relation-connection-note .el-alert__icon,
  .relation-connection-note .el-alert__title {
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .relation-note {
    margin: 0;
    padding: var(--spacing-lg);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    text-align: center;
  }
  .relation-failure {
    color: var(--sdk-color-danger-text);
  }
  .relation-missing {
    padding: var(--spacing-2xl) var(--page-gutter);
  }

  @container relation-detail-page (max-width: 850px) {
    .relation-detail-body {
      grid-template-columns: minmax(0, 1fr);
      padding-block: var(--spacing-md) var(--page-content-gap);
      gap: var(--page-content-gap);
    }
    .relation-ends {
      grid-template-columns: minmax(0, 1fr);
    }
    .relation-arrow {
      height: 24px;
    }
    .relation-arrow svg {
      transform: rotate(90deg);
    }
  }
</style>
<div id="app">
  <section class="relation-detail">
    <page-header
      back-label="返回关系类型"
      :title="detail.status === 'ready' ? undefined : selectedKey"
      :draft="detailDraft"
      @back="goBack"
    >
      <template v-if="detail.status === 'ready'" #title>
        <projection slot="headerTitle"></projection>
      </template>
      <template v-if="detail.status === 'ready'" #actions>
        <projection slot="remove" @done="onRemoveDone"></projection>
      </template>
    </page-header>
    <div v-if="!selectedKey" class="relation-missing">
      <sdk-empty description="关系类型不存在或已删除"></sdk-empty>
    </div>
    <p v-else-if="detail.status === 'loading'" class="relation-note" role="status">正在读取这条关系类型…</p>
    <p v-else-if="detail.status === 'forbidden'" class="relation-note relation-failure">当前账号无权读取这条关系类型。</p>
    <div v-else-if="detail.status !== 'ready'" class="relation-missing">
      <sdk-empty description="关系类型不存在或已删除"></sdk-empty>
    </div>
    <div v-else class="relation-detail-body">
      <section class="relation-card">
        <h2>基本信息</h2>
        <div class="relation-form-wrap">
          <projection slot="form"></projection>
        </div>
      </section>
      <section class="relation-card">
        <h2>对象连接</h2>
        <div class="relation-ends">
          <button type="button" class="relation-end" @click="openType(detail.value.fields.fromclass)">
            <small>来源对象</small>
            <strong>{{ typeLabel(detail.value.fields.fromclass) }}</strong>
            <em class="relation-api-name">{{ detail.value.fields.fromclass }}</em>
          </button>
          <span class="relation-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
          <button type="button" class="relation-end" @click="openType(detail.value.fields.toclass)">
            <small>目标对象</small>
            <strong>{{ typeLabel(detail.value.fields.toclass) }}</strong>
            <em class="relation-api-name">{{ detail.value.fields.toclass }}</em>
          </button>
        </div>
        <sdk-alert class="relation-connection-note" type="info" title="关系连接来源对象和目标对象，可维护关系说明及关联字段。" :closable="false" show-icon></sdk-alert>
      </section>
    </div>
  </section>
</div>
