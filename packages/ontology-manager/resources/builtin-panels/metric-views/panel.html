<!--
  Metric views catalog panel: full-width table (7 columns, search, and official batch-status OperationButton when rows
  are checked). Clicking a row navigates to the dedicated non-menu detail entry; clicking "New Metric View" opens the
  detail entry in create mode.
-->
<style>
  [v-cloak] { display: none; }
  .mv-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: metric-views-page / inline-size;
  }
  .mv {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
  }
  .mv-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    white-space: nowrap;
  }
  .mv-batch-select { width: 9.5rem; }
</style>
<div id="app" v-cloak>
  <div class="mv-page">
    <page-header :title="t('metricViews.title')" :description="t('metricViews.description')">
      <template #actions>
        <sdk-button type="primary" icon="chart-column" @click="startCreate">{{ t("metricViews.new") }}</sdk-button>
      </template>
    </page-header>
    <section class="mv">
      <projection slot="list" @choose="openDetail">
        <template #filters>
          <span v-if="listTotal !== null" class="mv-count" role="status">{{ t("metricViews.itemCount", { count: listTotal }) }}</span>
        </template>
        <template #batch-actions>
          <sdk-select v-model="batchStatus" size="small" class="mv-batch-select" :aria-label="t('metricViews.batchStatus')">
            <sdk-option value="PENDING_REVIEW" :label="t('metricViews.status.PENDING_REVIEW')"></sdk-option>
            <sdk-option value="PUBLISHED" :label="t('metricViews.status.PUBLISHED')"></sdk-option>
            <sdk-option value="UNUSED" :label="t('metricViews.status.UNUSED')"></sdk-option>
          </sdk-select>
          <projection slot="publishStatus"></projection>
        </template>
      </projection>
    </section>
  </div>
</div>
