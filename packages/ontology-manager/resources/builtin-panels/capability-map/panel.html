<!--
  Four-layer capability map panel. Type mode renders declared platform types and relation kinds (graph or layer-grouped
  table) with read-only class details; instance mode explores one-hop relations from a start object. Every business read
  and presentation lives in official SDK projections; this template owns layout and panel state controls only.
-->
<style>
  [v-cloak] { display: none; }
  .capmap-page {
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    min-width: 0;
  }
  .capmap {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    gap: var(--page-content-gap);
    padding: var(--spacing-md) var(--page-gutter) var(--page-content-gap);
    min-height: 0;
  }
  .capmap-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm) var(--spacing-md);
    padding: var(--spacing-sm) var(--spacing-md);
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .capmap-search {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    flex: 1 1 200px;
    min-width: 160px;
    max-width: 340px;
  }
  .capmap-actions {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    margin-inline-start: auto;
  }
  .capmap-inline-actions {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-sm);
  }
  .capmap-hint {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: 1.6;
  }
  .capmap-notice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius-md);
    border: 1px solid var(--sdk-color-warning-light-7);
    background: var(--sdk-color-warning-light-9);
    color: var(--sdk-color-warning-dark-2);
    font-size: var(--text-sm);
    line-height: 1.6;
  }
  .capmap-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 400px;
    gap: var(--page-content-gap);
    align-items: start;
  }
  .capmap-main {
    position: relative;
    min-width: 0;
    min-height: 560px;
  }
  .capmap-canvas {
    display: flex;
    flex-direction: column;
    height: clamp(560px, 72dvh, 880px);
    padding: var(--spacing-md);
    box-sizing: border-box;
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: hidden;
  }
  .capmap-canvas > [data-member] {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-height: 0;
  }
  .capmap-canvas.is-behind {
    position: absolute;
    inset: 0;
    visibility: hidden;
  }
  .capmap-types {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    height: clamp(560px, 72dvh, 880px);
    overflow: auto;
    padding: var(--spacing-md);
    box-sizing: border-box;
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .capmap-aside {
    display: flex;
    flex-direction: column;
    gap: var(--page-content-gap);
    min-width: 0;
    max-height: clamp(560px, 72dvh, 880px);
    overflow-y: auto;
    padding: var(--spacing-md);
    box-sizing: border-box;
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
  }
  .capmap-class-detail {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .capmap-detail-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .capmap-block {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .capmap-block > h4 {
    margin: 0;
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-secondary);
    letter-spacing: var(--tracking-label);
  }
  .capmap-pick {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }
  .capmap-kind-popover {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
  }
  .capmap-kind-popover-bar {
    display: flex;
    justify-content: flex-end;
  }
  .capmap-kind-popover-list {
    max-height: 280px;
    overflow: auto;
  }
  @container (max-width: 960px) {
    .capmap-body {
      grid-template-columns: minmax(0, 1fr);
    }
    .capmap-actions {
      margin-inline-start: 0;
    }
    .capmap-aside {
      max-height: none;
    }
  }
  @media (max-width: 1080px) {
    .capmap-body {
      grid-template-columns: minmax(0, 1fr);
    }
    .capmap-actions {
      margin-inline-start: 0;
    }
  }
</style>
<div id="app" v-cloak class="capmap-page">
  <page-header :title="t('cm.pageTitle')" :description="t('cm.pageDescription')">
    <template #actions>
      <sdk-button text :aria-label="t('cm.refresh')" :title="t('cm.refresh')" data-cap-action="refresh" @click="refresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </sdk-button>
    </template>
  </page-header>
  <div class="capmap">
    <header class="capmap-toolbar">
      <segmented-control
        :options="modeOptions"
        :model-value="mode"
        aria-label-key="cm.modeLabel"
        @update:model-value="setMode"
      ></segmented-control>
      <segmented-control
        v-if="mode === 'type'"
        :options="viewOptions"
        :model-value="view"
        aria-label-key="cm.viewLabel"
        @update:model-value="setView"
      ></segmented-control>
      <div class="capmap-search">
        <sdk-input
          :model-value="query"
          size="small"
          clearable
          :aria-label="mode === 'type' ? t('cm.searchType') : t('cm.searchInstance')"
          :placeholder="mode === 'type' ? t('cm.searchType') : t('cm.searchInstance')"
          @update:model-value="onQueryChange"
        ></sdk-input>
        <sdk-button v-if="query" size="small" data-cap-action="clear-query" @click="clearQuery">
          {{ t('cm.clearSearch') }}
        </sdk-button>
      </div>
      <sdk-popover
        v-if="mode === 'type' && view === 'graph'"
        trigger="click"
        placement="bottom-start"
        :width="320"
      >
        <template #reference>
          <sdk-button
            size="small"
            :type="relationKindsCount > 0 ? 'primary' : 'default'"
            :plain="relationKindsCount > 0"
            data-cap-action="relation-kind-filter"
          >
            {{ relationKindsCount > 0 ? t('cm.kindFilterActive', { count: relationKindsCount }) : t('cm.kindFilter') }}
          </sdk-button>
        </template>
        <div class="capmap-kind-popover">
          <div v-if="relationKindsCount > 0" class="capmap-kind-popover-bar">
            <sdk-button size="small" link data-cap-action="clear-relation-kinds" @click="clearRelationKinds">
              {{ t('cm.clearFilter') }}
            </sdk-button>
          </div>
          <div class="capmap-kind-popover-list">
            <projection slot="relationKindFilter"></projection>
          </div>
        </div>
      </sdk-popover>
      <div v-if="mode === 'instance'" class="capmap-actions">
        <sdk-button
          size="small"
          :disabled="!canUseSelectedAsStart"
          data-cap-action="use-selected-as-start"
          @click="useSelectedAsStart"
        >
          {{ t('cm.useSelectedAsStart') }}
        </sdk-button>
      </div>
    </header>

    <div v-if="notice" class="capmap-notice" role="status">
      <span>{{ t('cm.navUnavailable', { name: notice.name, reason: notice.reason }) }}</span>
      <sdk-button size="small" text :aria-label="t('cm.dismiss')" data-cap-action="dismiss-notice" @click="notice = null">
        ×
      </sdk-button>
    </div>

    <div class="capmap-body">
      <section class="capmap-main">
        <div class="capmap-canvas" :class="{ 'is-behind': mode === 'type' && view === 'list' }">
          <projection slot="graph"></projection>
        </div>

        <div v-if="mode === 'type' && view === 'list'" class="capmap-types">
          <p class="capmap-hint">{{ t('cm.typeListHint') }}</p>
          <projection slot="typeList" @choose="onTypeChosen"></projection>
        </div>
      </section>

      <aside class="capmap-aside">
        <template v-if="mode === 'type'">
          <section-group :title="t('cm.classTitle')">
            <p v-if="!selectedType" class="capmap-hint">{{ t('cm.classEmpty') }}</p>
            <div v-else class="capmap-class-detail">
              <projection slot="typeHeader"></projection>

              <div v-if="typeHeaderStatus === 'ready'" class="capmap-detail-actions">
                <sdk-button
                  v-if="directoryPath"
                  size="small"
                  data-cap-action="view-instances"
                  @click="openInstances"
                >
                  {{ t('cm.viewInstances') }}
                </sdk-button>
                <sdk-button
                  size="small"
                  type="primary"
                  plain
                  data-cap-action="pick-start"
                  @click="togglePickingStart"
                >
                  {{ t('cm.pickStart') }}
                </sdk-button>
              </div>
              <p v-if="pickingStart" class="capmap-hint">{{ t('cm.pickHint') }}</p>

              <template v-if="typeDetailVisible">
                <projection slot="typeSummary"></projection>

                <div class="capmap-block">
                  <h4>{{ t('cm.properties') }}</h4>
                  <projection slot="typeProperties"></projection>
                </div>

                <div class="capmap-block">
                  <h4>{{ t('cm.relations') }}</h4>
                  <projection slot="typeRelations"></projection>
                </div>

                <div class="capmap-block">
                  <h4>{{ t('cm.reads') }}</h4>
                  <projection slot="typeReads"></projection>
                </div>

                <div class="capmap-block">
                  <h4>{{ t('cm.operations') }}</h4>
                  <projection slot="typeOperations"></projection>
                </div>
              </template>
            </div>
          </section-group>
        </template>

        <template v-else>
          <section-group :title="t('cm.startTitle')">
            <p class="capmap-hint">{{ startDisplay }}</p>
            <div class="capmap-inline-actions">
              <sdk-button
                size="small"
                :type="showUserPicker ? 'primary' : 'default'"
                :plain="showUserPicker"
                :aria-expanded="showUserPicker"
                data-cap-action="toggle-user-picker"
                @click="toggleUserPicker"
              >
                {{ t('cm.switchUser') }}
              </sdk-button>
              <sdk-button
                v-if="hasCustomStart"
                size="small"
                data-cap-action="reset-start"
                @click="resetStart"
              >
                {{ t('cm.resetStart') }}
              </sdk-button>
            </div>
          </section-group>

          <section-group v-if="showUserPicker" :title="t('cm.userPickerTitle')" :description="t('cm.userPickerHint')">
            <projection slot="userPicker"></projection>
          </section-group>
        </template>

        <div v-if="mode === 'instance' || pickingStart" ref="pickerSection">
          <section-group :title="t('cm.pickByTypeTitle')" :description="t('cm.pickByTypeHint')">
            <div class="capmap-pick">
              <projection slot="typePicker"></projection>
              <projection v-if="selectedType" slot="typeObjects"></projection>
              <p v-else class="capmap-hint">{{ t('cm.pickChooseType') }}</p>
            </div>
          </section-group>
        </div>

        <section-group
          v-if="mode === 'instance'"
          :title="t('cm.relationsTitle')"
          :description="t('cm.relationsHint')"
        >
          <projection slot="relations"></projection>
        </section-group>
      </aside>
    </div>
  </div>
</div>
