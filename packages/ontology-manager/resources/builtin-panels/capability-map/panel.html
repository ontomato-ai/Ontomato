<style>
  /* The capability map is a shell: one header of its own, then whichever half of the platform ontology the reader chose. */
  .cm {
    display: flex;
    flex: 1;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .cm-body {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .cm-body > [data-member] {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
</style>
<div id="app">
  <section class="cm">
    <page-header :title="t('panel.name')" :description="t('cm.pageDescription')">
      <template #actions>
        <segmented-control
          state="mode"
          default-value="instance"
          :options="modeOptions"
          :aria-label="t('cm.modeLabel')"
        ></segmented-control>
        <sdk-button
          text
          icon="refresh-cw"
          :loading="refreshing"
          :disabled="refreshing"
          :aria-label="t('cm.refresh')"
          :title="t('cm.refresh')"
          @click="refresh"
        ></sdk-button>
      </template>
    </page-header>
    <div class="cm-body">
      <projection v-if="mode === 'type'" slot="types"></projection>
      <projection v-else slot="instances"></projection>
    </div>
  </section>
</div>
