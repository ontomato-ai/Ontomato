<!-- List-detail toggle template: Applications catalogue using official SDK data components. -->
<style>
  [v-cloak] {
    display: none;
  }

  .tpl-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 24rem;
    min-width: 0;
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: hidden;
  }

  .tpl-list-pane {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
  }

  .tpl-list-slot {
    flex: 1 1 auto;
    min-height: 0;
  }

  .tpl-detail-pane {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color);
  }

  .tpl-detail-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-md) var(--spacing-lg);
    border-bottom: 1px solid var(--sdk-border-color-lighter);
  }

  .tpl-back-btn {
    flex: 0 0 auto;
  }

  .tpl-head-sep {
    flex: 0 0 auto;
    width: 1px;
    height: 1.25rem;
    background: var(--sdk-border-color-lighter);
  }

  .tpl-header-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  .tpl-create-title {
    margin: 0;
    font-size: var(--text-lg);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
    line-height: 1.4;
  }

  .tpl-detail-tabs {
    flex: 0 0 auto;
    padding: 0 var(--spacing-lg);
    border-bottom: 1px solid var(--sdk-border-color-lighter);
  }

  .tpl-tabs .el-tabs__header {
    margin: 0;
  }

  .tpl-tabs .el-tabs__nav-wrap::after {
    display: none;
  }

  .tpl-detail-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: var(--spacing-lg) var(--spacing-lg) 0;
  }

  .tpl-detail-content {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    max-width: 48rem;
    min-width: 0;
    padding-bottom: var(--spacing-lg);
  }

  .tpl-detail-wide {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
    padding-bottom: var(--spacing-lg);
  }

  .apps-summary .sdk-object-summary-title {
    display: none;
  }

  .apps-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }

  .apps-bar-group {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }

  .apps-muted {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }

  .apps-error {
    margin: 0;
    color: var(--sdk-color-danger-text);
    font-size: var(--text-sm);
  }

  .apps-mono {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .apps-panel-cell {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
  }

  .apps-panel-id {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--brand-link);
    cursor: pointer;
    border: 0;
    padding: 0;
    background: none;
    text-align: start;
  }

  .apps-panel-id:hover {
    text-decoration: underline;
  }

  .apps-row-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    white-space: nowrap;
  }

  .apps-row-editor {
    padding: var(--spacing-md);
    margin: var(--spacing-xs) 0;
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-lighter);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }

  .apps-form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
    gap: var(--spacing-sm) var(--spacing-md);
  }

  .apps-form-span {
    grid-column: 1 / -1;
  }

  .apps-editor-foot {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: var(--spacing-sm);
  }

  .apps-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
    gap: var(--spacing-sm) var(--spacing-md);
    margin: 0;
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-extra-light);
  }

  .apps-meta-grid dt {
    margin: 0 0 var(--spacing-xs);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }

  .apps-meta-grid dd {
    margin: 0;
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    overflow-wrap: break-word;
  }

  .apps-assets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
    gap: var(--spacing-lg);
    min-width: 0;
  }

  .apps-assets-box {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-sm);
    min-width: 0;
  }

  .apps-assets-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }

  .apps-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-xs);
  }

  @media (max-width: 48rem) {
    .tpl-detail-header {
      flex-wrap: wrap;
      padding: var(--spacing-sm) var(--spacing-md);
    }

    .tpl-detail-tabs {
      padding: 0 var(--spacing-md);
    }

    .tpl-detail-body {
      padding: var(--spacing-md);
    }
  }
</style>

<div id="app" v-cloak style="height: 100%; min-height: 0;">
  <div class="tpl-shell">
    <!-- Directory view: kept alive with v-show to preserve scroll position and cursor pages. -->
    <section v-show="mode === 'list'" class="tpl-list-pane">
      <projection slot="catalogue" class="tpl-list-slot">
        <template #filters>
          <sdk-segmented v-model="scopeModel" :options="scopeOptions" size="small"></sdk-segmented>
          <sdk-select
            v-model="sortModel"
            size="small"
            style="width: 10.5rem;"
            :aria-label="t('sort.label')"
          >
            <sdk-option value="id" :label="t('sort.id')"></sdk-option>
            <sdk-option value="name" :label="t('sort.name')"></sdk-option>
            <sdk-option value="updated" :label="t('sort.updated')"></sdk-option>
          </sdk-select>
        </template>
      </projection>
    </section>

    <!-- Detail / Create view -->
    <section v-if="mode !== 'list'" class="tpl-detail-pane">
      <div class="tpl-detail-header">
        <sdk-button text size="small" class="tpl-back-btn" @click="back">
          &#8249; {{ t('action.back') }}
        </sdk-button>
        <span class="tpl-head-sep" aria-hidden="true"></span>
        <div class="tpl-header-main">
          <h2 v-if="mode === 'create'" class="tpl-create-title">{{ t('action.create') }}</h2>
          <projection v-else slot="header" @done="onHeaderDone">
            <template #actions>
              <sdk-button v-if="appPath" type="primary" size="small" @click="openApplication">
                {{ t('action.openApp') }}
              </sdk-button>
            </template>
          </projection>
        </div>
      </div>

      <!-- Create mode body -->
      <div v-if="mode === 'create'" ref="detailBodyRef" class="tpl-detail-body">
        <div class="tpl-detail-content">
          <projection slot="save" @saved="onCreated" @cancel="onCancelCreate"></projection>
        </div>
      </div>

      <!-- Detail mode tabs + scrollable body -->
      <template v-else>
        <div class="tpl-detail-tabs">
          <sdk-tabs v-model="tabModel" class="tpl-tabs">
            <sdk-tab-pane name="identity" :label="t('tab.identity')"></sdk-tab-pane>
            <sdk-tab-pane name="entries" :label="t('tab.entries')"></sdk-tab-pane>
            <sdk-tab-pane name="assets" :label="t('tab.assets')"></sdk-tab-pane>
            <sdk-tab-pane v-if="app && app.fields.canGrant" name="grants" :label="t('tab.grants')"></sdk-tab-pane>
          </sdk-tabs>
        </div>

        <div ref="detailBodyRef" class="tpl-detail-body">
          <!-- Tab 1: Basics -->
          <div v-if="tabModel === 'identity'" class="tpl-detail-content">
            <projection
              v-if="app && app.fields.canMaintain"
              slot="save"
              @saved="onSaved"
            ></projection>
            <projection
              v-else-if="app"
              slot="summary"
              class="apps-summary"
              @navigate="onNavigateReference"
            ></projection>
          </div>

          <!-- Tab 2: Entries -->
          <div v-else-if="tabModel === 'entries'" class="tpl-detail-wide">
            <div class="apps-bar">
              <span class="apps-muted">
                {{ t('entries.count', { count: entryRows.length }) }}
              </span>
              <div v-if="app && app.fields.canEditEntries" class="apps-bar-group">
                <sdk-button
                  v-if="!entriesBulkMode"
                  size="small"
                  type="primary"
                  @click="startAddEntry"
                >
                  {{ t('entries.add') }}
                </sdk-button>
                <sdk-button size="small" @click="entriesBulkMode = !entriesBulkMode">
                  {{ entriesBulkMode ? t('entries.backToList') : t('entries.bulkEdit') }}
                </sdk-button>
              </div>
            </div>

            <div v-if="entriesBulkMode && app && app.fields.canEditEntries" class="tpl-detail-content">
              <projection slot="entriesForm" @saved="onEntriesFormSaved"></projection>
            </div>

            <template v-else>
              <!-- Inline create block at top of entries list -->
              <div v-if="addingEntry" ref="addEntryRef" class="apps-row-editor">
                <sdk-form label-position="top" size="small">
                  <div class="apps-form-grid">
                    <sdk-form-item :label="t('entries.id')">
                      <sdk-input v-model="entryDraft.id" placeholder="use-manage"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.pageKey')">
                      <sdk-input v-model="entryDraft.pageKey" placeholder="app-manage"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.panelId')">
                      <sdk-input v-model="entryDraft.panelId" placeholder="panel-id"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.path')">
                      <sdk-input v-model="entryDraft.path" placeholder="/applications/app-id/page"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.nameZh')">
                      <sdk-input v-model="entryDraft.nameZh"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.nameEn')">
                      <sdk-input v-model="entryDraft.nameEn"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.group')">
                      <sdk-select
                        v-model="entryDraft.groupKey"
                        clearable
                        filterable
                        allow-create
                        default-first-option
                        :placeholder="t('entries.groupNone')"
                        style="width: 100%"
                      >
                        <sdk-option
                          v-for="group in groupChoices"
                          :key="group.key"
                          :value="group.key"
                          :label="group.label"
                        ></sdk-option>
                      </sdk-select>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.access')">
                      <sdk-select v-model="entryDraft.accessKind" style="width: 100%">
                        <sdk-option value="domain-member" :label="t('entries.accessDomain')"></sdk-option>
                        <sdk-option value="permissionCode" :label="t('entries.accessPermission')"></sdk-option>
                      </sdk-select>
                    </sdk-form-item>
                    <sdk-form-item
                      v-if="entryDraft.accessKind === 'permissionCode'"
                      :label="t('entries.permissionCode')"
                      class="apps-form-span"
                    >
                      <sdk-input v-model="entryDraft.permissionCode"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.agent')">
                      <sdk-select v-model="entryDraft.agentKind" style="width: 100%">
                        <sdk-option value="none" :label="t('entries.agentNone')"></sdk-option>
                        <sdk-option value="id" :label="t('entries.agentId')"></sdk-option>
                        <sdk-option value="preset" :label="t('entries.agentPreset')"></sdk-option>
                      </sdk-select>
                    </sdk-form-item>
                    <sdk-form-item
                      v-if="entryDraft.agentKind !== 'none'"
                      :label="entryDraft.agentKind === 'preset' ? t('entries.agentPresetLabel') : t('entries.agentIdLabel')"
                    >
                      <sdk-input v-model="entryDraft.agentValue"></sdk-input>
                    </sdk-form-item>
                    <sdk-form-item :label="t('entries.inputs')" class="apps-form-span">
                      <sdk-input
                        v-model="entryDraft.inputsText"
                        type="textarea"
                        :rows="2"
                        placeholder='{"frameState": "..."}'
                      ></sdk-input>
                    </sdk-form-item>
                  </div>
                </sdk-form>
                <p v-if="entryError" class="apps-error" role="alert">{{ entryError }}</p>
                <div class="apps-editor-foot">
                  <sdk-button size="small" @click="cancelEntryEdit">{{ t('action.cancel') }}</sdk-button>
                  <sdk-button size="small" type="primary" :loading="busy" @click="submitEntry(false)">
                    {{ t('entries.add') }}
                  </sdk-button>
                </div>
              </div>

              <!-- Entries table with single-row inline expand -->
              <sdk-table
                v-sdk-loading="entries.status === 'loading'"
                :data="entryRows"
                row-key="id"
                :expand-row-keys="expandedEntryKeys"
                size="small"
                @expand-change="onEntryExpandChange"
              >
                <sdk-table-column type="expand" width="40">
                  <template #default="{ row }">
                    <div class="apps-row-editor" :data-entry-row="row.id">
                      <template v-if="app && app.fields.canEditEntries && expandedEntryId === row.id">
                        <sdk-form label-position="top" size="small">
                          <div class="apps-form-grid">
                            <sdk-form-item :label="t('entries.id')">
                              <sdk-input v-model="entryDraft.id" disabled></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.pageKey')">
                              <sdk-input v-model="entryDraft.pageKey"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.panelId')">
                              <sdk-input v-model="entryDraft.panelId"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.path')">
                              <sdk-input v-model="entryDraft.path"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.nameZh')">
                              <sdk-input v-model="entryDraft.nameZh"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.nameEn')">
                              <sdk-input v-model="entryDraft.nameEn"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.group')">
                              <sdk-select
                                v-model="entryDraft.groupKey"
                                clearable
                                filterable
                                allow-create
                                default-first-option
                                :placeholder="t('entries.groupNone')"
                                style="width: 100%"
                              >
                                <sdk-option
                                  v-for="group in groupChoices"
                                  :key="group.key"
                                  :value="group.key"
                                  :label="group.label"
                                ></sdk-option>
                              </sdk-select>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.access')">
                              <sdk-select v-model="entryDraft.accessKind" style="width: 100%">
                                <sdk-option value="domain-member" :label="t('entries.accessDomain')"></sdk-option>
                                <sdk-option value="permissionCode" :label="t('entries.accessPermission')"></sdk-option>
                              </sdk-select>
                            </sdk-form-item>
                            <sdk-form-item
                              v-if="entryDraft.accessKind === 'permissionCode'"
                              :label="t('entries.permissionCode')"
                              class="apps-form-span"
                            >
                              <sdk-input v-model="entryDraft.permissionCode"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.agent')">
                              <sdk-select v-model="entryDraft.agentKind" style="width: 100%">
                                <sdk-option value="none" :label="t('entries.agentNone')"></sdk-option>
                                <sdk-option value="id" :label="t('entries.agentId')"></sdk-option>
                                <sdk-option value="preset" :label="t('entries.agentPreset')"></sdk-option>
                              </sdk-select>
                            </sdk-form-item>
                            <sdk-form-item
                              v-if="entryDraft.agentKind !== 'none'"
                              :label="entryDraft.agentKind === 'preset' ? t('entries.agentPresetLabel') : t('entries.agentIdLabel')"
                            >
                              <sdk-input v-model="entryDraft.agentValue"></sdk-input>
                            </sdk-form-item>
                            <sdk-form-item :label="t('entries.inputs')" class="apps-form-span">
                              <sdk-input v-model="entryDraft.inputsText" type="textarea" :rows="2"></sdk-input>
                            </sdk-form-item>
                          </div>
                        </sdk-form>
                        <p v-if="entryError" class="apps-error" role="alert">{{ entryError }}</p>
                        <div class="apps-editor-foot">
                          <sdk-button size="small" @click="collapseEntry">{{ t('action.cancel') }}</sdk-button>
                          <sdk-button size="small" type="primary" :loading="busy" @click="submitEntry(true)">
                            {{ t('action.save') }}
                          </sdk-button>
                        </div>
                      </template>
                      <dl v-else class="apps-meta-grid">
                        <div>
                          <dt>{{ t('entries.id') }}</dt>
                          <dd class="apps-mono">{{ row.id }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.pageKey') }}</dt>
                          <dd class="apps-mono">{{ row.pageKey }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.panelId') }}</dt>
                          <dd class="apps-mono">{{ row.panelId }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.path') }}</dt>
                          <dd class="apps-mono">{{ row.path }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.access') }}</dt>
                          <dd>{{ accessText(row.access) }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.agent') }}</dt>
                          <dd>{{ agentText(row.defaultAgent) }}</dd>
                        </div>
                        <div>
                          <dt>{{ t('entries.inputs') }}</dt>
                          <dd class="apps-mono">{{ inputsText(row.inputs) }}</dd>
                        </div>
                      </dl>
                    </div>
                  </template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.name')" min-width="130">
                  <template #default="{ row }">{{ localizedText(row.names) || row.pageKey }}</template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.path')" min-width="180">
                  <template #default="{ row }"><span class="apps-mono">{{ row.path }}</span></template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.panel')" min-width="210">
                  <template #default="{ row }">
                    <div class="apps-panel-cell">
                      <button
                        type="button"
                        class="apps-panel-id"
                        :title="row.panelId"
                        @click.stop="inspectPanelAndOpenTab(row.panelId)"
                      >
                        {{ row.panelId }}
                      </button>
                      <sdk-button size="small" link @click.stop="openPanelCatalogue(row.panelId)">
                        {{ t('entries.viewPanel') }}
                      </sdk-button>
                    </div>
                  </template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.group')" width="110">
                  <template #default="{ row }">{{ groupText(row.groupKey) }}</template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.access')" width="130">
                  <template #default="{ row }">{{ accessText(row.access) }}</template>
                </sdk-table-column>

                <sdk-table-column :label="t('entries.col.actions')" width="132" fixed="right">
                  <template #default="{ row }">
                    <div class="apps-row-actions">
                      <sdk-button
                        size="small"
                        link
                        type="primary"
                        :aria-label="(expandedEntryId === row.id ? t('action.close') : (app && app.fields.canEditEntries ? t('entries.edit') : t('entries.expand'))) + ' ' + (localizedText(row.names) || row.pageKey)"
                        @click.stop="toggleEntryRow(row)"
                      >
                        {{ expandedEntryId === row.id ? t('action.close') : (app && app.fields.canEditEntries ? t('entries.edit') : t('entries.expand')) }}
                      </sdk-button>
                      <sdk-button
                        v-if="app && app.fields.canEditEntries"
                        size="small"
                        link
                        type="danger"
                        :disabled="busy"
                        @click.stop="removeEntry(row)"
                      >
                        {{ t('action.delete') }}
                      </sdk-button>
                    </div>
                  </template>
                </sdk-table-column>

                <template #empty>
                  <span v-if="entries.status === 'error'" class="apps-error" role="alert">{{ entries.message }}</span>
                  <span v-else-if="entries.status === 'forbidden'">{{ t('entries.forbidden') }}</span>
                  <span v-else-if="entries.status === 'loading'">{{ t('entries.loading') }}</span>
                  <span v-else>{{ t('entries.empty') }}</span>
                </template>
              </sdk-table>

              <dl v-if="entryData && (entryData.theme || (app && app.fields.framePanel))" class="apps-meta-grid">
                <div v-if="app && app.fields.framePanel">
                  <dt>{{ t('entries.framePanel') }}</dt>
                  <dd class="apps-mono">{{ app.fields.framePanel.label }}</dd>
                </div>
                <div v-if="entryData.theme">
                  <dt>{{ t('entries.theme') }}</dt>
                  <dd class="apps-mono">{{ themeText(entryData.theme) }}</dd>
                </div>
              </dl>
            </template>
          </div>

          <!-- Tab 3: Panels & Projections -->
          <div v-else-if="tabModel === 'assets'" class="tpl-detail-wide">
            <div class="apps-assets-grid">
              <div class="apps-assets-box">
                <h3 class="apps-assets-title">{{ t('assets.panels', { count: usedPanels.length }) }}</h3>
                <div v-if="usedPanels.length" class="apps-chip-list">
                  <sdk-button
                    v-for="panelId in usedPanels"
                    :key="panelId"
                    size="small"
                    :type="inspectedPanelId === panelId ? 'primary' : 'default'"
                    @click="inspectPanel(panelId)"
                  >
                    {{ panelId }}
                  </sdk-button>
                </div>
                <p v-else class="apps-muted">{{ t('assets.noPanels') }}</p>
              </div>

              <div class="apps-assets-box">
                <h3 class="apps-assets-title">
                  {{ inspectedPanelId ? t('assets.projectionsOf', { panel: inspectedPanelId }) : t('assets.projections') }}
                </h3>
                <template v-if="inspectedPanelId">
                  <p v-if="panelInfo.status === 'loading'" class="apps-muted">{{ t('assets.loading') }}</p>
                  <p v-else-if="panelInfo.status === 'error'" class="apps-error" role="alert">{{ panelInfo.message }}</p>
                  <div v-else-if="inspectedMembers.length" class="apps-chip-list">
                    <sdk-button
                      v-for="member in inspectedMembers"
                      :key="member.className + ':' + member.primaryKey"
                      size="small"
                      @click="openMemberCatalogue(member)"
                    >
                      {{ member.primaryKey }}
                    </sdk-button>
                  </div>
                  <p v-else-if="panelInfo.status === 'ready'" class="apps-muted">{{ t('assets.none') }}</p>
                </template>
                <p v-else class="apps-muted">{{ t('assets.selectHint') }}</p>
              </div>
            </div>
          </div>

          <!-- Tab 4: Permissions & Sharing -->
          <div v-else-if="tabModel === 'grants'" class="tpl-detail-wide">
            <sdk-alert
              v-if="grants.status === 'forbidden' || (app && !app.fields.canGrant)"
              type="info"
              :closable="false"
              :title="t('grants.forbidden')"
            ></sdk-alert>
            <p v-else-if="grants.status === 'error'" class="apps-error" role="alert">{{ grants.message }}</p>
            <p v-else-if="grants.status !== 'ready'" class="apps-muted">{{ t('grants.loading') }}</p>
            <template v-else>
              <div class="apps-bar">
                <div class="apps-bar-group">
                  <sdk-tag size="small" :type="grants.value.shared ? 'success' : 'info'">
                    {{ t(grants.value.shared ? 'grants.shared' : 'grants.private') }}
                  </sdk-tag>
                  <sdk-button size="small" :disabled="busy" @click="shareApplication(!grants.value.shared)">
                    {{ t(grants.value.shared ? 'grants.shareOff' : 'grants.shareOn') }}
                  </sdk-button>
                </div>
                <sdk-button size="small" type="primary" @click="openGrantDialog">
                  {{ t('grants.add') }}
                </sdk-button>
              </div>

              <sdk-table :data="grants.value.grants" size="small" :empty-text="t('grants.none')">
                <sdk-table-column :label="t('grants.kind')" width="140">
                  <template #default="{ row }">{{ t('grants.' + row.principalKind) }}</template>
                </sdk-table-column>
                <sdk-table-column :label="t('grants.id')" min-width="200">
                  <template #default="{ row }">
                    <span>{{ row.principalName || row.principalId }}</span>
                  </template>
                </sdk-table-column>
                <sdk-table-column :label="t('grants.verb')" width="120">
                  <template #default="{ row }">
                    <sdk-tag size="small" :type="row.verb === 'edit' ? 'warning' : 'info'">
                      {{ t('grants.' + row.verb) }}
                    </sdk-tag>
                  </template>
                </sdk-table-column>
                <sdk-table-column :label="t('grants.actions')" width="100" fixed="right">
                  <template #default="{ row }">
                    <sdk-button
                      v-if="row.principalKind !== 'domain'"
                      size="small"
                      link
                      type="danger"
                      :disabled="busy"
                      @click="revokeExistingGrant(row)"
                    >
                      {{ t('grants.revoke') }}
                    </sdk-button>
                  </template>
                </sdk-table-column>
              </sdk-table>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- Grant parameter dialog -->
    <sdk-dialog v-model="grantOpen" :title="t('grants.dialogTitle')" width="420px" destroy-on-close>
      <sdk-form label-position="top" size="small">
        <sdk-form-item :label="t('grants.kind')">
          <sdk-select v-model="grantDraft.principalKind" style="width: 100%">
            <sdk-option value="principal" :label="t('grants.principal')"></sdk-option>
            <sdk-option value="role" :label="t('grants.role')"></sdk-option>
          </sdk-select>
        </sdk-form-item>
        <sdk-form-item :label="t('grants.id')">
          <sdk-input v-model="grantDraft.principalId" :placeholder="t('grants.recipientPlaceholder')"></sdk-input>
        </sdk-form-item>
        <sdk-form-item :label="t('grants.verb')">
          <sdk-select v-model="grantDraft.verb" style="width: 100%">
            <sdk-option value="use" :label="t('grants.use')"></sdk-option>
            <sdk-option value="edit" :label="t('grants.edit')"></sdk-option>
          </sdk-select>
        </sdk-form-item>
      </sdk-form>
      <p v-if="grantError" class="apps-error" role="alert">{{ grantError }}</p>
      <template #footer>
        <sdk-button size="small" @click="grantOpen = false">{{ t('action.cancel') }}</sdk-button>
        <sdk-button size="small" type="primary" :loading="busy" @click="submitGrant">
          {{ t('grants.grantAction') }}
        </sdk-button>
      </template>
    </sdk-dialog>

    <!-- Non-rendering data and write-operation slots (lazy-mounted per active tab) -->
    <div hidden>
      <projection v-if="mode === 'detail'" slot="record"></projection>
      <projection v-if="mode === 'detail' && (tabModel === 'entries' || tabModel === 'assets')" slot="entriesRead"></projection>
      <projection v-if="mode === 'detail' && tabModel === 'grants'" slot="grantsRead"></projection>
      <projection v-if="mode === 'detail' && tabModel === 'assets'" slot="panelInfo"></projection>
      <projection v-if="mode === 'detail'" slot="addEntry"></projection>
      <projection v-if="mode === 'detail'" slot="updateEntry"></projection>
      <projection v-if="mode === 'detail'" slot="deleteEntry"></projection>
      <projection v-if="mode === 'detail'" slot="grant"></projection>
      <projection v-if="mode === 'detail'" slot="share"></projection>
    </div>
  </div>
</div>
