<!-- Application catalogue: the owner supplies the list, selected record, forms and operations. -->
<style>
  [v-cloak] { display: none; }
  .apps { display: flex; flex-direction: column; gap: var(--spacing-md); padding-bottom: var(--spacing-4xl); }
  .apps-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--spacing-sm); }
  .apps-title { margin: 0; color: var(--el-text-color-primary); font-size: var(--text-lg); font-weight: var(--font-semibold); line-height: 1.5; }
  .apps-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--spacing-sm); }
  .apps-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-sm); }
  .apps-toolbar .apps-search { width: 260px; max-width: 100%; }
  .apps-count { margin-inline-start: auto; color: var(--el-text-color-secondary); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
  .apps-name { display: flex; align-items: center; gap: var(--spacing-sm); min-width: 0; }
  .apps-name-text { display: flex; flex-direction: column; min-width: 0; }
  .apps-name-text strong { font-weight: var(--font-semibold); }
  .apps-name-text small { color: var(--el-text-color-secondary); font-size: var(--text-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .apps-icon { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: var(--control-height-inline); padding: 0 var(--spacing-xs); border-radius: var(--radius-sm); background: var(--ui-fill-tertiary); color: var(--el-text-color-regular); font-size: var(--text-xs); font-family: var(--font-mono); flex: none; }
  .apps-hint { margin: 0; color: var(--el-text-color-secondary); font-size: var(--text-sm); line-height: 1.6; }
  .apps-error { margin: 0; color: var(--el-color-danger-text); font-size: var(--text-sm); line-height: 1.6; }
  .apps-ok { margin: 0; color: var(--el-color-success-text); font-size: var(--text-sm); line-height: 1.6; }
  .apps-card { display: flex; flex-direction: column; gap: var(--spacing-md); padding: var(--spacing-md); border: 1px solid var(--ui-divider); border-radius: var(--radius-md); }
  .apps-card-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-sm); }
  .apps-card-title { margin: 0; font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--el-text-color-primary); }
  .apps-section-title { margin: 0; font-size: var(--text-sm); font-weight: var(--font-semibold); color: var(--el-text-color-primary); }
  .apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--spacing-sm) var(--spacing-md); }
  .apps-field { min-width: 0; }
  .apps-field dt { margin: 0 0 calc(var(--spacing-xs) / 2); color: var(--el-text-color-secondary); font-size: var(--text-xs); }
  .apps-field dd { margin: 0; color: var(--el-text-color-primary); font-size: var(--text-sm); line-height: 1.6; word-break: break-word; }
  .apps-field dd code { font-size: var(--text-xs); background: var(--ui-fill-tertiary); padding: 0 var(--spacing-xs); border-radius: var(--radius-xs); }
  .apps-locales { display: flex; flex-direction: column; gap: calc(var(--spacing-xs) / 2); }
  .apps-locales span { color: var(--el-text-color-regular); font-size: var(--text-sm); word-break: break-word; }
  .apps-mono { font-family: var(--font-mono); font-size: var(--text-xs); word-break: break-all; }
  .apps-inline-actions { display: flex; flex-wrap: wrap; gap: var(--spacing-xs); }
  .apps-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--spacing-sm); }
  .apps-span { grid-column: 1 / -1; }
  .apps-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-sm); }
  .apps-link { color: var(--brand-link); font-size: var(--text-xs); }
  .apps-sheet { border-color: var(--ui-border); box-shadow: var(--elevation-panel); }
  .apps-confirm { border-color: var(--el-color-danger-light-5); }
  .apps-list-icon { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  .apps-list .el-table__cell { padding-inline: var(--spacing-xs) !important; }
  .apps-list .cell { padding-inline: var(--spacing-xs); }
  .apps-list .el-tag { padding-inline: var(--spacing-xs); }
</style>
<div id="app" v-cloak>
  <section class="apps shell-dock-room">

    <template v-if="mode === 'list'">
      <div class="apps-toolbar">
        <el-input class="apps-search" v-model="searchText" clearable placeholder="搜索应用名称或 ID" aria-label="搜索应用" @input="scheduleSearch"></el-input>
        <el-radio-group :model-value="scope" aria-label="范围" @change="setScope">
          <el-radio-button value="visible">全部可见</el-radio-button>
          <el-radio-button value="maintainable">我能维护的</el-radio-button>
        </el-radio-group>
        <el-select :model-value="pageSize" aria-label="每页条数" style="width: 110px" @change="setSize">
          <el-option :value="10" label="10 条/页"></el-option>
          <el-option :value="20" label="20 条/页"></el-option>
          <el-option :value="50" label="50 条/页"></el-option>
        </el-select>
        <span class="apps-count">{{ rows.length }} 条{{ pageIndex > 1 ? ' · 第 ' + pageIndex + ' 页' : '' }}{{ nextCursor ? ' · 还有更多' : '' }}</span>
        <el-button type="primary" @click="startCreate">新建应用</el-button>
      </div>

      <p class="apps-error" v-if="listError" role="alert">{{ listError }}</p>

      <el-table class="apps-list" v-loading="catalogue.status === 'loading'" :data="rows" row-key="id" @row-click="openRow">
        <el-table-column label="图标" width="92">
          <template #default="{ row }"><span class="apps-icon apps-list-icon" :title="row.icon">{{ row.icon }}</span></template>
        </el-table-column>
        <el-table-column label="名称" min-width="110">
          <template #default="{ row }">
            <span class="apps-name-text">
              <strong>{{ primaryName(row.names) }}</strong>
              <small v-if="secondaryName(row.names)">{{ secondaryName(row.names) }}</small>
            </span>
          </template>
        </el-table-column>
        <el-table-column label="来源" width="54">
          <template #default="{ row }">
            <el-tag size="small" :type="row.source === 'builtin' ? 'info' : 'primary'">{{ row.source === 'builtin' ? '内置' : '域内' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="维护权限" width="72">
          <template #default="{ row }">{{ row.canMaintain ? '能维护' : '只读' }}</template>
        </el-table-column>
        <el-table-column label="入口数" width="62">
          <template #default="{ row }">{{ row.entryCount }}</template>
        </el-table-column>
        <template #empty>
          <span>{{ catalogue.status === 'loading' ? '正在读取…' : (listError ? '读取失败' : '没有符合条件的应用') }}</span>
        </template>
      </el-table>

      <div class="apps-foot">
        <el-button :disabled="!isFirstPage" @click="firstPage">回到第一页</el-button>
        <el-button :disabled="!nextCursor" @click="nextPage">下一页</el-button>
        <span class="apps-hint">翻页由属主的游标决定：下一页读的是当前这页之后的那一段。</span>
      </div>
      <p class="apps-hint">不能显示的入口不会让应用消失：应用照样列在这里，它的入口由属主决定给谁看。</p>
    </template>

    <template v-else-if="mode === 'detail'">
      <header class="apps-head">
        <div>
          <h1 class="apps-title">{{ app ? primaryName(app.names) : '一张应用' }}</h1>
          <p class="apps-sub" v-if="app">{{ app.source === 'builtin' ? '内置应用，随平台维护' : '域内应用' }} · <code>{{ app.id }}</code></p>
        </div>
        <div class="apps-actions">
          <el-button @click="backToList">返回列表</el-button>
          <el-button v-if="app" type="primary" @click="openApplication">打开应用</el-button>
        </div>
      </header>

      <p class="apps-hint" v-if="record.status === 'loading'">正在读取这张应用…</p>
      <p class="apps-hint" v-else-if="record.status === 'awaiting'">从列表里选一张应用。</p>
      <p class="apps-hint" v-else-if="record.status === 'empty'">这张应用已经不在了。</p>
      <p class="apps-error" v-else-if="record.status === 'forbidden'" role="alert">你没有权限看这张应用。</p>
      <p class="apps-error" v-else-if="record.status === 'error'" role="alert">{{ record.message }}</p>

      <template v-if="app">
        <p class="apps-error" v-if="actionError" role="alert">{{ actionError }}</p>
        <p class="apps-ok" v-if="actionNote">{{ actionNote }}</p>

        <div class="apps-card">
          <div class="apps-card-head">
            <h2 class="apps-section-title">身份</h2>
            <span class="apps-count" v-if="app.canMaintain">
              <span class="apps-inline-actions">
                <el-button size="small" @click="formSection = 'identity'">编辑身份</el-button>
              </span>
            </span>
          </div>
          <dl class="apps-grid">
            <div class="apps-field">
              <dt>名称</dt>
              <dd class="apps-locales">
                <span v-for="item in localeRows(app.names)" :key="'n-' + item.key">{{ item.key }}：{{ item.value }}</span>
                <span v-if="!localeRows(app.names).length">—</span>
              </dd>
            </div>
            <div class="apps-field">
              <dt>说明</dt>
              <dd class="apps-locales">
                <span v-for="item in localeRows(app.descriptions)" :key="'d-' + item.key">{{ item.key }}：{{ item.value || '—' }}</span>
                <span v-if="!localeRows(app.descriptions).length">—</span>
              </dd>
            </div>
            <div class="apps-field">
              <dt>图标</dt>
              <dd><code>{{ app.icon }}</code></dd>
            </div>
            <div class="apps-field">
              <dt>来源</dt>
              <dd>{{ app.source === 'builtin' ? '内置' : '域内' }}</dd>
            </div>
            <div class="apps-field">
              <dt>我能做的</dt>
              <dd>{{ permissionSummary(app) }}</dd>
            </div>
            <div class="apps-field">
              <dt>入口</dt>
              <dd><code>{{ app.entry.path }}</code>{{ app.entry.renderer ? ' · ' + app.entry.renderer : '' }}{{ app.entry.home ? ' · 首页 ' + app.entry.home : '' }}</dd>
            </div>
          </dl>
          <div class="apps-inline-actions">
            <el-button size="small" text @click="openClassCatalogue">查看所属类</el-button>
            <span class="apps-hint" v-if="classLinkNote">{{ classLinkNote }}</span>
          </div>
        </div>

        <div class="apps-card">
          <div class="apps-card-head">
            <h2 class="apps-section-title">入口</h2>
            <span class="apps-count apps-inline-actions">
              <template v-if="app.canEditEntries">
                <el-button size="small" @click="startAddEntry">添加入口</el-button>
                <el-button size="small" @click="formSection = 'entries'">编辑入口表</el-button>
              </template>
              <span class="apps-hint" v-else-if="app.source !== 'builtin'">这张应用的入口由属主按它的发布方式维护，这里不能改。</span>
            </span>
          </div>
          <p class="apps-hint" v-if="!app.canMaintain">你只能看到自己有权限进的入口，属主已经把其余的裁掉了。</p>
          <el-table :data="app.panelUses" row-key="id" size="small">
            <el-table-column label="菜单名" min-width="160">
              <template #default="{ row }">{{ primaryName(row.names) || row.pageKey }}</template>
            </el-table-column>
            <el-table-column label="地址" min-width="220">
              <template #default="{ row }"><span class="apps-mono">{{ row.path }}</span></template>
            </el-table-column>
            <el-table-column label="面板" min-width="190">
              <template #default="{ row }">
                <el-button size="small" text class="apps-link apps-mono" @click="inspectPanel(row.panelId)">{{ row.panelId }}</el-button>
                <el-button size="small" text @click="openPanelCatalogue(row.panelId)">面板目录</el-button>
              </template>
            </el-table-column>
            <el-table-column label="传入值" min-width="140">
              <template #default="{ row }"><span class="apps-mono">{{ inputsText(row.inputs) }}</span></template>
            </el-table-column>
            <el-table-column label="组与顺序" min-width="130">
              <template #default="{ row }">{{ groupText(row.groupKey) }}</template>
            </el-table-column>
            <el-table-column label="准入" min-width="130">
              <template #default="{ row }">{{ accessText(row.access) }}</template>
            </el-table-column>
            <el-table-column label="默认智能体" min-width="140">
              <template #default="{ row }">{{ agentText(row.defaultAgent) }}</template>
            </el-table-column>
            <el-table-column label="操作" width="150" v-if="app.canEditEntries">
              <template #default="{ row }">
                <span class="apps-inline-actions">
                  <el-button size="small" text @click.stop="startEditEntry(row)">编辑</el-button>
                  <el-button size="small" text type="danger" @click.stop="removeEntry(row)">删除</el-button>
                </span>
              </template>
            </el-table-column>
            <template #empty><span>这张应用还没有入口。</span></template>
          </el-table>
          <dl class="apps-grid" v-if="app.theme || app.framePanelId">
            <div class="apps-field" v-if="app.framePanelId">
              <dt>外框面板</dt>
              <dd><code>{{ app.framePanelId }}</code></dd>
            </div>
            <div class="apps-field" v-if="app.theme">
              <dt>主题</dt>
              <dd class="apps-mono">{{ themeText(app.theme) }}</dd>
            </div>
          </dl>
        </div>

        <div class="apps-card">
          <div class="apps-card-head">
            <h2 class="apps-section-title">用到的面板和投影</h2>
            <span class="apps-hint">由入口引用的面板、以及面板成员引用的投影得出。</span>
          </div>
          <dl class="apps-grid">
            <div class="apps-field">
              <dt>面板（{{ usedPanels.length }}）</dt>
              <dd class="apps-inline-actions">
                <el-button v-for="panelId in usedPanels" :key="panelId" size="small" @click="inspectPanel(panelId)">{{ panelId }}</el-button>
                <span v-if="!usedPanels.length">—</span>
              </dd>
            </div>
            <div class="apps-field">
              <dt>投影{{ inspectedPanelId ? '（' + inspectedPanelId + ' 的成员）' : '' }}</dt>
              <dd class="apps-inline-actions">
                <template v-if="inspectedPanelId">
                  <el-button v-for="projectionId in inspectedProjections" :key="projectionId" size="small" text class="apps-mono" @click="openPanelCatalogue(inspectedPanelId)">{{ projectionId }}</el-button>
                  <span v-if="panelInfo.status === 'loading'">正在读面板成员…</span>
                  <span v-else-if="panelInfo.status === 'error'" class="apps-error">{{ panelInfo.message }}</span>
                  <span v-else-if="!inspectedProjections.length && panelInfo.status === 'ready'">这个面板没有用投影。</span>
                </template>
                <span v-else>选一个上面的面板，看它由哪些投影组成。</span>
              </dd>
            </div>
          </dl>
        </div>

        <div class="apps-card" v-if="app.canMaintain || app.canGrant">
          <div class="apps-card-head">
            <h2 class="apps-section-title">维护与授权</h2>
          </div>
          <div class="apps-inline-actions">
            <el-button v-if="app.canMaintain" size="small" type="danger" @click="removeApplication">删除这张应用</el-button>
            <el-button v-if="app.canGrant" size="small" @click="openGrant">授予或撤销使用授权</el-button>
            <span class="apps-hint" v-if="app.source === 'builtin'">内置应用随平台维护，这里不提供改动。</span>
          </div>
        </div>
      </template>
    </template>

    <template v-else-if="mode === 'create'">
      <header class="apps-head">
        <div>
          <h1 class="apps-title">新建应用</h1>
          <p class="apps-sub">表单由应用目录（属主）声明，字段与校验都在它那里；保存后新应用出现在列表里，不会覆盖同 ID 的应用。</p>
        </div>
        <div class="apps-actions">
          <el-button @click="backToList">取消</el-button>
        </div>
      </header>
      <p class="apps-error" v-if="actionError" role="alert">{{ actionError }}</p>
    </template>

    <div class="apps-card apps-sheet" v-show="mode === 'create' || formSection === 'identity'">
      <div v-if="mode !== 'create'" class="apps-card-head"><h2 class="apps-section-title">编辑身份</h2></div>
      <projection slot="save" @saved="finishForm" @discarded="discardForm"></projection>
    </div>

    <div class="apps-card apps-sheet" v-show="formSection === 'entries'">
      <div class="apps-card-head"><h2 class="apps-section-title">编辑入口表</h2></div>
      <projection slot="entriesForm" @saved="finishForm" @discarded="closeForm"></projection>
    </div>

    <div class="apps-card apps-sheet" v-if="entryOpen">
      <div class="apps-card-head">
        <h2 class="apps-section-title">{{ entryEditing ? '编辑入口' : '添加入口' }}</h2>
        <span class="apps-hint">地址以 / 开头、不带问号井号空白；页面键在本域内唯一。</span>
      </div>
      <el-form label-position="top">
        <div class="apps-form-grid">
          <el-form-item label="入口 ID">
            <el-input v-model="entry.id" :disabled="entryEditing" placeholder="本应用内唯一，如 use-manage"></el-input>
          </el-form-item>
          <el-form-item label="面板 ID">
            <el-input v-model="entry.panelId" placeholder="如 panel-ontology-applications"></el-input>
          </el-form-item>
          <el-form-item label="地址">
            <el-input v-model="entry.path" placeholder="/applications/<应用 ID>/<页面>"></el-input>
          </el-form-item>
          <el-form-item label="页面键">
            <el-input v-model="entry.pageKey" placeholder="本域内唯一，留空用入口 ID"></el-input>
          </el-form-item>
          <el-form-item label="菜单名 · zh-CN">
            <el-input v-model="entry.nameZh"></el-input>
          </el-form-item>
          <el-form-item label="菜单名 · en">
            <el-input v-model="entry.nameEn"></el-input>
          </el-form-item>
          <el-form-item label="组">
            <el-select v-model="entry.groupKey" clearable filterable allow-create default-first-option placeholder="不分组" style="width: 100%">
              <el-option v-for="group in groupChoices" :key="group.key" :value="group.key" :label="group.label"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="准入">
            <el-select v-model="entry.accessKind" style="width: 100%">
              <el-option value="domain-member" label="本域成员都能进"></el-option>
              <el-option value="permissionCode" label="只给一个权限码"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="权限码" v-if="entry.accessKind === 'permissionCode'" class="apps-span">
            <el-input v-model="entry.permissionCode" placeholder="本应用声明过的权限码"></el-input>
          </el-form-item>
          <el-form-item label="默认智能体">
            <el-select v-model="entry.agentKind" style="width: 100%">
              <el-option value="none" label="通用助手"></el-option>
              <el-option value="id" label="按智能体 ID"></el-option>
              <el-option value="preset" label="按预置类型"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item :label="entry.agentKind === 'preset' ? '预置类型' : '智能体 ID'" v-if="entry.agentKind !== 'none'">
            <el-input v-model="entry.agentValue"></el-input>
          </el-form-item>
          <el-form-item label="传入值（JSON 对象，可选）" class="apps-span">
            <el-input v-model="entry.inputsText" type="textarea" :rows="3" placeholder='{"frameState": "..."}'></el-input>
          </el-form-item>
        </div>
      </el-form>
      <p class="apps-error" v-if="entryError" role="alert">{{ entryError }}</p>
      <div class="apps-inline-actions">
        <el-button size="small" @click="entryOpen = false">取消</el-button>
        <el-button size="small" type="primary" :loading="busy" @click="submitEntry">{{ entryEditing ? '保存入口' : '添加入口' }}</el-button>
      </div>
    </div>

    <div class="apps-card apps-sheet" v-if="grantOpen">
      <div class="apps-card-head">
        <h2 class="apps-section-title">使用授权</h2>
        <span class="apps-hint">授权由治理属主判：这里只把你的意思交给它。</span>
      </div>
      <el-form label-position="top">
        <div class="apps-form-grid">
          <el-form-item label="授给谁">
            <el-select v-model="grant.principalKind" style="width: 100%">
              <el-option value="principal" label="一个人"></el-option>
              <el-option value="role" label="一个角色"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item :label="grant.principalKind === 'role' ? '角色 ID' : '用户 ID'">
            <el-input v-model="grant.principalId" placeholder="平台里的 ID"></el-input>
          </el-form-item>
          <el-form-item label="哪一种">
            <el-select v-model="grant.verb" style="width: 100%">
              <el-option value="use" label="使用"></el-option>
              <el-option value="edit" label="维护"></el-option>
            </el-select>
          </el-form-item>
        </div>
      </el-form>
      <p class="apps-error" v-if="grantError" role="alert">{{ grantError }}</p>
      <div class="apps-inline-actions">
        <el-button size="small" @click="grantOpen = false">取消</el-button>
        <el-button size="small" :loading="busy" @click="submitGrant(true)">撤销</el-button>
        <el-button size="small" type="primary" :loading="busy" @click="submitGrant(false)">授予</el-button>
      </div>
    </div>

    <div class="apps-card apps-sheet apps-confirm" v-if="confirmState.open">
      <p class="apps-hint">{{ confirmState.message }}</p>
      <div class="apps-inline-actions">
        <el-button size="small" @click="confirmState.open = false">取消</el-button>
        <el-button size="small" type="danger" :loading="busy" @click="confirmRemove">确认</el-button>
      </div>
    </div>

    <div hidden>
      <projection slot="catalogue"></projection>
      <projection slot="record"></projection>
      <projection slot="deleteApp"></projection>
      <projection slot="grant"></projection>
      <projection slot="addEntry"></projection>
      <projection slot="updateEntry"></projection>
      <projection slot="deleteEntry"></projection>
      <projection slot="panelInfo"></projection>
    </div>
  </section>
</div>
