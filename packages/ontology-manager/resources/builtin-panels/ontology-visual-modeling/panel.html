<style>
  .visual-modeling {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: visual-modeling / inline-size;
  }
  .vm-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--page-gutter);
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
    flex: 0 0 auto;
  }
  .vm-toolbar .vm-hint {
    flex: 1 1 16rem;
    min-width: 0;
  }
  .vm-selection {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-xs);
  }
  .vm-body {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--page-gutter) var(--page-content-gap);
    align-items: stretch;
    overflow: hidden;
  }
  .vm-canvas {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background-color: var(--sdk-bg-color-page);
    background-image: radial-gradient(var(--sdk-border-color, var(--ui-border)) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
  }
  /* Keep the graph member pinned to the canvas box so resize observers measure a definite height. */
  .vm-canvas > [data-member] {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 100%;
    grid-template-columns: 100%;
    overflow: hidden;
  }
  /* Let the graph fill short or stacked containers without clipping its bottom toolbar. */
  .vm-canvas > [data-member] .sdk-object-graph-canvas {
    min-height: 0;
  }
  .vm-side {
    flex: 0 0 24rem;
    width: 24rem;
    min-width: 0;
    min-height: 0;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    padding: var(--spacing-md);
    overflow-y: auto;
  }
  .vm-side > *,
  .vm-side-section > * {
    flex: 0 0 auto;
  }
  .vm-side-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .vm-side-header-main {
    flex: 1 1 auto;
    min-width: 0;
  }
  .vm-side-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
  }
  .vm-side-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .vm-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-secondary);
  }
  .vm-side .sdk-panel-member,
  .vm-side .sdk-owner-form,
  .vm-side .sdk-owner-form-inner,
  .vm-dialog-body .sdk-panel-member,
  .vm-dialog-body .sdk-owner-form,
  .vm-dialog-body .sdk-owner-form-inner {
    flex: 0 0 auto;
    height: auto;
  }
  .vm-side .sdk-owner-form-body,
  .vm-dialog-body .sdk-owner-form-body {
    flex: 0 0 auto;
    overflow: visible;
  }
  .vm-attributes .sdk-panel-member,
  .vm-attributes .sdk-object-list,
  .vm-attributes .sdk-object-list-items {
    flex: 0 0 auto;
    height: auto;
    overflow: visible;
  }
  .vm-state {
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
    margin: 0;
  }

  @container visual-modeling (max-width: 860px) {
    .vm-body {
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .vm-canvas {
      flex: 1 0 min(22rem, 100%);
      min-height: min(22rem, 100%);
    }
    .vm-side {
      flex: 0 0 auto;
      width: 100%;
      max-height: none;
      overflow-y: visible;
    }
  }
</style>

<div id="app" ref="rootRef" class="visual-modeling">
  <page-header :title="t('panel.name')">
    <template #actions>
      <sdk-button text :aria-label="t('visualModeling.refresh')" :title="t('visualModeling.refresh')" @click="refresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </sdk-button>
      <sdk-button @click="openRelationDialog">{{ t("visualModeling.addRelation") }}</sdk-button>
      <sdk-button type="primary" @click="openClassDialog">{{ t("visualModeling.addObjectType") }}</sdk-button>
    </template>
  </page-header>
  <div class="vm-toolbar">
    <span class="vm-hint">{{ t("visualModeling.hint") }}</span>
    <div class="vm-selection">
      <sdk-tag v-if="selectedNode" type="primary" size="small" disable-transitions>
        {{ t("visualModeling.selectedType", { name: selectedNodeLabel }) }}
      </sdk-tag>
      <sdk-tag v-else-if="selectedEdge" type="success" size="small" disable-transitions>
        {{ t("visualModeling.selectedRelation", { name: selectedEdgeLabel }) }}
      </sdk-tag>
      <span v-else class="vm-state">{{ t("visualModeling.noSelection") }}</span>
      <sdk-button v-if="selectedNode || selectedEdge" text size="small" @click="requestCloseSide">
        {{ t("visualModeling.close") }}
      </sdk-button>
    </div>
  </div>

  <div class="vm-body">
    <div class="vm-canvas">
      <projection slot="graph"></projection>
    </div>

    <aside v-if="selectedNode || selectedEdge" class="vm-side">
      <template v-if="selectedNode">
        <div class="vm-side-header">
          <div class="vm-side-header-main">
            <projection slot="nodeHeader"></projection>
          </div>
          <sdk-button text size="small" @click="requestCloseSide">{{ t("visualModeling.close") }}</sdk-button>
        </div>
        <template v-if="!nodeMissing">
          <projection slot="classForm"></projection>
          <div class="vm-side-actions">
            <sdk-button size="small" @click="browseData">{{ t("visualModeling.openData") }}</sdk-button>
            <projection slot="classDelete" @done="onClassDeleted"></projection>
          </div>

          <div class="vm-side-section">
            <div class="vm-section-head">
              <span>
                {{ t("visualModeling.attributes") }}
                <template v-if="attributesTotal !== null">
                  · {{ t("visualModeling.attributeCount", { count: attributesTotal }) }}
                </template>
              </span>
              <sdk-button text size="small" @click="newAttribute">{{ t("visualModeling.newAttribute") }}</sdk-button>
            </div>
            <div class="vm-attributes">
              <projection slot="attributes"></projection>
            </div>
          </div>

          <div class="vm-side-section">
            <div class="vm-section-head">
              <span>{{ selectedAttribute ? t("visualModeling.editAttribute") : t("visualModeling.newAttribute") }}</span>
            </div>
            <projection slot="attributeForm"></projection>
            <div v-if="selectedAttribute" class="vm-selection">
              <projection slot="attributePrimaryKey"></projection>
              <projection slot="attributeDelete" @done="onAttributeDeleted"></projection>
            </div>
          </div>
        </template>
      </template>

      <template v-else>
        <div class="vm-side-header">
          <div class="vm-side-header-main">
            <projection slot="edgeHeader"></projection>
          </div>
          <sdk-button text size="small" @click="requestCloseSide">{{ t("visualModeling.close") }}</sdk-button>
        </div>
        <template v-if="!edgeMissing">
          <projection slot="relationForm"></projection>
          <div class="vm-side-actions">
            <projection slot="relationDelete" @done="onRelationDeleted"></projection>
          </div>
        </template>
      </template>
    </aside>
  </div>

  <sdk-dialog
    v-model="classDialog"
    :title="t('visualModeling.createClassTitle')"
    :width="narrow ? '94%' : '540px'"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <projection
        v-if="classDialog"
        slot="classCreate"
        @saved="closeDialog"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>

  <sdk-dialog
    v-model="relationDialog"
    :title="t('visualModeling.createRelationTitle')"
    :width="narrow ? '94%' : '540px'"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <projection
        v-if="relationDialog"
        slot="relationCreate"
        @saved="closeDialog"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>
</div>
