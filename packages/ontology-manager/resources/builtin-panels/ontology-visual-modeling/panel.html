<style>
  .visual-modeling {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: visual-modeling / inline-size;
  }
  /* Visually hidden probe container mounting official catalog/header projections without affecting layout. */
  .vm-probe {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .vm-selection {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
  }
  .vm-selection-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  .vm-selection-actions .sdk-panel-member {
    display: inline-flex;
    width: auto;
    height: auto;
  }
  .vm-notice {
    flex: 0 0 auto;
    padding: var(--spacing-sm) var(--page-gutter);
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
    background: var(--sdk-bg-color);
  }
  .vm-notice-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  /* Edge-to-edge workspace matching original VisualModeling + VisualModelingRightPanel hairline layout. */
  .vm-body {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    align-items: stretch;
    overflow: hidden;
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
  }
  .vm-canvas {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    background-color: var(--sdk-bg-color-page);
    background-image: radial-gradient(var(--sdk-border-color, var(--ui-border)) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
  }
  /* Keep the graph member pinned to the canvas box so resize observers measure a definite height. */
  .vm-canvas > [data-member] {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: 100%;
    grid-template-columns: 100%;
    overflow: hidden;
  }
  /* Let the graph fill short or stacked containers without clipping its bottom toolbar. */
  .vm-canvas > [data-member] .sdk-object-graph-canvas {
    min-height: 0;
  }
  .vm-side {
    flex: 0 0 var(--shell-inspector, 320px);
    width: var(--shell-inspector, 320px);
    min-width: 0;
    min-height: 0;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--sdk-border-color, var(--ui-border));
    background: var(--sdk-bg-color);
    overflow: hidden;
  }
  .vm-side-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-md) var(--spacing-lg);
    border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    flex: 0 0 auto;
    min-width: 0;
  }
  .vm-side-header-main {
    flex: 1 1 auto;
    min-width: 0;
  }
  .vm-side-content {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--spacing-lg) calc(var(--spacing-md) + var(--pane-dock-space, 0px));
    overflow-y: auto;
  }
  .vm-side-content > *,
  .vm-side-section > * {
    flex: 0 0 auto;
  }
  .vm-side-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
    padding-top: var(--spacing-md);
    border-top: 1px solid var(--sdk-border-color-light, var(--ui-divider));
  }
  .vm-section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-secondary);
  }
  .vm-attr-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-xs);
  }
  .vm-side .sdk-panel-member,
  .vm-side .sdk-owner-form,
  .vm-side .sdk-owner-form-inner,
  .vm-dialog-body .sdk-panel-member,
  .vm-dialog-body .sdk-owner-form,
  .vm-dialog-body .sdk-owner-form-inner {
    flex: 0 0 auto;
    height: auto;
  }
  .vm-side .sdk-owner-form-body,
  .vm-dialog-body .sdk-owner-form-body {
    flex: 0 0 auto;
    overflow: visible;
  }
  .vm-attributes .sdk-panel-member,
  .vm-attributes .sdk-object-list,
  .vm-attributes .sdk-object-list-cards {
    flex: 0 0 auto;
    height: auto;
    overflow: visible;
  }
  .vm-attributes .sdk-object-list-cards {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--spacing-sm);
  }
  .vm-attributes .sdk-object-list-card {
    gap: var(--spacing-xs);
    padding: var(--spacing-sm) var(--spacing-md);
  }
  .vm-attr-card {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .vm-attr-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .vm-attr-card-title {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-primary);
  }
  .vm-attr-card-title code {
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .vm-attr-type-row .sdk-object-form-fields {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  .vm-attr-switches .sdk-object-form-fields {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-xs) var(--spacing-md);
    align-items: center;
  }
  .vm-attr-switches .sdk-object-form-fields > * {
    flex: 0 1 auto;
    min-width: 84px;
  }
  .vm-attr-fields .sdk-object-form-fields {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
  }
  .vm-attr-row-delete {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    flex-shrink: 0;
  }
  .vm-dialog-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }
  .vm-relation-ends {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: var(--spacing-xs);
  }
  .vm-relation-ends > .sdk-panel-member {
    min-width: 0;
  }
  .vm-relation-arrow {
    color: var(--sdk-text-color-placeholder);
  }
  .vm-state {
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
    margin: 0;
  }

  @container visual-modeling (max-width: 1400px) {
    .vm-side {
      flex-basis: 300px;
      width: 300px;
    }
  }

  @container visual-modeling (max-width: 900px) {
    .vm-body {
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: var(--pane-dock-space, 0px);
    }
    .vm-canvas {
      flex: 1 0 360px;
      min-height: 360px;
    }
    .vm-side {
      flex: 0 0 auto;
      width: 100%;
      max-height: 46cqh;
      border-left: 0;
      border-top: 1px solid var(--sdk-border-color, var(--ui-border));
    }
  }
</style>

<div id="app" ref="rootRef" class="visual-modeling">
  <!-- Hidden catalog and edge header probes for relation defaults, edge toolbar label, and focus error detection. -->
  <div class="vm-probe" aria-hidden="true">
    <projection slot="objectCatalog"></projection>
    <projection slot="relationCatalog"></projection>
    <projection v-if="selectedEdge" slot="edgeHeader"></projection>
  </div>

  <page-header
    :title="t('panel.name')"
    :description="t('visualModeling.description')"
    :back-label="fromPlayground ? t('visualModeling.backToGraph') : undefined"
    @back="backToGraph"
  >
    <template #actions>
      <sdk-button icon="link" @click="openRelationDialog">{{ t("visualModeling.addRelation") }}</sdk-button>
      <sdk-button type="primary" icon="plus" @click="openClassDialog">{{ t("visualModeling.addObjectType") }}</sdk-button>
    </template>
  </page-header>

  <div v-if="showEdgeBanner" class="vm-notice" data-vm-edge-status>
    <info-banner
      v-if="edgeForbidden"
      compact
      tone="warning"
      :title="t('visualModeling.edgeForbiddenTitle')"
      :text="t('visualModeling.edgeForbiddenText', { name: selectedEdge?.primaryKey ?? '' })"
    >
      <template #actions>
        <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
      </template>
    </info-banner>
    <info-banner
      v-else-if="edgeNotFound"
      compact
      tone="warning"
      :title="t('visualModeling.focusRelationNotFoundTitle')"
      :text="t('visualModeling.focusRelationNotFound', { name: selectedEdge?.primaryKey ?? '' })"
    >
      <template #actions>
        <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
      </template>
    </info-banner>
    <info-banner
      v-else-if="edgeReadError"
      compact
      tone="danger"
      :title="t('visualModeling.edgeReadFailedTitle')"
      :text="edgeHeaderError || t('visualModeling.readFailedFallback')"
    >
      <template #actions>
        <div class="vm-notice-actions">
          <sdk-button size="small" @click="retryDetail">{{ t("visualModeling.retry") }}</sdk-button>
          <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
        </div>
      </template>
    </info-banner>
  </div>

  <div class="vm-body">
    <div class="vm-canvas">
      <projection slot="graph" :values="{ hint: t('visualModeling.hint') }" @choose="onGraphChoose">
        <template #toolbar-actions>
          <div class="vm-selection">
            <sdk-tag v-if="selectedNode" type="primary" size="small" disable-transitions>
              {{ t("visualModeling.selectedType", { name: selectedNodeLabel }) }}
            </sdk-tag>
            <sdk-tag v-else-if="selectedEdge" type="success" size="small" disable-transitions>
              {{ t("visualModeling.selectedRelation", { name: selectedEdgeLabel }) }}
            </sdk-tag>
            <span v-else class="vm-state">{{ t("visualModeling.noSelection") }}</span>
            <div class="vm-selection-actions">
              <sdk-button
                size="small"
                icon="pencil"
                :disabled="!canEditSelected"
                @click="openEditSelectedDialog"
              >
                {{ t("visualModeling.edit") }}
              </sdk-button>
              <projection v-if="selectedNode" slot="classDelete" @done="onClassDeleted"></projection>
              <projection v-else-if="selectedEdge" slot="relationDelete" @done="onRelationDeleted"></projection>
              <sdk-button v-else type="danger" text size="small" icon="trash-2" disabled>
                {{ t("visualModeling.delete") }}
              </sdk-button>
            </div>
          </div>
        </template>
      </projection>
    </div>

    <aside v-if="selectedNode" class="vm-side">
      <div class="vm-side-header">
        <div class="vm-side-header-main">
          <div v-show="showNodeContent">
            <projection
              slot="nodeHeader"
              :values="{ fallbackTitle: nodeEverReady ? (lastNodeLabel || selectedNode.primaryKey) : undefined }"
            ></projection>
          </div>
          <span v-if="!showNodeContent" class="vm-state">{{ selectedNode.primaryKey }}</span>
        </div>
        <sdk-button text size="small" @click="requestCloseSide">{{ t("visualModeling.close") }}</sdk-button>
      </div>

      <div class="vm-side-content">
        <info-banner
          v-if="nodeForbidden"
          compact
          tone="warning"
          :title="t('visualModeling.nodeForbiddenTitle')"
          :text="t('visualModeling.nodeForbiddenText', { name: selectedNode.primaryKey })"
        >
          <template #actions>
            <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
          </template>
        </info-banner>
        <info-banner
          v-else-if="nodeNotFound"
          compact
          tone="warning"
          :title="t('visualModeling.focusObjectNotFoundTitle')"
          :text="t('visualModeling.focusObjectNotFound', { name: selectedNode.primaryKey })"
        >
          <template #actions>
            <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
          </template>
        </info-banner>
        <info-banner
          v-else-if="nodeReadError"
          compact
          tone="danger"
          :title="t('visualModeling.nodeReadFailedTitle')"
          :text="nodeHeaderError || t('visualModeling.readFailedFallback')"
        >
          <template #actions>
            <div class="vm-notice-actions">
              <sdk-button size="small" @click="retryDetail">{{ t("visualModeling.retry") }}</sdk-button>
              <sdk-button size="small" @click="requestCloseSide">{{ t("visualModeling.clearSelection") }}</sdk-button>
            </div>
          </template>
        </info-banner>

        <template v-if="showNodeContent">
          <projection slot="classInlineForm"></projection>

          <div class="vm-side-section">
            <div class="vm-section-head">
              <span>
                {{ t("visualModeling.attributes") }}
                <template v-if="attributesTotal !== null">
                  · {{ t("visualModeling.attributeCount", { count: attributesTotal }) }}
                </template>
              </span>
              <sdk-button text size="small" icon="plus" @click="openAttributeDialog">
                {{ t("visualModeling.newAttribute") }}
              </sdk-button>
            </div>
            <div class="vm-attributes">
              <projection slot="attributes">
                <template #card="{ ref: attrRef, title, subtitle }">
                  <div class="vm-attr-card" :data-attr-card="attrRef.primaryKey">
                    <div class="vm-attr-card-head">
                      <div class="vm-attr-card-title">
                        <strong>{{ title }}</strong>
                        <code v-if="subtitle">{{ subtitle }}</code>
                      </div>
                      <row-delete-button :label="t('visualModeling.delete')"></row-delete-button>
                    </div>
                    <projection :key="attrRef.primaryKey" slot="attributeInlineForm" :inputs="{ target: attrRef }">
                      <template #default>
                        <div class="vm-attr-type-row">
                          <object-form-fields :fields="['/type']"></object-form-fields>
                        </div>
                        <div class="vm-attr-switches">
                          <object-form-fields :fields="['/enable', '/businessKey', '/primaryKey']"></object-form-fields>
                        </div>
                        <div class="vm-attr-fields">
                          <object-form-fields :fields="['/showName', '/attrDesc']"></object-form-fields>
                        </div>
                      </template>
                      <template #field-type="{ value }">
                        <sdk-tag v-if="value" size="small" effect="plain">{{ value }}</sdk-tag>
                      </template>
                    </projection>
                  </div>
                </template>
              </projection>
            </div>
          </div>
        </template>
      </div>
    </aside>
  </div>

  <sdk-dialog
    :model-value="classDialog"
    :title="t('visualModeling.createClassTitle')"
    :width="narrow ? '94%' : '480px'"
    :before-close="handleDialogClose"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <projection
        v-if="classDialog"
        slot="classCreate"
        @saved="onClassCreated"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>

  <sdk-dialog
    :model-value="editClassDialog"
    :title="t('visualModeling.editClassTitle')"
    :width="narrow ? '94%' : '480px'"
    :before-close="handleDialogClose"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <projection
        v-if="editClassDialog"
        slot="classForm"
        @saved="closeDialog"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>

  <sdk-dialog
    :model-value="relationDialog"
    :title="t('visualModeling.createRelationTitle')"
    :width="narrow ? '94%' : '400px'"
    :before-close="handleDialogClose"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <info-banner compact tone="info" :text="t('visualModeling.joinFieldHint')"></info-banner>
      <projection
        v-if="relationDialog"
        slot="relationCreate"
        @saved="onRelationCreated"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>

  <sdk-dialog
    :model-value="editRelationDialog"
    :title="t('visualModeling.editRelationTitle')"
    :width="narrow ? '94%' : '400px'"
    :before-close="handleDialogClose"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <info-banner
        v-if="edgeReadError && edgeEverReady"
        compact
        tone="danger"
        :title="t('visualModeling.edgeReadFailedTitle')"
        :text="edgeHeaderError || t('visualModeling.readFailedFallback')"
      >
        <template #actions>
          <sdk-button size="small" @click="retryDetail">{{ t("visualModeling.retry") }}</sdk-button>
        </template>
      </info-banner>
      <template v-if="editRelationDialog && showEdgeContent">
        <div class="vm-relation-ends">
          <projection slot="relationEditFrom"></projection>
          <svg class="vm-relation-arrow" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M3 8h10M9.5 4.5 13 8l-3.5 3.5" />
          </svg>
          <projection slot="relationEditTo"></projection>
        </div>
        <info-banner compact tone="info" :text="t('visualModeling.joinFieldHint')"></info-banner>
        <projection
          slot="relationForm"
          @saved="closeDialog"
          @discarded="closeDialog"
          @cancel="closeDialog"
        ></projection>
      </template>
    </div>
  </sdk-dialog>

  <sdk-dialog
    :model-value="attributeDialog"
    :title="t('visualModeling.createAttributeTitle')"
    :width="narrow ? '94%' : '440px'"
    :before-close="handleDialogClose"
    append-to-body
    destroy-on-close
  >
    <div class="vm-dialog-body">
      <projection
        v-if="attributeDialog"
        slot="attributeCreate"
        @saved="onAttributeCreated"
        @discarded="closeDialog"
        @cancel="closeDialog"
      ></projection>
    </div>
  </sdk-dialog>
</div>
