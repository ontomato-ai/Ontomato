<style>
  [v-cloak] { display: none; }
  .mc-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: mc-page / inline-size;
  }
  .mc-body {
    display: flex;
    flex: 1;
    min-height: 0;
    min-width: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
  }
  .mc-split {
    display: grid;
    grid-template-columns: minmax(220px, var(--shell-list-panel, 260px)) minmax(0, 1fr);
    flex: 1;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: hidden;
  }
  .mc-sidebar {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md);
    background: var(--sdk-fill-color-light);
    border-inline-end: 1px solid var(--sdk-border-color, var(--ui-border));
  }
  .mc-detail-pane {
    min-width: 0;
    min-height: 0;
    overflow: auto;
  }
  .mc-detail {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    max-width: 960px;
    width: 100%;
    min-width: 0;
    padding: var(--spacing-lg);
    box-sizing: border-box;
  }
  .mc-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .mc-section-bordered {
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
    padding-top: var(--spacing-md);
  }
  .mc-section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .mc-section-title-group {
    display: flex;
    align-items: baseline;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .mc-section-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .mc-section-count {
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
    font-variant-numeric: tabular-nums;
  }
  .mc-section-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .mc-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-md);
    padding: var(--spacing-4xl) var(--spacing-lg);
    text-align: center;
    min-height: 280px;
  }
  .mc-empty-title {
    margin: 0;
    font-size: var(--text-base);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .mc-empty-hint {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .mc-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .mc-form-wrap .sdk-owner-form,
  .mc-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .mc-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .mc-model-name-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .mc-model-name-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .mc-model-name {
    font-weight: var(--font-medium);
    color: var(--sdk-text-color-primary);
    overflow-wrap: anywhere;
  }
  .mc-model-id {
    font-family: var(--font-mono, monospace);
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
    overflow-wrap: anywhere;
  }
  .mc-test-status {
    margin: 0;
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    border: 1px solid var(--sdk-border-color, var(--ui-border));
  }
  .mc-test-status.is-ok {
    color: var(--sdk-color-success-text, var(--sdk-text-color-primary));
    background: var(--sdk-color-success-light-9, transparent);
    border-color: var(--sdk-color-success-light-5, var(--ui-border));
  }
  .mc-test-status.is-error {
    color: var(--sdk-color-danger-text, var(--sdk-text-color-primary));
    background: var(--sdk-color-danger-light-9, transparent);
    border-color: var(--sdk-color-danger-light-5, var(--ui-border));
  }
  .mc-discover-box {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }
  .mc-discover-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: min(420px, 60vh);
    overflow-y: auto;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-sm);
  }
  .mc-discover-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: 1px solid var(--ui-divider);
  }
  .mc-discover-row:last-child {
    border-bottom: 0;
  }
  .mc-discover-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .mc-discover-name {
    font-family: var(--font-mono, monospace);
    font-size: var(--text-sm);
    color: var(--sdk-text-color-primary);
    word-break: break-all;
  }
  .mc-discover-id {
    font-family: var(--font-mono, monospace);
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
    word-break: break-all;
  }
  .mc-discover-added {
    flex: 0 0 auto;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .mc-discover-error {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }
  .mc-discover-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: var(--spacing-sm);
  }
  .mc-dialog-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .mc-muted {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  @container mc-page (max-width: 760px) {
    .mc-split {
      grid-template-columns: minmax(0, 1fr);
    }
    .mc-sidebar {
      border-inline-end: 0;
      border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    }
  }
</style>

<div id="app" v-cloak>
  <section class="mc-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
      :draft="connectionDraft"
    ></page-header>

    <div class="mc-body">
      <div class="mc-split">
        <aside class="mc-sidebar" :aria-label="t('connections.title')">
          <projection slot="connections">
            <template #toolbar-actions>
              <sdk-button
                icon="plus"
                :aria-label="t('connections.add')"
                :title="t('connections.add')"
                @click="openCreateConnection"
              ></sdk-button>
            </template>
          </projection>
        </aside>

        <div class="mc-detail-pane">
          <div v-if="selectedKey" class="mc-detail">
            <section class="mc-section">
              <div class="mc-section-head">
                <projection slot="connectionHeader"></projection>
                <div class="mc-section-actions">
                  <projection slot="deleteConnection" @done="onConnectionDeleted"></projection>
                </div>
              </div>
              <div class="mc-form-wrap">
                <projection slot="connectionForm" @saved="onConnectionSaved"></projection>
              </div>
            </section>

            <section class="mc-section mc-section-bordered">
              <div class="mc-section-head">
                <div class="mc-section-title-group">
                  <h3 class="mc-section-title">{{ t('models.title') }}</h3>
                  <span v-if="modelCount !== null" class="mc-section-count">{{ modelCount }}</span>
                </div>
                <div class="mc-section-actions">
                  <sdk-button size="small" icon="download" @click="openDiscover">{{ t('models.discover') }}</sdk-button>
                  <sdk-button size="small" icon="plus" @click="openAddModel()">{{ t('models.add') }}</sdk-button>
                </div>
              </div>
              <p
                v-if="testStatus"
                :class="['mc-test-status', testStatus.ok ? 'is-ok' : 'is-error']"
                role="status"
              >
                {{ testStatus.text }}
              </p>
              <projection
                slot="modelsList"
                :inline-action-error="false"
                @row-action="onModelRowAction"
                @row-action-result="onModelRowActionResult"
              >
                <template #cell-nameParts="{ value }">
                  <div class="mc-model-name-cell">
                    <span class="mc-model-name-line">
                      <span class="mc-model-name">{{ Array.isArray(value) ? value[0] : value }}</span>
                      <sdk-tag v-if="Array.isArray(value) && value[2]" size="small" type="success" disable-transitions>
                        {{ value[2] }}
                      </sdk-tag>
                    </span>
                    <span v-if="Array.isArray(value) && value[1]" class="mc-model-id">{{ value[1] }}</span>
                  </div>
                </template>
              </projection>
            </section>

            <section class="mc-section mc-section-bordered">
              <div class="mc-section-head">
                <h3 class="mc-section-title">{{ t('usages.title') }}</h3>
              </div>
              <projection slot="usagesList"></projection>
            </section>
          </div>

          <div v-else class="mc-empty">
            <p class="mc-empty-title">{{ t('connections.empty') }}</p>
            <p class="mc-empty-hint">{{ t('connections.emptyHint') }}</p>
            <sdk-button type="primary" icon="plus" @click="openCreateConnection">{{ t('connections.add') }}</sdk-button>
          </div>
        </div>
      </div>
    </div>

    <sdk-dialog
      v-model="createConnectionOpen"
      :title="t('connections.addTitle')"
      width="560px"
      append-to-body
      destroy-on-close
    >
      <div class="mc-form-wrap">
        <projection
          v-if="createConnectionOpen"
          slot="connectionCreateForm"
          @saved="onConnectionCreated"
          @cancel="createConnectionOpen = false"
        ></projection>
      </div>
    </sdk-dialog>

    <sdk-dialog
      v-model="modelDialogOpen"
      :title="modelDialogMode === 'edit' ? t('models.editTitle') : t('models.addTitle')"
      width="640px"
      append-to-body
      destroy-on-close
    >
      <div class="mc-form-wrap">
        <projection
          v-if="modelDialogOpen && modelDialogMode === 'edit' && editingModelKey"
          slot="editModelForm"
          @saved="onModelSaved"
          @discarded="closeModelDialog"
          @cancel="closeModelDialog"
        ></projection>
        <projection
          v-else-if="modelDialogOpen && modelDialogMode === 'create' && selectedKey"
          slot="createModelForm"
          @saved="onModelSaved"
          @discarded="closeModelDialog"
          @cancel="closeModelDialog"
        ></projection>
      </div>
    </sdk-dialog>

    <sdk-dialog
      v-model="discoverOpen"
      :title="t('discover.title', { name: selectedKey })"
      width="640px"
      append-to-body
      destroy-on-close
    >
      <div class="mc-discover-box">
        <div v-if="discoverError" class="mc-discover-error" role="alert">
          <sdk-alert type="error" :title="discoverError" :closable="false" show-icon></sdk-alert>
          <div class="mc-discover-actions">
            <sdk-button @click="runDiscover">{{ t('discover.retry') }}</sdk-button>
            <sdk-button type="primary" @click="addManuallyFromDiscover">{{ t('discover.manual') }}</sdk-button>
          </div>
        </div>
        <template v-else>
          <sdk-input
            v-model="discoverQuery"
            :prefix-icon="searchIcon"
            :placeholder="t('discover.search')"
            :aria-label="t('discover.search')"
            :disabled="discoverLoading"
            clearable
          ></sdk-input>
          <p v-if="discoverLoading" class="mc-muted">{{ t('discover.loading') }}</p>
          <ul v-else-if="filteredCandidates.length > 0" class="mc-discover-list">
            <li v-for="candidate in filteredCandidates" :key="candidate.id" class="mc-discover-row">
              <span class="mc-discover-text">
                <span class="mc-discover-name">{{ candidate.name ?? candidate.id }}</span>
                <span v-if="candidate.name && candidate.name !== candidate.id" class="mc-discover-id">{{ candidate.id }}</span>
              </span>
              <span v-if="existingModelSet.has(candidate.id)" class="mc-discover-added">
                {{ t('discover.added') }}
              </span>
              <sdk-button
                v-else
                size="small"
                icon="plus"
                :aria-label="t('discover.addNamed', { id: candidate.id })"
                :title="t('discover.addNamed', { id: candidate.id })"
                @click="pickDiscoveredModel(candidate.id)"
              ></sdk-button>
            </li>
          </ul>
          <p v-else class="mc-muted">
            {{ discoverCandidates.length === 0 ? t('discover.empty') : t('discover.noMatch') }}
          </p>
        </template>
      </div>
      <template #footer>
        <div class="mc-dialog-footer">
          <sdk-button v-if="!discoverError" text type="primary" @click="addManuallyFromDiscover">
            {{ t('discover.manual') }}
          </sdk-button>
          <sdk-button @click="discoverOpen = false">{{ t('discover.close') }}</sdk-button>
        </div>
      </template>
    </sdk-dialog>
  </section>
</div>
