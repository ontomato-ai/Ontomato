<style>
  [v-cloak] { display: none; }
  .da-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: da-page / inline-size;
  }
  .da-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    max-width: 960px;
    width: 100%;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
    min-width: 0;
  }
  .da-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .da-test-section {
    padding-top: var(--spacing-lg);
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
  }
  .da-section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-md);
  }
  .da-section-title-group {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
    flex: 1 1 240px;
  }
  .da-section-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .da-section-hint {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .da-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .da-form-wrap .sdk-owner-form,
  .da-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .da-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .da-test-action {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .da-source-card-footer {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .da-source-card-actions {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: var(--spacing-sm);
  }
  .da-routing-name {
    font-family: var(--font-mono);
    overflow-wrap: anywhere;
    color: var(--sdk-text-color-primary);
  }
  .da-routing-ends {
    color: var(--sdk-text-color-regular);
  }
  .da-routing-derived {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    white-space: nowrap;
  }
  .da-routing-muted {
    color: var(--sdk-text-color-secondary);
  }
  .da-cell-empty {
    display: inline-block;
  }
  .da-test-report {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    margin-top: var(--spacing-xs);
    min-width: 0;
  }
  .da-test-error-message {
    margin: var(--spacing-xs) 0 0;
    max-height: 320px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: var(--font-mono);
    font-size: var(--text-mono);
    user-select: text;
  }
</style>

<div id="app" v-cloak>
  <section class="da-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
      :draft="pageDraft"
    ></page-header>

    <div class="da-body">
      <section class="da-section">
        <div class="da-form-wrap">
          <projection slot="adapterForm" @saved="(_target, outcome) => onAdapterSaved(outcome)">
            <template #array-item-footer-dataSources="{ item, key, disabled }">
              <div class="da-source-card-footer">
                <div
                  class="da-source-card-actions"
                  @click.capture="onCardTestTrigger(item, key)"
                >
                  <projection
                    slot="testConnection"
                    :parameters="{ sourceId: sourceIdOf(item) }"
                    :show-result="false"
                    :disabled="disabled || !sourceIdOf(item)"
                    @read="(result) => onCardTestRead(item, key, result)"
                    @error="(error) => onCardTestError(item, key, error)"
                  ></projection>
                </div>
                <div v-if="cardTestOutcome(key)" class="da-test-report" role="status">
                  <sdk-alert
                    v-if="cardTestOutcome(key).error"
                    type="error"
                    :title="t('test.failed')"
                    :closable="false"
                    show-icon
                  >
                    <pre class="da-test-error-message">{{ testErrorMessage(cardTestOutcome(key).error) }}</pre>
                  </sdk-alert>
                  <operation-result
                    v-else-if="cardTestOutcome(key).result"
                    :result="cardTestOutcome(key).result"
                    layout="stack"
                  ></operation-result>
                </div>
              </div>
            </template>
          </projection>
        </div>
      </section>

      <section v-if="!isMultiMode" class="da-section da-test-section">
        <div class="da-section-head">
          <div class="da-section-title-group">
            <h2 class="da-section-title">{{ t('test.title') }}</h2>
            <p class="da-section-hint">{{ t('test.description') }}</p>
          </div>
        </div>
        <div class="da-test-action" @click.capture="onSingleTestTrigger">
          <projection
            slot="testConnection"
            :show-result="false"
            :disabled="singleTestDisabled"
            @read="onSingleTestRead"
            @error="onSingleTestError"
          ></projection>
          <div v-if="singleTestOutcome" class="da-test-report" role="status">
            <sdk-alert
              v-if="singleTestOutcome.error"
              type="error"
              :title="t('test.failed')"
              :closable="false"
              show-icon
            >
              <pre class="da-test-error-message">{{ testErrorMessage(singleTestOutcome.error) }}</pre>
            </sdk-alert>
            <operation-result
              v-else-if="singleTestOutcome.result"
              :result="singleTestOutcome.result"
              layout="stack"
            ></operation-result>
          </div>
        </div>
      </section>

      <section v-if="isMultiMode" class="da-section">
        <div class="da-form-wrap">
          <projection slot="routingForm" @saved="(_target, outcome) => onRoutingSaved(outcome)">
            <template #field-classRoutes.*.className="{ value }">
              <span class="da-routing-name">{{ value }}</span>
            </template>
            <template #field-relationshipRoutes.*.relationship="{ value }">
              <span class="da-routing-name">{{ value }}</span>
            </template>
            <template #field-relationshipRoutes.*.ends="{ value }">
              <span class="da-routing-ends">{{ value }}</span>
            </template>
            <template #field-relationshipRoutes.*.source="{ index }">
              <span class="da-routing-derived">
                <template v-if="relationshipRow(index)?.crossSource">
                  <sdk-tag type="warning" size="small">{{ t('routing.crossSource') }}</sdk-tag>
                  <span>{{ relationshipRow(index).fromSource }} → {{ relationshipRow(index).toSource }}</span>
                </template>
                <span v-else-if="relationshipRow(index)?.source">{{ relationshipRow(index).source }}</span>
                <span v-else class="da-routing-muted">{{ t('routing.unrouted') }}</span>
              </span>
            </template>
            <template #field-relationshipRoutes.*.realEdge="{ value, index, disabled, set }">
              <sdk-input
                v-if="relationshipRow(index)?.edgeEditable"
                :model-value="typeof value === 'string' ? value : ''"
                :disabled="disabled"
                :placeholder="relationshipRow(index)?.relationship || ''"
                :aria-label="t('routing.realEdge')"
                clearable
                @update:model-value="(next) => set(typeof next === 'string' ? next : '')"
              ></sdk-input>
              <span v-else class="da-cell-empty"></span>
            </template>
          </projection>
        </div>
      </section>

      <section class="da-section da-test-section">
        <div class="da-section-head">
          <div class="da-section-title-group">
            <h2 class="da-section-title">{{ t('sandbox.title') }}</h2>
            <p v-if="sandboxSupported" class="da-section-hint">{{ t('sandbox.probeNote') }}</p>
          </div>
          <projection
            v-if="configured && sandboxSupported"
            slot="checkSandboxPermission"
            :notify-success="false"
            @done="onSandboxChecked"
          ></projection>
        </div>
        <projection slot="sandboxCapability"></projection>
      </section>
    </div>
  </section>
</div>
