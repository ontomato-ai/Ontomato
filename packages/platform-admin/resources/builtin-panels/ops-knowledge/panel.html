<style>
  [v-cloak] { display: none; }
  .ops-knowledge-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: ops-knowledge-page / inline-size;
  }
  .ops-knowledge-body {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    box-sizing: border-box;
  }
  .ops-knowledge-layout {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--sdk-border-color, var(--ui-border));
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    overflow: hidden;
  }
  .ops-knowledge-aside {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-sm);
    box-sizing: border-box;
  }
  .ops-knowledge-doc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    min-width: 0;
    padding: var(--spacing-sm) var(--spacing-lg);
    border-bottom: 1px solid var(--ui-divider);
  }
  .ops-knowledge-doc-header-main {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ops-knowledge-doc-time {
    flex-shrink: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }
  .ops-knowledge-reader {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: var(--spacing-md) var(--spacing-lg) var(--spacing-xl);
    box-sizing: border-box;
  }
  .ops-knowledge-fill {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  @container ops-knowledge-page (max-width: 45rem) {
    .ops-knowledge-body {
      padding: var(--spacing-sm) var(--spacing-md) calc(var(--page-content-gap) + 56px);
    }
    .ops-knowledge-doc-header {
      flex-wrap: wrap;
      padding: var(--spacing-sm) var(--spacing-md);
    }
    .ops-knowledge-reader {
      padding: var(--spacing-md);
    }
  }
</style>

<div id="app" v-cloak class="ops-knowledge-page">
  <page-header :title="t('panel.title')">
    <template #actions>
      <sdk-button text :aria-label="t('panel.refresh')" @click="refresh">
        {{ t("panel.refresh") }}
      </sdk-button>
    </template>
  </page-header>

  <div class="ops-knowledge-body">
    <two-pane-layout
      class="ops-knowledge-layout"
      mode="split"
      :selected="Boolean(filePath)"
      :selection-key="filePath"
      :back-label="t('panel.back')"
      :empty-label="t('panel.selectHint')"
      @back="clearSelection"
    >
      <template #aside>
        <div class="ops-knowledge-aside">
          <projection slot="tree" class="ops-knowledge-fill"></projection>
        </div>
      </template>

      <template #header>
        <div v-if="filePath" class="ops-knowledge-doc-header">
          <div class="ops-knowledge-doc-header-main">
            <projection slot="docHeader"></projection>
          </div>
          <div class="ops-knowledge-doc-time">
            <projection slot="updatedAt"></projection>
          </div>
        </div>
      </template>

      <div class="ops-knowledge-reader">
        <projection slot="reader" class="ops-knowledge-fill"></projection>
      </div>

      <template #empty>
        <sdk-empty :description="t('panel.selectHint')"></sdk-empty>
      </template>
    </two-pane-layout>
  </div>
</div>
