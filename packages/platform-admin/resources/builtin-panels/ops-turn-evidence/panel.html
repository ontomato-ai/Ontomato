<style>
  [v-cloak] { display: none; }
  .ops-turn-page {
    --pane-list-width: 280px;
    display: flex;
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: ops-turn-page / inline-size;
  }
  .ops-turn-list-detail {
    display: flex;
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .ops-turn-aside {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: var(--pane-list-width);
    flex-shrink: 0;
    min-width: 0;
    min-height: 0;
    padding: 6px;
    border-inline-end: 1px solid var(--ui-divider);
    box-sizing: border-box;
    overflow: hidden;
  }
  .ops-turn-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    min-width: 0;
  }
  .ops-turn-search-icon {
    position: absolute;
    inset-inline-start: 10px;
    color: var(--sdk-text-color-secondary);
    pointer-events: none;
  }
  .ops-turn-search {
    width: 100%;
    height: var(--control-height-sm, 30px);
    padding: 0 10px 0 30px;
    border: 1px solid var(--sdk-border-color);
    border-radius: var(--radius-sm, 6px);
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-primary);
    font: inherit;
    font-size: var(--text-xs, 12px);
    box-sizing: border-box;
  }
  .ops-turn-search:focus {
    outline: none;
    border-color: var(--sdk-color-primary);
  }
  .ops-turn-search-error {
    margin: 0;
    padding: 4px 8px;
    border-radius: var(--radius-sm, 6px);
    background: var(--sdk-color-danger-light-9, var(--sdk-fill-color-light));
    color: var(--sdk-color-danger);
    font-size: var(--text-xs, 12px);
    line-height: var(--leading-xs, 16px);
  }
  .ops-turn-main {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .ops-turn-back {
    display: none;
    flex-shrink: 0;
    align-items: center;
    gap: 4px;
    height: var(--nav-row-height, 36px);
    padding: 0 12px;
    border: 0;
    border-bottom: 1px solid var(--ui-divider);
    background: transparent;
    color: var(--sdk-text-color-regular);
    font: inherit;
    font-size: var(--text-sm);
    cursor: pointer;
    text-align: start;
  }
  .ops-turn-back:hover {
    background: var(--sdk-fill-color-light);
    color: var(--sdk-text-color-primary);
  }
  .ops-turn-detail-scroll {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    padding: var(--surface-padding, 16px);
    box-sizing: border-box;
    font-size: var(--text-sm);
    line-height: var(--leading-sm);
    container: ops-turn-detail / inline-size;
  }
  .ops-turn-detail-stack {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .ops-turn-detail-actions {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--component-gap, 8px);
  }
  .ops-turn-gaps {
    padding: 4px 10px;
    border: 1px solid var(--sdk-color-warning-light-5, var(--ui-divider));
    border-radius: var(--radius-sm);
    background: var(--sdk-color-warning-light-9, var(--sdk-fill-color-lighter));
    min-width: 0;
  }
  .ops-turn-references {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ops-turn-raw {
    margin-top: var(--spacing-xs);
    min-width: 0;
  }
  .ops-turn-raw summary {
    cursor: pointer;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    user-select: none;
  }
  .ops-turn-raw-content {
    margin-top: var(--spacing-xs);
    padding: var(--spacing-md);
    border: 1px solid var(--ui-divider);
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-light);
    overflow: auto;
  }
  .ops-turn-files {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) minmax(0, 4fr);
    gap: 12px;
    min-height: 250px;
    min-width: 0;
    align-items: start;
  }
  .ops-turn-file-tree,
  .ops-turn-file-viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .ops-turn-empty {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-xl);
    text-align: center;
  }
  .ops-turn-empty-hint {
    margin: 0;
    max-width: 26rem;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: var(--leading-sm);
  }
  .ops-turn-fill {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  @container ops-turn-page (max-width: 720px) {
    .ops-turn-aside {
      width: 100%;
      border-inline-end: 0;
    }
    .ops-turn-list-detail.is-selected .ops-turn-aside,
    .ops-turn-list-detail:not(.is-selected) .ops-turn-main {
      display: none;
    }
    .ops-turn-back {
      display: flex;
    }
  }
  @container ops-turn-detail (max-width: 700px) {
    .ops-turn-files {
      display: flex;
      flex-direction: column;
    }
  }
</style>

<div id="app" v-cloak class="ops-turn-page">
  <div class="ops-turn-list-detail" :class="{ 'is-selected': Boolean(selectedKey) }">
    <aside class="ops-turn-aside">
      <div class="ops-turn-search-wrap">
        <svg class="ops-turn-search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          type="search"
          class="ops-turn-search"
          :value="searchText"
          :placeholder="t('panel.searchPlaceholder')"
          :aria-label="t('panel.searchPlaceholder')"
          @input="onSearchInput"
          @keydown.enter.prevent="submitSearch"
        />
      </div>
      <p v-if="searchError" class="ops-turn-search-error" role="alert">{{ searchError }}</p>
      <projection
        slot="turns"
        class="ops-turn-fill"
        @operation-done="onTurnRowOperationDone"
      ></projection>
    </aside>

    <section class="ops-turn-main">
      <button v-if="selectedKey" type="button" class="ops-turn-back" @click="clearSelection">
        <span aria-hidden="true">←</span>
        <span>{{ t("panel.back") }}</span>
      </button>

      <div v-if="selectedKey" class="ops-turn-detail-scroll shell-dock-room">
        <div class="ops-turn-detail-stack">
          <projection slot="detailHeader" :fallback-title="selectedKey">
            <template #actions>
              <div class="ops-turn-detail-actions">
                <projection slot="diagnose" :disabled="hasEvidence !== true"></projection>
                <projection slot="keepTurn"></projection>
                <projection slot="unkeepTurn"></projection>
                <projection slot="refreshTurn"></projection>
                <projection slot="downloadTurn"></projection>
                <projection slot="deleteTurn" @done="onDeleteDone"></projection>
              </div>
            </template>
          </projection>

          <info-banner v-if="isCollecting" compact tone="info" :text="t('panel.collectingHint')">
            <template #actions>
              <sdk-button size="small" @click="refresh">{{ t("panel.refresh") }}</sdk-button>
            </template>
          </info-banner>

          <projection v-if="!isCollecting" slot="evidenceBanner"></projection>

          <div v-if="!isCollecting" v-show="showGaps" class="ops-turn-gaps">
            <projection slot="evidenceGaps"></projection>
          </div>

          <div v-if="!isCollecting" v-show="hasEvidence !== false" class="ops-turn-references">
            <projection slot="evidenceRuns"></projection>
            <details v-if="hasEvidence === true" class="ops-turn-raw">
              <summary>{{ t("panel.rawReferences") }}</summary>
              <div class="ops-turn-raw-content">
                <projection slot="evidenceJson"></projection>
              </div>
            </details>
          </div>

          <div v-if="!isCollecting" class="ops-turn-files">
            <div class="ops-turn-file-tree">
              <projection slot="fileTree" class="ops-turn-fill"></projection>
            </div>
            <div v-show="Boolean(filePath)" class="ops-turn-file-viewer">
              <projection slot="fileViewer" class="ops-turn-fill"></projection>
            </div>
          </div>
        </div>
      </div>

      <div v-else class="ops-turn-empty">
        <sdk-empty :description="t('panel.selectHint')"></sdk-empty>
        <p class="ops-turn-empty-hint">{{ t("panel.selectSubhint") }}</p>
      </div>
    </section>
  </div>
</div>
