<style>
  [v-cloak] { display: none; }
  .ops-results-page {
    --pane-list-width: 280px;
    display: flex;
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: ops-results-page / inline-size;
  }
  .ops-results-list-detail {
    display: flex;
    flex: 1 1 auto;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .ops-results-aside {
    display: flex;
    flex-direction: column;
    width: var(--pane-list-width);
    flex-shrink: 0;
    min-width: 0;
    min-height: 0;
    padding: 6px;
    border-inline-end: 1px solid var(--ui-divider);
    box-sizing: border-box;
    overflow: hidden;
  }
  .ops-results-main {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .ops-results-back {
    display: none;
    flex-shrink: 0;
    align-items: center;
    gap: 4px;
    height: var(--nav-row-height, 36px);
    padding: 0 12px;
    border: 0;
    border-bottom: 1px solid var(--ui-divider);
    background: transparent;
    color: var(--sdk-text-color-regular);
    font: inherit;
    font-size: var(--text-sm);
    cursor: pointer;
    text-align: start;
  }
  .ops-results-back:hover {
    background: var(--sdk-fill-color-light);
    color: var(--sdk-text-color-primary);
  }
  .ops-results-detail-header {
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--ui-divider);
    min-width: 0;
  }
  .ops-results-header-left {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .ops-results-run-id {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--sdk-text-color-primary);
    overflow-wrap: anywhere;
  }
  .ops-results-header-summary {
    color: var(--sdk-text-color-secondary);
    font-size: 12px;
    min-width: 0;
  }
  .ops-results-header-actions {
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .ops-results-banner-wrap {
    flex-shrink: 0;
    padding: 8px 16px 0;
  }
  .ops-results-filter-bar {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    padding: 8px 16px;
  }
  .ops-results-table-wrap {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: 0 16px calc(16px + var(--pane-dock-space, 0px));
    box-sizing: border-box;
    overflow: hidden;
  }
  .ops-results-empty {
    display: flex;
    flex: 1 1 auto;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-xl);
  }
  .ops-results-fill {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  @container ops-results-page (max-width: 720px) {
    .ops-results-aside {
      width: 100%;
      border-inline-end: 0;
    }
    .ops-results-list-detail.is-selected .ops-results-aside,
    .ops-results-list-detail:not(.is-selected) .ops-results-main {
      display: none;
    }
    .ops-results-back {
      display: flex;
    }
    .ops-results-detail-header {
      padding: 8px 12px;
    }
    .ops-results-filter-bar {
      padding: 8px 12px;
    }
    .ops-results-table-wrap {
      padding: 0 12px calc(12px + var(--pane-dock-space, 0px));
    }
  }
</style>

<div id="app" v-cloak class="ops-results-page">
  <div class="ops-results-list-detail" :class="{ 'is-selected': Boolean(selectedKey) }">
    <aside class="ops-results-aside">
      <projection
        slot="runs"
        class="ops-results-fill"
        @operation-done="onRunRowOperationDone"
      ></projection>
    </aside>

    <section class="ops-results-main">
      <button v-if="selectedKey" type="button" class="ops-results-back" @click="clearSelection">
        <span aria-hidden="true">←</span>
        <span>{{ t("panel.back") }}</span>
      </button>

      <template v-if="selectedKey">
        <div class="ops-results-detail-header">
          <div class="ops-results-header-left">
            <span class="ops-results-run-id">{{ selectedKey }}</span>
            <projection slot="runStatus"></projection>
            <div class="ops-results-header-summary">
              <projection slot="runSummary"></projection>
            </div>
          </div>
          <div class="ops-results-header-actions">
            <projection slot="keepRun" @done="onKeepDone"></projection>
            <projection slot="unkeepRun" @done="onUnkeepDone"></projection>
            <projection slot="downloadRun"></projection>
            <projection slot="deleteRun" @done="onDeleteDone"></projection>
          </div>
        </div>

        <div v-if="runActive" class="ops-results-banner-wrap">
          <info-banner compact tone="info" :text="t('detail.activeNotice')">
            <template #actions>
              <sdk-button size="small" @click="refresh">{{ t("panel.refresh") }}</sdk-button>
            </template>
          </info-banner>
        </div>

        <div class="ops-results-filter-bar">
          <segmented-control
            state="verdict"
            default-value="all"
            :options="verdictOptions"
            :aria-label="t('filter.verdict')"
          ></segmented-control>
        </div>

        <div class="ops-results-table-wrap">
          <projection
            slot="results"
            class="ops-results-fill"
            @choose="openCaseArtifact"
          ></projection>
        </div>
      </template>

      <div v-else class="ops-results-empty">
        <sdk-empty :description="t('panel.selectHint')"></sdk-empty>
      </div>
    </section>
  </div>
</div>
