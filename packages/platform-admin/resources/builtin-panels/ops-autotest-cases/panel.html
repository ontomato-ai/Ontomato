<style>
  [v-cloak] { display: none; }
  .ops-cases-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: ops-cases-page / inline-size;
  }
  .ops-cases-page-actions {
    display: inline-flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ops-cases-body {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: var(--spacing-md) var(--page-gutter);
    box-sizing: border-box;
  }
  .ops-cases-layout {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  .ops-cases-aside {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .ops-cases-fill {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
  }
  .ops-cases-detail-header {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ops-cases-detail-top {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .ops-cases-detail-title {
    flex: 1 1 auto;
    min-width: 0;
  }
  .ops-cases-detail-controls {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ops-cases-detail-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .ops-cases-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .ops-cases-form-wrap .sdk-owner-form,
  .ops-cases-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .ops-cases-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .ops-cases-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
    max-width: 26rem;
    text-align: center;
  }
  .ops-cases-empty-hint {
    margin: 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
    line-height: var(--leading-sm);
  }
  .ops-cases-import-form {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .ops-cases-import-field {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .ops-cases-import-label {
    font-size: var(--text-xs);
    font-weight: var(--font-medium);
    color: var(--sdk-text-color-primary);
  }
  .ops-cases-file-row {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ops-cases-file-input {
    display: none;
  }
  .ops-cases-file-name {
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
    word-break: break-all;
  }
  .ops-cases-footer {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    padding: var(--spacing-sm) var(--page-gutter);
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
    background: var(--sdk-bg-color);
  }
  .ops-cases-footer-left {
    font-size: var(--text-xs);
    line-height: var(--leading-sm);
  }
  .ops-cases-status-unsaved {
    color: var(--sdk-color-warning);
    font-weight: var(--font-medium);
  }
  .ops-cases-status-saved {
    color: var(--sdk-text-color-placeholder, var(--sdk-text-color-secondary));
  }
  .ops-cases-footer-right {
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .ops-cases-dock-room {
    flex: none;
    width: 100%;
    height: var(--pane-dock-space, 0px);
  }
  .ops-cases-import-code {
    width: 100%;
    max-height: 360px;
  }
  .ops-cases-import-footer {
    display: flex;
    flex: 0 0 auto;
    justify-content: flex-end;
    gap: var(--spacing-sm);
  }
  @container ops-cases-page (max-width: 45rem) {
    .ops-cases-body {
      padding: var(--spacing-sm) var(--spacing-md);
    }
    .ops-cases-footer {
      padding: var(--spacing-sm) var(--spacing-md);
    }
  }
</style>

<div id="app" v-cloak>
  <div ref="panelRootRef" class="ops-cases-page">
  <page-header :title="t('panel.title')">
    <template #actions>
      <div class="ops-cases-page-actions">
        <projection slot="createCaseSet" @done="onCreateDone"></projection>
        <sdk-button @click="openImport">{{ t("panel.import") }}</sdk-button>
        <sdk-button text :aria-label="t('panel.refresh')" @click="refresh">
          {{ t("panel.refresh") }}
        </sdk-button>
      </div>
    </template>
  </page-header>

  <div class="ops-cases-body">
    <two-pane-layout
      class="ops-cases-layout"
      mode="split"
      :selected="Boolean(selectedKey)"
      :selection-key="selectedKey"
      :back-label="t('panel.back')"
      :empty-label="t('panel.selectHint')"
      @back="clearSelection"
    >
      <template #aside>
        <div ref="caseSetListRef" class="ops-cases-aside">
          <projection slot="caseSets" class="ops-cases-fill"></projection>
        </div>
      </template>

      <template #header>
        <div v-if="selectedKey" class="ops-cases-detail-header">
          <div class="ops-cases-detail-top">
            <div class="ops-cases-detail-title">
              <projection slot="detailHeader" :fallback-title="selectedKey"></projection>
            </div>
            <div class="ops-cases-detail-controls">
              <segmented-control
                state="editMode"
                default-value="form"
                :options="editModeOptions"
                :aria-label="t('detail.editModeAria')"
              ></segmented-control>
              <projection slot="deleteCaseSet" @done="onDeleteDone"></projection>
            </div>
          </div>
        </div>
      </template>

      <div v-if="selectedKey" class="ops-cases-detail-body">
        <div class="ops-cases-form-wrap">
          <projection
            slot="caseSetForm"
            @saved="onCaseSetSaved"
          ></projection>
        </div>
      </div>

      <template #empty>
        <div class="ops-cases-empty">
          <sdk-empty :description="t('panel.selectHint')"></sdk-empty>
          <p class="ops-cases-empty-hint">{{ t("panel.selectSubhint") }}</p>
        </div>
      </template>
    </two-pane-layout>
  </div>

  <footer v-if="selectedKey" class="ops-cases-footer" role="region" :aria-label="t('footer.aria')">
    <div class="ops-cases-footer-left" role="status" aria-live="polite">
      <span v-if="draftDirty" class="ops-cases-status-unsaved">
        ● {{ t("footer.unsaved") }}
      </span>
      <span v-else class="ops-cases-status-saved">
        {{ t("footer.saved") }}
      </span>
    </div>
    <div class="ops-cases-footer-right">
      <sdk-button :disabled="!draftDirty || draftSaving" @click="revertDraft">
        {{ t("footer.revert") }}
      </sdk-button>
      <sdk-button
        type="primary"
        :loading="draftSaving"
        :disabled="!draftCanSave || draftSaving"
        @click="saveDraft"
      >
        {{ t("footer.save") }}
      </sdk-button>
    </div>
  </footer>
  <div class="ops-cases-dock-room" aria-hidden="true"></div>

  <sdk-dialog
    v-model="importOpen"
    :title="t('import.title')"
    width="560px"
    append-to-body
    destroy-on-close
  >
    <div class="ops-cases-import-form">
      <div class="ops-cases-import-field">
        <label class="ops-cases-import-label">{{ t("import.name") }}</label>
        <sdk-input
          v-model="importName"
          :placeholder="t('import.namePlaceholder')"
        ></sdk-input>
      </div>

      <div class="ops-cases-import-field">
        <label class="ops-cases-import-label">{{ t("import.format") }}</label>
        <sdk-select v-model="importFormat">
          <sdk-option value="auto" :label="t('import.formatAuto')"></sdk-option>
          <sdk-option value="json" :label="t('import.formatJson')"></sdk-option>
          <sdk-option value="csv" :label="t('import.formatCsv')"></sdk-option>
        </sdk-select>
      </div>

      <div class="ops-cases-import-field">
        <label class="ops-cases-import-label">{{ t("import.file") }}</label>
        <div class="ops-cases-file-row">
          <input
            ref="importFileInput"
            type="file"
            class="ops-cases-file-input"
            accept=".json,.csv,application/json,text/csv"
            @change="onImportFileChange"
          />
          <sdk-button size="small" @click="triggerImportFilePicker">
            {{ t("import.chooseFile") }}
          </sdk-button>
          <span v-if="importFileName" class="ops-cases-file-name">{{ importFileName }}</span>
          <sdk-button v-if="importFileName" size="small" text @click="clearImportFile">
            {{ t("import.clearFile") }}
          </sdk-button>
        </div>
      </div>

      <div class="ops-cases-import-field">
        <label class="ops-cases-import-label">{{ t("import.content") }}</label>
        <code-editor
          v-model="importContent"
          class="ops-cases-import-code"
          :language="importEditorLanguage"
          :min-height="220"
          :placeholder="t('import.contentPlaceholder')"
        ></code-editor>
      </div>

      <sdk-alert
        v-if="importError"
        type="error"
        :closable="false"
        :title="importError"
      ></sdk-alert>
    </div>

    <template #footer>
      <div class="ops-cases-import-footer">
        <sdk-button :disabled="importBusy" @click="closeImport">{{ t("import.cancel") }}</sdk-button>
        <sdk-button
          type="primary"
          :loading="importBusy"
          :disabled="!canSubmitImport"
          @click="submitImport"
        >
          {{ t("import.submit") }}
        </sdk-button>
      </div>
    </template>
  </sdk-dialog>
  </div>
</div>
