<style>
  [v-cloak] { display: none; }
  .gs-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: gs-page / inline-size;
  }
  .gs-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    width: min(100%, 800px);
    margin-inline: auto;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
    min-width: 0;
  }
  .gs-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .gs-form-wrap .sdk-owner-form,
  .gs-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .gs-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
</style>

<div id="app" v-cloak>
  <section class="gs-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
      :draft="generalDraft"
    ></page-header>

    <div class="gs-body">
      <div class="gs-form-wrap">
        <projection slot="generalForm" @saved="onSettingsSaved"></projection>
      </div>
    </div>
  </section>
</div>
