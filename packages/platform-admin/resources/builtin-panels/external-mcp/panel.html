<style>
  [v-cloak] { display: none; }
  .em-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: em-page / inline-size;
  }
  .em-body {
    display: flex;
    flex-direction: column;
    gap: var(--page-content-gap, var(--spacing-md));
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    min-width: 0;
  }
  .em-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .em-form-wrap .sdk-owner-form,
  .em-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .em-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .em-drawer-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    min-width: 0;
  }
  .em-drawer-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .em-drawer-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .em-section-title {
    margin: 0;
    font-size: var(--text-base, var(--text-sm));
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .em-count {
    margin-inline-start: var(--spacing-xs);
    font-size: var(--text-xs);
    font-weight: var(--font-regular, 400);
    color: var(--sdk-text-color-secondary);
  }
  .em-schema-details {
    min-width: 0;
  }
  .em-schema-details summary {
    cursor: pointer;
    font-size: var(--text-xs);
    color: var(--sdk-color-primary);
  }
  .em-schema-code {
    margin: var(--spacing-xs) 0 0;
    padding: var(--spacing-sm);
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-light);
    font-family: var(--font-mono, monospace);
    font-size: var(--text-xs);
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 240px;
    overflow-y: auto;
  }
  .em-muted {
    color: var(--sdk-text-color-secondary);
  }
  .em-drawer-footer {
    display: flex;
    justify-content: flex-end;
    gap: var(--spacing-sm);
  }
</style>

<div id="app" v-cloak>
  <section class="em-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
    >
      <template #actions>
        <sdk-button @click="refresh">{{ t('action.refresh') }}</sdk-button>
        <sdk-button type="primary" @click="openCreate">{{ t('action.addService') }}</sdk-button>
      </template>
    </page-header>

    <div class="em-body">
      <projection
        slot="services"
        @row-action="onRowAction"
        @operation-done="onServiceOperationDone"
      ></projection>
    </div>

    <sdk-dialog
      v-model="createOpen"
      :title="t('dialog.addTitle')"
      width="600px"
      :close-on-click-modal="false"
      append-to-body
      destroy-on-close
    >
      <div class="em-form-wrap">
        <projection
          v-if="createOpen"
          slot="createForm"
          @saved="onCreated"
          @cancel="createOpen = false"
          @discarded="createOpen = false"
        ></projection>
      </div>
    </sdk-dialog>

    <sdk-dialog
      v-model="editOpen"
      :title="t('dialog.editTitle')"
      width="600px"
      :close-on-click-modal="false"
      append-to-body
      destroy-on-close
    >
      <div class="em-form-wrap">
        <projection
          v-if="editOpen && editingKey"
          slot="editForm"
          @saved="onEdited"
          @cancel="closeEdit"
          @discarded="closeEdit"
        ></projection>
      </div>
    </sdk-dialog>

    <sdk-drawer
      v-model="inspectOpen"
      :title="t('drawer.title')"
      size="640px"
      append-to-body
      destroy-on-close
    >
      <div v-if="inspectOpen && inspectedKey" class="em-drawer-body">
        <section class="em-drawer-section">
          <projection slot="inspectedSummary"></projection>
        </section>

        <section class="em-drawer-section">
          <div class="em-drawer-head">
            <h3 class="em-section-title">
              {{ t('tools.title') }}
              <span v-if="inspectedToolTotal !== null" class="em-count">({{ inspectedToolTotal }})</span>
            </h3>
            <sdk-button size="small" @click="recheck">{{ t('action.recheck') }}</sdk-button>
          </div>
          <projection slot="inspectedTools">
            <template #cell-inputSchema="{ displayText }">
              <details v-if="displayText" class="em-schema-details">
                <summary>{{ t('tools.viewSchema') }}</summary>
                <pre class="em-schema-code">{{ displayText }}</pre>
              </details>
              <span v-else class="em-muted">—</span>
            </template>
          </projection>
        </section>
      </div>
      <template #footer>
        <div class="em-drawer-footer">
          <sdk-button @click="closeInspect">{{ t('action.close') }}</sdk-button>
        </div>
      </template>
    </sdk-drawer>
  </section>
</div>
