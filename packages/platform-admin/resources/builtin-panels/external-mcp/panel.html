<style>
  [v-cloak] { display: none; }
  .em-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: em-page / inline-size;
  }
  .em-body {
    display: flex;
    flex-direction: column;
    gap: var(--page-content-gap, var(--spacing-md));
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    min-width: 0;
  }
  .em-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .em-form-wrap .sdk-owner-form,
  .em-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .em-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .em-discovered-card {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-border-color-light);
    border-radius: var(--radius-md);
    background: var(--sdk-bg-color);
    min-width: 0;
  }
  .em-discovered-card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .em-discovered-card-summary {
    flex: 1 1 auto;
    min-width: 0;
  }
  .em-discovered-card-summary .sdk-object-summary {
    padding: 0;
  }
  .em-discovered-card-summary .sdk-object-summary-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .em-discovered-card-summary .sdk-object-summary-list:empty {
    display: none;
  }
  .em-discovered-card-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    flex-shrink: 0;
  }
  .em-discovered-card-error {
    margin: 0;
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius-sm);
    background: var(--sdk-color-danger-light-9);
    color: var(--sdk-color-danger);
    font-size: var(--text-sm);
  }
  .em-discovered-card-tools {
    min-width: 0;
  }
</style>

<div id="app" v-cloak>
  <section class="em-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
    >
      <template #actions>
        <sdk-button icon="refresh-cw" :loading="refreshing" @click="refresh">{{ t('action.refresh') }}</sdk-button>
        <sdk-button type="primary" icon="plus" @click="openCreate">{{ t('action.addService') }}</sdk-button>
      </template>
    </page-header>

    <div class="em-body">
      <projection
        slot="services"
        @row-action="onRowAction"
        @operation-done="onServiceOperationDone"
      >
        <template #row-detail="{ ref: rowRef, operationResults, collapse }">
          <div class="em-discovered-card">
            <div class="em-discovered-card-head">
              <div class="em-discovered-card-summary">
                <projection slot="inspectedSummary" :inputs="{ target: rowRef }"></projection>
              </div>
              <div class="em-discovered-card-actions">
                <row-slot-runner v-slot="{ runOperation }">
                  <sdk-button
                    size="small"
                    icon="refresh-cw"
                    :loading="Boolean(operationResults?.check?.running)"
                    @click="runOperation('check')"
                  >{{ t('action.recheck') }}</sdk-button>
                </row-slot-runner>
                <sdk-button
                  size="small"
                  icon="x"
                  @click="collapse"
                >{{ t('action.close') }}</sdk-button>
              </div>
            </div>
            <p v-if="checkErrorText(operationResults?.check)" class="em-discovered-card-error" role="alert">
              {{ checkErrorText(operationResults?.check) }}
            </p>
            <div v-else class="em-discovered-card-tools">
              <projection
                :key="toolsRenderKey(rowRef, operationResults?.check)"
                slot="inspectedTools"
                :inputs="{ target: rowRef }"
              ></projection>
            </div>
          </div>
        </template>
      </projection>
    </div>

    <sdk-dialog
      v-model="createOpen"
      :title="t('dialog.addTitle')"
      width="600px"
      :close-on-click-modal="false"
      append-to-body
      destroy-on-close
    >
      <div class="em-form-wrap">
        <projection
          v-if="createOpen"
          slot="createForm"
          @saved="onCreated"
          @cancel="createOpen = false"
          @discarded="createOpen = false"
        ></projection>
      </div>
    </sdk-dialog>

    <sdk-dialog
      v-model="editOpen"
      :title="t('dialog.editTitle')"
      width="600px"
      :close-on-click-modal="false"
      append-to-body
      destroy-on-close
    >
      <div class="em-form-wrap">
        <projection
          v-if="editOpen && editingKey"
          slot="editForm"
          @saved="onEdited"
          @cancel="closeEdit"
          @discarded="closeEdit"
        ></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
