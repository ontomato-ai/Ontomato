<style>
  [v-cloak] { display: none; }
  .mu-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: mu-page / inline-size;
  }
  .mu-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xl);
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: var(--spacing-lg) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
    min-width: 0;
  }
  .mu-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .mu-form-wrap .sdk-owner-form,
  .mu-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .mu-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  .mu-vector-section {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding-top: var(--spacing-md);
    border-top: 1px solid var(--sdk-border-color, var(--ui-border));
    min-width: 0;
  }
  .mu-vector-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .mu-vector-state {
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .mu-vector-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
</style>

<div id="app" v-cloak>
  <section class="mu-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
      :draft="usageDraft"
    ></page-header>

    <div class="mu-body">
      <div class="mu-form-wrap">
        <projection slot="usageForm" @saved="onUsageSaved"></projection>
      </div>

      <section v-show="vectorConfigured" class="mu-vector-section" :aria-label="t('vector.title')">
        <div v-show="showVectorBanner">
          <projection slot="vectorStatus"></projection>
        </div>
        <div class="mu-vector-row">
          <span v-if="vectorStateLabel" class="mu-vector-state">{{ vectorStateLabel }}</span>
          <div class="mu-vector-actions">
            <projection
              v-if="rebuildAlive"
              slot="pauseVectorRebuild"
              size="small"
              :disabled="!canPause"
              :label="t('vector.pause')"
              @done="onRebuildPaused"
            ></projection>
            <projection
              v-else-if="canRebuild || canResume"
              slot="rebuildVectors"
              size="small"
              :label="canResume ? t('vector.resume') : t('vector.rebuild')"
              @done="onRebuildStarted"
            ></projection>
          </div>
        </div>
      </section>
    </div>
  </section>
</div>
