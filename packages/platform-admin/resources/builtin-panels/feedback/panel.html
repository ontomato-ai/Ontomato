<style>
  [v-cloak] { display: none; }
  .feedback {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-height: 0;
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    container-type: inline-size;
  }
  .feedback-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .feedback-filter-source {
    width: 140px;
  }
  .feedback-filter-rating {
    width: 120px;
  }
  .feedback-filter-keyword {
    width: 280px;
    max-width: 100%;
  }
  .feedback-toolbar-actions {
    margin-inline-start: auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .feedback-error {
    margin: 0;
    color: var(--sdk-color-danger-text);
    font-size: var(--text-sm);
  }
  .feedback-table-wrap {
    min-width: 0;
    min-height: 0;
  }
  .feedback-dialog-detail {
    min-width: 0;
  }
</style>

<div id="app" v-cloak>
  <page-header :title="t('panel.name')"></page-header>
  <section class="feedback">
    <div class="feedback-toolbar">
      <sdk-select
        v-model="draftSourceType"
        clearable
        :placeholder="t('panel.filterSource')"
        class="feedback-filter-source"
      >
        <sdk-option value="qa" :label="t('panel.source.qa')"></sdk-option>
        <sdk-option value="analysis_task" :label="t('panel.source.analysis_task')"></sdk-option>
      </sdk-select>
      <sdk-select
        v-model="draftRating"
        clearable
        :placeholder="t('panel.filterRating')"
        class="feedback-filter-rating"
      >
        <sdk-option value="like" :label="t('panel.rating.like')"></sdk-option>
        <sdk-option value="dislike" :label="t('panel.rating.dislike')"></sdk-option>
      </sdk-select>
      <sdk-input
        v-model="draftSearch"
        clearable
        :placeholder="t('panel.searchPlaceholder')"
        class="feedback-filter-keyword"
        @keyup.enter="applyFilters"
      ></sdk-input>
      <sdk-button type="primary" icon="search" @click="applyFilters">
        {{ t("panel.query") }}
      </sdk-button>
      <div class="feedback-toolbar-actions">
        <sdk-button icon="refresh-cw" :loading="listLoading" :disabled="listLoading" @click="refresh">
          {{ t("panel.refresh") }}
        </sdk-button>
        <sdk-button icon="download" :loading="exporting" :disabled="exporting" @click="runExport">
          {{ exporting ? t("panel.exporting") : t("panel.export") }}
        </sdk-button>
      </div>
    </div>

    <p v-if="exportError" class="feedback-error" role="alert">
      {{ t("panel.exportFailed") }}: {{ exportError }}
    </p>

    <div class="feedback-table-wrap">
      <projection slot="list" @row-action="onRowAction"></projection>
    </div>
  </section>

  <sdk-dialog
    :model-value="detailVisible"
    :title="t('panel.detailTitle')"
    width="min(760px, calc(100vw - 32px))"
    append-to-body
    destroy-on-close
    @update:model-value="onDetailToggle"
  >
    <div v-if="selected" class="feedback-dialog-detail">
      <projection slot="detail"></projection>
    </div>
  </sdk-dialog>
</div>
