<style>
  [v-cloak] { display: none; }
  .pm-page {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    background: var(--sdk-bg-color);
    container: pm-page / inline-size;
  }
  .pm-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    min-width: 0;
  }
  .pm-services {
    width: 100%;
    min-width: 0;
  }
  .pm-services .sdk-object-list-cards {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--spacing-md);
  }
  .pm-services .sdk-object-list-card {
    padding: var(--page-section-padding, var(--spacing-lg));
    cursor: default;
  }
  .pm-services .sdk-object-list-card:hover {
    background: var(--sdk-bg-color);
  }
  .pm-card-content {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .pm-tools-details {
    margin-top: var(--spacing-xs);
    min-width: 0;
  }
  .pm-tools-summary {
    cursor: pointer;
    font-size: var(--text-sm);
    font-weight: var(--font-medium, 500);
    color: var(--sdk-text-color-primary);
    user-select: none;
  }
  .pm-tools-body {
    margin-top: var(--spacing-sm);
    min-width: 0;
  }
</style>

<div id="app" v-cloak>
  <section class="pm-page">
    <page-header
      :title="t('panel.name')"
      :description="t('panel.description')"
    >
      <template #actions>
        <sdk-button icon="refresh-cw" :loading="refreshing" @click="refresh">{{ t('action.refresh') }}</sdk-button>
      </template>
    </page-header>

    <div class="pm-body">
      <projection slot="services" class="pm-services">
        <template #card="{ ref: serviceRef }">
          <div class="pm-card-content">
            <projection slot="serviceSummary" :inputs="{ target: serviceRef }"></projection>

            <details
              class="pm-tools-details"
              :open="Boolean(expandedCards[serviceRef.primaryKey])"
              @toggle="onToolsToggle(serviceRef.primaryKey, $event)"
            >
              <summary class="pm-tools-summary">{{ t('tools.title') }}</summary>
              <div v-if="expandedCards[serviceRef.primaryKey]" class="pm-tools-body">
                <projection slot="serviceTools" :inputs="{ target: serviceRef }"></projection>
              </div>
            </details>
          </div>
        </template>
      </projection>
    </div>
  </section>
</div>
