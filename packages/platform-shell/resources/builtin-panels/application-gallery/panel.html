<style>
  [v-cloak] { display: none; }
  .gallery-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container: gallery-page / inline-size;
  }
  .gallery-body {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    padding: var(--page-content-gap, 24px) var(--page-gutter, 24px) calc(var(--spacing-xl, 32px) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
  }
  .gallery-content {
    display: flex;
    flex-direction: column;
    gap: var(--page-content-gap, 24px);
    width: min(100%, 1200px);
    margin-inline: auto;
  }
  .gallery-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    flex-wrap: wrap;
  }
  .gallery-segments {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-xs);
    box-sizing: border-box;
    max-inline-size: 100%;
    padding: var(--spacing-xs);
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-light);
  }
  .gallery-segment {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-xs);
    min-height: var(--control-height-sm, 28px);
    padding: var(--spacing-xs) var(--spacing-md);
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--sdk-text-color-secondary);
    font: inherit;
    font-size: var(--text-sm);
    font-weight: var(--font-medium);
    cursor: pointer;
    transition: background-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .gallery-segment:hover {
    color: var(--sdk-text-color-primary);
  }
  .gallery-segment.is-active {
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-primary);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .gallery-segment:focus-visible {
    outline: 2px solid var(--sdk-color-primary);
    outline-offset: -2px;
  }
  .gallery-search {
    width: 280px;
    max-width: 100%;
  }
  .gallery-search-icon {
    color: var(--sdk-text-color-secondary);
    flex-shrink: 0;
  }
  .gallery-list {
    height: auto;
  }
  .gallery-app-icon {
    display: inline-flex;
    align-items: center;
    color: var(--sdk-color-primary);
    margin-top: 3px;
  }
  .gallery-list .sdk-object-list-diagnostics {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    margin: 0 0 var(--spacing-md);
    padding: var(--spacing-sm) var(--spacing-md);
    border: 1px solid color-mix(in srgb, var(--sdk-color-warning), var(--sdk-bg-color) 70%);
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--sdk-color-warning), var(--sdk-bg-color) 90%);
    color: var(--sdk-color-warning);
    font-size: var(--text-sm);
    line-height: 1.5;
  }
  .gallery-empty {
    display: grid;
    justify-items: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-3xl) var(--spacing-lg);
    text-align: center;
    color: var(--sdk-text-color-secondary);
  }
  .gallery-empty-icon {
    color: var(--sdk-text-color-secondary);
    opacity: 0.75;
  }
  .gallery-empty p {
    margin: 0;
    font-size: var(--text-sm);
  }
  @container gallery-page (max-width: 34rem) {
    .gallery-body {
      padding: var(--spacing-sm) var(--spacing-md) calc(var(--spacing-lg) + var(--pane-dock-space, 0px));
    }
    .gallery-search {
      width: 100%;
    }
  }
</style>
<div id="app" v-cloak>
  <section class="gallery-page">
    <page-header :title="t('panel.title')" :description="t('panel.description')"></page-header>
    <div class="gallery-body">
      <div class="gallery-content">
        <div class="gallery-toolbar">
          <nav class="gallery-segments" :aria-label="t('panel.categoriesLabel')">
            <button
              v-for="item in categories"
              :key="item"
              type="button"
              class="gallery-segment"
              :class="{ 'is-active': category === item }"
              :aria-pressed="category === item"
              @click="selectCategory(item)"
            >
              {{ t(`panel.category.${item}`) }}
            </button>
          </nav>
          <sdk-input
            v-model="searchText"
            class="gallery-search"
            clearable
            :placeholder="t('panel.searchPlaceholder')"
            :aria-label="t('panel.searchPlaceholder')"
          >
            <template #prefix>
              <svg class="gallery-search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </template>
          </sdk-input>
        </div>

        <projection
          slot="applications"
          class="gallery-list"
          @clear-filters="clearFilters"
        >
          <template #item-leading="{ ref, icon }">
            <agent-avatar v-if="ref.className === 'platform:AgentDefinition'" :icon="icon" :size="22"></agent-avatar>
            <span v-else class="gallery-app-icon">
              <component :is="appIcon(icon ?? 'app-window')" :size="16"></component>
            </span>
          </template>
          <template #empty>
            <div class="gallery-empty">
              <svg v-if="filtered" class="gallery-empty-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
              <svg v-else class="gallery-empty-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M10 4v4"></path>
                <path d="M2 8h20"></path>
                <path d="M6 4v4"></path>
              </svg>
              <p role="status">{{ t("panel.empty") }}</p>
              <sdk-button v-if="filtered" text @click="clearFilters">{{ t("panel.clear") }}</sdk-button>
            </div>
          </template>
        </projection>
      </div>
    </div>
  </section>
</div>
