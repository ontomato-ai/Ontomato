<style>
  [v-cloak] { display: none; }
  .db-page {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--sdk-bg-color-page, var(--sdk-bg-color));
    container: db-page / inline-size;
  }
  .db-topbar {
    display: flex;
    align-items: center;
    gap: var(--spacing-lg, 16px);
    padding: var(--page-content-gap, 20px) var(--page-gutter, 20px) var(--spacing-md, 12px);
    background: transparent;
    border-bottom: 1px solid var(--sdk-border-color);
    flex-shrink: 0;
    min-width: 0;
  }
  .db-tabs-wrap {
    flex: 1 1 auto;
    min-width: 0;
  }
  .db-tabs-member {
    min-width: 0;
  }
  .db-canvas {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    padding: var(--spacing-lg, 16px) var(--page-gutter, 20px) calc(var(--spacing-xl, 24px) + var(--pane-dock-space, 0px));
    box-sizing: border-box;
  }
  .db-no-boards {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .db-empty-state {
    flex: 1 1 auto;
    min-height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 24px;
    margin: 0;
    box-sizing: border-box;
    background: transparent;
  }
  .db-empty-content {
    text-align: center;
    transform: translateY(-24px);
  }
  .db-empty-icon {
    width: 72px;
    height: 72px;
    border-radius: var(--radius-md, 8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto var(--spacing-lg, 16px);
    background: var(--sdk-fill-color-light);
    color: var(--sdk-text-color-secondary);
  }
  .db-empty-title {
    margin: 0 0 8px;
    font-size: var(--text-xl, 20px);
    font-weight: var(--font-semibold, 600);
    color: var(--sdk-text-color-primary);
  }
  .db-empty-hint {
    margin: 0 0 20px;
    font-size: var(--text-sm, 13px);
    line-height: 1.5;
    color: var(--sdk-text-color-secondary);
  }
  .db-empty-btn-inner {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .db-group-empty-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    width: 100%;
    padding: 24px;
    border-radius: var(--radius-md, 8px);
    background: var(--sdk-fill-color-extra-light);
    text-align: center;
    box-sizing: border-box;
    user-select: none;
  }
  .db-group-empty-title {
    margin: 0 0 6px;
    font-size: var(--text-base, 14px);
    font-weight: var(--font-semibold, 600);
    color: var(--sdk-text-color-secondary);
  }
  .db-group-empty-desc {
    margin: 0;
    font-size: var(--text-sm, 13px);
    color: var(--sdk-text-color-placeholder);
    line-height: 1.7;
  }
  .db-group-empty-hl {
    font-weight: var(--font-semibold, 600);
    color: var(--sdk-color-primary);
  }
  .db-group-more {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: none;
    border-radius: var(--radius-md, 8px);
    background: transparent;
    color: var(--sdk-text-color-placeholder);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .db-group-more:hover:not(:disabled) {
    background: var(--sdk-fill-color-dark);
    color: var(--sdk-color-primary);
  }
  .db-group-more:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .db-card-actions {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs, 4px);
  }
  .db-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: var(--radius-sm, 6px);
    background: transparent;
    color: var(--sdk-text-color-secondary);
    cursor: pointer;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .db-icon-btn:hover:not(:disabled) {
    background: var(--sdk-fill-color);
    border-color: var(--sdk-border-color);
    color: var(--sdk-color-primary);
  }
  .db-icon-btn--active {
    background: var(--sdk-fill-color);
    border-color: var(--sdk-border-color);
    color: var(--sdk-color-primary);
  }
  .db-icon-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .db-truncation-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--sdk-color-warning);
    line-height: 1;
  }
  .db-card-projection {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .db-card-projection--metric {
    justify-content: flex-end;
  }
  .db-dialog-form {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm, 12px);
  }
  .db-dialog-label {
    font-size: var(--text-sm, 13px);
    font-weight: var(--font-medium, 500);
    color: var(--sdk-text-color-primary);
  }
  .db-dialog-footer {
    display: flex;
    justify-content: flex-end;
    gap: var(--spacing-xs, 8px);
  }
  .db-form-wrap {
    width: 100%;
    min-width: 0;
  }
  .db-form-wrap .sdk-owner-form,
  .db-form-wrap .sdk-owner-form-inner {
    height: auto;
  }
  .db-form-wrap .sdk-owner-form-body {
    overflow: visible;
  }
  @container db-page (max-width: 600px) {
    .db-topbar {
      flex-wrap: wrap;
      padding: var(--spacing-md, 12px) var(--spacing-sm, 12px) var(--spacing-sm, 8px);
    }
    .db-canvas {
      padding: var(--spacing-sm, 12px) var(--spacing-sm, 12px) calc(var(--spacing-sm, 12px) + var(--pane-dock-space, 0px));
    }
    .db-empty-state {
      padding: 16px;
    }
    .db-empty-content {
      transform: none;
    }
  }
</style>

<div id="app" v-cloak class="db-page">
  <page-header density="bar" :title="t('panel.name')"></page-header>
  <header class="db-topbar">
    <div class="db-tabs-wrap">
      <projection slot="boardTabs" class="db-tabs-member">
        <template #tabs-extra>
          <projection slot="createBoard" @done="onBoardCreated"></projection>
        </template>
      </projection>
    </div>
  </header>

  <main class="db-canvas">
    <div v-if="noBoards" class="db-no-boards" data-testid="dashboards-empty">
      <sdk-empty :description="t('empty.noBoards')"></sdk-empty>
    </div>

    <projection
      v-else-if="hasBoard"
      slot="boardGrid"
      :empty-group-title="t('group.untitled')"
      @layout-change="onLayoutChange"
      @row-action="onCardRowAction"
    >
      <template #empty>
        <div class="db-empty-state" data-testid="dashboard-groups-empty">
          <div class="db-empty-content">
            <div class="db-empty-icon" aria-hidden="true">📊</div>
            <h2 class="db-empty-title">{{ t("empty.noGroupsTitle") }}</h2>
            <p class="db-empty-hint">{{ t("empty.noGroupsHint") }}</p>
            <sdk-button
              type="primary"
              size="large"
              :disabled="groupBusy"
              data-action="create-first-group"
              @click="openCreateGroup()"
            >
              <span class="db-empty-btn-inner">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>{{ t("board.addGroup") }}</span>
              </span>
            </sdk-button>
          </div>
        </div>
      </template>

      <template #group-header-actions="{ group, index, locked }">
        <sdk-dropdown
          trigger="click"
          placement="bottom-end"
          :disabled="groupBusy || locked"
          @command="(cmd) => handleGroupCommand(cmd, group, index)"
        >
          <button
            type="button"
            class="db-group-more"
            :title="t('group.more')"
            :aria-label="t('group.more')"
            :disabled="groupBusy || locked"
            data-action="group-menu"
            @click.stop
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="1" />
              <circle cx="19" cy="12" r="1" />
              <circle cx="5" cy="12" r="1" />
            </svg>
          </button>
          <template #dropdown>
            <sdk-dropdown-menu>
              <sdk-dropdown-item command="create_above" data-action="add-group-above">
                {{ t("group.addAbove") }}
              </sdk-dropdown-item>
              <sdk-dropdown-item command="create_below" data-action="add-group-below">
                {{ t("group.addBelow") }}
              </sdk-dropdown-item>
              <sdk-dropdown-item command="rename" divided data-action="rename-group">
                {{ t("group.rename") }}
              </sdk-dropdown-item>
              <sdk-dropdown-item command="delete" data-action="delete-group">
                {{ t("group.delete") }}
              </sdk-dropdown-item>
            </sdk-dropdown-menu>
          </template>
        </sdk-dropdown>
      </template>

      <template #group-empty>
        <div class="db-group-empty-box">
          <div class="db-group-empty-title">{{ t("empty.groupTitle") }}</div>
          <p class="db-group-empty-desc">
            {{ t("empty.groupHintPrefix") }}
            <span class="db-group-empty-hl">{{ t("empty.groupHintHighlight") }}</span>
            {{ t("empty.groupHintSuffix") }}
          </p>
        </div>
      </template>

      <template #item-title-suffix="{ itemRef }">
        <span
          v-if="getCardTruncation(itemRef.primaryKey)"
          class="db-truncation-icon"
          role="note"
          :title="getCardTruncation(itemRef.primaryKey)"
          :aria-label="getCardTruncation(itemRef.primaryKey)"
          data-testid="card-truncation-warning"
        >
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
        </span>
      </template>

      <template #item-header-actions="{ row, itemRef, title, locked }">
        <div v-if="row.fields && row.fields.kind === 'chart'" class="db-card-actions">
          <button
            type="button"
            class="db-icon-btn"
            :title="t('card.zoom')"
            :aria-label="t('card.zoom')"
            data-action="card-zoom"
            @click.stop="setCardZoomed(itemRef.primaryKey, true)"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 15 6 6" />
              <path d="m15 9 6-6" />
              <path d="M21 16v5h-5" />
              <path d="M21 8V3h-5" />
              <path d="M3 16v5h5" />
              <path d="m3 21 6-6" />
              <path d="M3 8V3h5" />
              <path d="M9 9 3 3" />
            </svg>
          </button>
          <button
            type="button"
            class="db-icon-btn"
            :class="{ 'db-icon-btn--active': getCardViewMode(itemRef.primaryKey) === 'table' }"
            :title="getCardViewMode(itemRef.primaryKey) === 'table' ? t('card.viewChart') : t('card.viewData')"
            :aria-label="getCardViewMode(itemRef.primaryKey) === 'table' ? t('card.viewChart') : t('card.viewData')"
            :aria-pressed="getCardViewMode(itemRef.primaryKey) === 'table'"
            data-action="card-toggle-view"
            @click.stop="toggleCardViewMode(itemRef.primaryKey)"
          >
            <svg v-if="getCardViewMode(itemRef.primaryKey) === 'table'" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3v18h18" />
              <path d="M18 17V9" />
              <path d="M13 17V5" />
              <path d="M8 17v-3" />
            </svg>
            <svg v-else viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18" />
              <path d="M3 15h18" />
              <path d="M9 3v18" />
            </svg>
          </button>
          <button
            type="button"
            class="db-icon-btn"
            :title="t('card.parameters')"
            :aria-label="t('card.parameters')"
            :disabled="locked"
            data-action="card-parameters"
            @click.stop="openCardDialog(itemRef, 'parameters', title || row.label)"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
          </button>
        </div>
      </template>

      <template #item="{ row, itemRef, title, draftOverride }">
        <projection
          v-if="row.fields && row.fields.kind === 'chart'"
          :ref="(el) => setCardRef(itemRef.primaryKey, el, title || row.label)"
          slot="chartCard"
          :inputs="{ target: itemRef }"
          :title="title || row.label"
          :file-override="draftOverride ? draftOverride.fileOverride : undefined"
          :view-mode="getCardViewMode(itemRef.primaryKey)"
          :zoomed="isCardZoomed(itemRef.primaryKey)"
          min-height="100%"
          class="db-card-projection db-card-projection--chart"
          @update:view-mode="(mode) => setCardViewMode(itemRef.primaryKey, mode)"
          @update:zoomed="(open) => setCardZoomed(itemRef.primaryKey, open)"
          @truncation-change="(hint) => setCardTruncation(itemRef.primaryKey, hint)"
        >
          <template #table-footer-actions>
            <sdk-button
              size="small"
              text
              type="primary"
              data-action="table-metric-source"
              @click.stop="openCardDialog(itemRef, 'metricSource', title || row.label)"
            >
              {{ t("card.metricSource") }}
            </sdk-button>
          </template>
        </projection>
        <projection
          v-else
          :ref="(el) => setCardRef(itemRef.primaryKey, el, title || row.label)"
          slot="metricCard"
          :inputs="{ target: itemRef }"
          :field="cardFieldString(row, 'valueField')"
          :unit="cardFieldString(row, 'unit')"
          :formats="cardFormats(row)"
          class="db-card-projection db-card-projection--metric"
          @truncation-change="(hint) => setCardTruncation(itemRef.primaryKey, hint)"
        ></projection>
      </template>
    </projection>
  </main>

  <sdk-dialog
    v-model="paramDialogOpen"
    :title="paramDialogTitle"
    width="min(520px, calc(100vw - 24px))"
    append-to-body
    destroy-on-close
  >
    <div class="db-form-wrap">
      <projection
        v-if="paramDialogOpen && hasCard"
        slot="cardParamForm"
        @saved="onCardParametersSaved"
        @cancel="closeCardDialog"
        @discarded="closeCardDialog"
      ></projection>
    </div>
  </sdk-dialog>

  <sdk-dialog
    v-model="sourceDialogOpen"
    :title="sourceDialogTitle"
    width="min(520px, calc(100vw - 24px))"
    append-to-body
    destroy-on-close
  >
    <projection
      v-if="sourceDialogOpen && hasCard"
      slot="cardMetricSource"
      @navigate="onNavigateMetric"
    ></projection>
    <template #footer>
      <div class="db-dialog-footer">
        <sdk-button data-action="close-metric-source" @click="closeCardDialog">
          {{ t("dialog.close") }}
        </sdk-button>
        <projection
          v-if="sourceDialogOpen && hasCard"
          slot="cardMetricOpen"
          @navigate="onNavigateMetric"
        ></projection>
      </div>
    </template>
  </sdk-dialog>

  <sdk-dialog
    v-model="groupDialogOpen"
    :title="groupDialogTitle"
    width="440px"
    append-to-body
    destroy-on-close
  >
    <div class="db-dialog-form">
      <label class="db-dialog-label" for="db-group-title-input">{{ t("group.titleLabel") }}</label>
      <sdk-input
        id="db-group-title-input"
        v-model="groupTitleDraft"
        :placeholder="t('group.titlePlaceholder')"
        maxlength="50"
        @keyup.enter="submitGroupDialog"
      ></sdk-input>
    </div>
    <template #footer>
      <div class="db-dialog-footer">
        <sdk-button @click="groupDialogOpen = false">{{ t("dialog.cancel") }}</sdk-button>
        <sdk-button
          type="primary"
          :loading="groupBusy"
          :disabled="!canSubmitGroup"
          @click="submitGroupDialog"
        >
          {{ t("dialog.confirm") }}
        </sdk-button>
      </div>
    </template>
  </sdk-dialog>
</div>
