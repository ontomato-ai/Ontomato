<style>
  [v-cloak] { display: none; }
  .schedules-shell {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: schedules-page / inline-size;
  }
  .schedules {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + var(--pane-dock-space, 0px));
    min-width: 0;
  }
  .schedules-list-col {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .schedules-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .schedules-toolbar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
    min-width: 0;
  }
  .schedules-status-filter {
    width: 150px;
  }
  .schedules-search {
    width: min(260px, 100%);
    flex: 0 1 260px;
  }
  .schedules-empty-actions-bar {
    display: flex;
    justify-content: center;
    margin-top: calc(var(--spacing-sm) * -1);
  }
  .schedules-run-detail {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .schedules-plus-icon {
    margin-right: 4px;
    flex-shrink: 0;
  }
  .schedules-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-2xl, 36px) var(--spacing-lg);
    text-align: center;
    color: var(--sdk-text-color-secondary);
  }
  .schedules-empty-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .schedules-empty-title {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-primary);
  }
  .schedules-empty-actions {
    margin-top: var(--spacing-xs);
  }
  .schedules-dialog-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }
  .schedules-dialog-sub {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-note {
    margin: 0;
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-light);
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-timezone-readonly {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 0 var(--spacing-sm);
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-light);
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-app-opt {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
    min-width: 0;
  }
  .schedules-app-opt-icon {
    padding: 0 !important;
    height: auto !important;
    min-height: 0 !important;
    pointer-events: none;
  }
  .schedules-app-opt-desc {
    margin-left: var(--spacing-xs);
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-form-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    gap: var(--spacing-sm);
    width: 100%;
  }
  .schedules-form-actions-left {
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  .schedules-drawer-body {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .schedules-drawer-sub {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-focus {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-color-primary);
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-blank);
    min-width: 0;
  }
  .schedules-focus-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .schedules-focus-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .schedules-focus-actions {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  .schedules-runs {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
  .schedules-cell-muted {
    color: var(--sdk-text-color-placeholder);
  }
  .schedules-hidden-projection {
    display: none;
  }
</style>

<div id="app" v-cloak class="schedules-shell">
  <page-header :title="t('panel.name')" :description="t('intro')">
    <template #actions>
      <sdk-button
        ref="createButton"
        type="primary"
        :disabled="!canCreate || mode === 'create'"
        :title="createBlockedReason || undefined"
        data-action="new-task"
        @click="startCreate"
      >
        <svg class="schedules-plus-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
        {{ t("newTask") }}
      </sdk-button>
    </template>
  </page-header>

  <section ref="schedulePage" class="schedules">
    <projection slot="pageNotice"></projection>

    <sdk-alert
      v-if="showCredentialBanner"
      :title="t('notice.credentialRefused', { reason: renewalProblem })"
      type="warning"
      :closable="false"
      show-icon
    ></sdk-alert>

    <div class="schedules-list-col">
      <div class="schedules-toolbar">
        <projection slot="appFilter"></projection>
        <div class="schedules-toolbar-right">
          <sdk-select
            v-model="statusModel"
            class="schedules-status-filter"
            :aria-label="t('filter.status')"
            :placeholder="t('filter.statusAll')"
          >
            <sdk-option value="" :label="t('filter.statusAll')"></sdk-option>
            <sdk-option value="PENDING_REVIEW" :label="t('filter.statusPending')"></sdk-option>
            <sdk-option value="PUBLISHED" :label="t('filter.statusPublished')"></sdk-option>
            <sdk-option value="UNUSED" :label="t('filter.statusUnused')"></sdk-option>
          </sdk-select>
          <sdk-input
            v-model="searchModel"
            class="schedules-search"
            clearable
            :placeholder="t('filter.search')"
            :aria-label="t('filter.search')"
          ></sdk-input>
        </div>
      </div>

      <projection
        slot="tasks"
        :values="{ emptyText: emptyStateMessage(hasActiveFilters) }"
        @select="onSelectTask"
        @row-action="onTaskRowAction"
        @operation-done="onTaskOperationDone"
      ></projection>

      <div v-if="tasksStatus === 'empty'" class="schedules-empty-actions-bar">
        <sdk-button v-if="hasActiveFilters" size="small" @click="clearFilters">{{ t("empty.clearFilters") }}</sdk-button>
        <sdk-button
          v-else
          type="primary"
          size="small"
          :disabled="!canCreate"
          :title="createBlockedReason || undefined"
          @click="startCreate"
        >{{ t("newTask") }}</sdk-button>
      </div>
    </div>
  </section>

  <!-- Centered dialog for creating or editing a scheduled task (SC-08, SC-09, SC-10). -->
  <sdk-dialog
    :model-value="formDialogOpen"
    :title="mode === 'create' ? t('form.newTitle') : t('form.editTitle')"
    width="640px"
    align-center
    destroy-on-close
    :close-on-click-modal="false"
    @update:model-value="onFormDialogToggle"
    @closed="restoreFocusAfterForm"
  >
    <div class="schedules-dialog-body">
      <p v-if="mode === 'create'" class="schedules-dialog-sub">{{ t("form.subtitle") }}</p>
      <p class="schedules-note">{{ t("form.identity") }}</p>

      <div v-if="mode === 'create'" data-form="create">
        <projection slot="newForm" @saved="created" @cancel="closeFormDialog">
          <template #field-task.appId="{ field, value, disabled, set }">
            <sdk-select
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.appPlaceholder')"
              style="width: 100%"
              @update:model-value="set($event)"
            >
              <sdk-option
                v-for="opt in fieldOptions(field)"
                :key="String(opt.value)"
                :value="opt.value"
                :label="opt.label"
                :disabled="Boolean(opt.disabled)"
              >
                <span class="schedules-app-opt">
                  <sdk-button
                    v-if="opt.icon"
                    :icon="opt.icon"
                    text
                    size="small"
                    tabindex="-1"
                    aria-hidden="true"
                    class="schedules-app-opt-icon"
                  ></sdk-button>
                  <span>{{ opt.label }}</span>
                  <span v-if="opt.disabled && opt.disabledReason" class="schedules-app-opt-desc">{{ opt.disabledReason }}</span>
                  <span v-else-if="opt.description" class="schedules-app-opt-desc">{{ opt.description }}</span>
                </span>
              </sdk-option>
            </sdk-select>
          </template>

          <template #field-task.targetId="{ field, value, disabled, set }">
            <sdk-select
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.targetPlaceholder')"
              filterable
              style="width: 100%"
              @update:model-value="set($event)"
            >
              <sdk-option
                v-for="opt in fieldOptions(field)"
                :key="String(opt.value)"
                :value="opt.value"
                :label="opt.label"
                :disabled="Boolean(opt.disabled)"
              >
                <span class="schedules-app-opt">
                  <span>{{ opt.label }}</span>
                  <span v-if="opt.disabled && opt.disabledReason" class="schedules-app-opt-desc">{{ opt.disabledReason }}</span>
                  <span v-else-if="opt.description" class="schedules-app-opt-desc">{{ opt.description }}</span>
                </span>
              </sdk-option>
            </sdk-select>
          </template>

          <template #field-task.executorId>
            <projection slot="executorPicker"></projection>
          </template>

          <template #field-task.coauthorIds>
            <projection slot="coauthorsPicker"></projection>
          </template>

          <template #field-task.timeZone="{ value }">
            <span class="schedules-timezone-readonly">{{ value || "—" }}</span>
          </template>

          <template #field-task.notifyEmail="{ value, disabled, set }">
            <sdk-input
              type="email"
              inputmode="email"
              autocomplete="email"
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.notifyPlaceholder')"
              maxlength="320"
              clearable
              @update:model-value="set($event)"
            ></sdk-input>
          </template>

          <template #actions="{ saving, asking, save, cancel }">
            <div class="schedules-form-actions">
              <div class="schedules-form-actions-left">
                <sdk-button
                  text
                  size="small"
                  :disabled="saving || asking"
                  data-action="reload-create-form"
                  @click="recomputeForm('newForm')"
                >{{ t("form.reloadForm") }}</sdk-button>
              </div>
              <sdk-button :disabled="saving" @click="cancel">{{ t("form.cancel") }}</sdk-button>
              <sdk-button type="primary" :loading="saving" :disabled="asking" @click="save">
                {{ t("form.create") }}
              </sdk-button>
            </div>
          </template>
        </projection>
      </div>

      <div v-else-if="mode === 'edit' && selected" data-form="edit">
        <!-- Do not close the dialog on @discarded so reloading after FORM_CHANGED / REVISION_CONFLICT keeps the user in the editor. -->
        <projection slot="editForm" @saved="saved" @cancel="closeFormDialog">
          <template #field-task.appId="{ field, value, disabled, set }">
            <sdk-select
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.appPlaceholder')"
              style="width: 100%"
              @update:model-value="set($event)"
            >
              <sdk-option
                v-for="opt in fieldOptions(field)"
                :key="String(opt.value)"
                :value="opt.value"
                :label="opt.label"
                :disabled="Boolean(opt.disabled)"
              >
                <span class="schedules-app-opt">
                  <sdk-button
                    v-if="opt.icon"
                    :icon="opt.icon"
                    text
                    size="small"
                    tabindex="-1"
                    aria-hidden="true"
                    class="schedules-app-opt-icon"
                  ></sdk-button>
                  <span>{{ opt.label }}</span>
                  <span v-if="opt.disabled && opt.disabledReason" class="schedules-app-opt-desc">{{ opt.disabledReason }}</span>
                  <span v-else-if="opt.description" class="schedules-app-opt-desc">{{ opt.description }}</span>
                </span>
              </sdk-option>
            </sdk-select>
          </template>

          <template #field-task.targetId="{ field, value, disabled, set }">
            <sdk-select
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.targetPlaceholder')"
              filterable
              style="width: 100%"
              @update:model-value="set($event)"
            >
              <sdk-option
                v-for="opt in fieldOptions(field)"
                :key="String(opt.value)"
                :value="opt.value"
                :label="opt.label"
                :disabled="Boolean(opt.disabled)"
              >
                <span class="schedules-app-opt">
                  <span>{{ opt.label }}</span>
                  <span v-if="opt.disabled && opt.disabledReason" class="schedules-app-opt-desc">{{ opt.disabledReason }}</span>
                  <span v-else-if="opt.description" class="schedules-app-opt-desc">{{ opt.description }}</span>
                </span>
              </sdk-option>
            </sdk-select>
          </template>

          <template #field-task.executorId>
            <projection slot="executorPicker"></projection>
          </template>

          <template #field-task.coauthorIds>
            <projection slot="coauthorsPicker"></projection>
          </template>

          <template #field-task.timeZone="{ value }">
            <span class="schedules-timezone-readonly">{{ value || "—" }}</span>
          </template>

          <template #field-task.notifyEmail="{ value, disabled, set }">
            <sdk-input
              type="email"
              inputmode="email"
              autocomplete="email"
              :model-value="value ?? ''"
              :disabled="disabled"
              :placeholder="t('form.notifyPlaceholder')"
              maxlength="320"
              clearable
              @update:model-value="set($event)"
            ></sdk-input>
          </template>

          <template #actions="{ saving, asking, canSettle, save, discard }">
            <div class="schedules-form-actions">
              <div class="schedules-form-actions-left">
                <sdk-button
                  text
                  size="small"
                  :disabled="saving || asking"
                  data-action="reload-edit-form"
                  @click="recomputeForm('editForm')"
                >{{ t("form.reloadForm") }}</sdk-button>
                <sdk-button
                  text
                  size="small"
                  :disabled="saving || asking"
                  data-action="load-latest"
                  @click="loadLatestEdit(discard)"
                >{{ t("form.loadLatest") }}</sdk-button>
              </div>
              <sdk-button :disabled="saving" @click="requestCancelEdit">{{ t("form.cancel") }}</sdk-button>
              <sdk-button
                type="primary"
                :loading="saving"
                :disabled="!canSettle || asking"
                @click="save"
              >{{ t("form.save") }}</sdk-button>
            </div>
          </template>
        </projection>
      </div>
    </div>
  </sdk-dialog>

  <!-- Keeps selectedTask record outputs live for drawer title, deep links, and card result navigation. -->
  <div v-if="selected" class="schedules-hidden-projection" aria-hidden="true">
    <projection slot="detailHeader"></projection>
  </div>

  <!-- Independent right-side run records drawer (SC-11). -->
  <sdk-drawer
    :model-value="runsDrawerOpen"
    :title="runsDrawerTitle"
    direction="rtl"
    size="min(560px, 92vw)"
    destroy-on-close
    @update:model-value="onRunsDrawerToggle"
  >
    <div v-if="selected" class="schedules-drawer-body">
      <projection slot="detailPause">
        <template #actions>
          <sdk-button
            v-if="detailPauseCode === 'definition_changed'"
            class="pause-review"
            link
            type="primary"
            size="small"
            @click="openEdit"
          >{{ t("card.review") }}</sdk-button>
        </template>
      </projection>

      <projection slot="detailSummary"></projection>

      <p v-if="isRunning" class="schedules-drawer-sub" aria-live="polite">{{ t("runs.refreshing") }}</p>

      <section v-if="runId" class="schedules-focus" :data-run="runId">
        <div class="schedules-focus-head">
          <h4 class="schedules-focus-title">{{ focusIsOffPage ? t("runs.linked") : t("runs.details") }}</h4>
          <div class="schedules-focus-actions">
            <sdk-button
              v-if="focusResultPath"
              class="result-link"
              link
              type="primary"
              size="small"
              @click="openResult(focusResultPath)"
            >{{ t("runs.viewResult") }} →</sdk-button>
            <sdk-button text size="small" data-action="close-focus" @click="closeFocus">{{ t("runs.hide") }}</sdk-button>
          </div>
        </div>
        <projection slot="focus"></projection>
      </section>

      <div ref="historyRecords" class="schedules-runs">
        <projection
          slot="history"
          :values="{ expandedKeys: expandedRunIds }"
          @update:expanded-keys="onExpandedRunsChange"
          @choose="onChooseRun"
          @row-action="onRunRowAction"
        >
          <template #cell-resultPath="{ value }">
            <sdk-button
              v-if="value"
              link
              type="primary"
              size="small"
              data-action="run-result"
              @click.stop="openResult(String(value))"
            >{{ t("runs.viewResult") }} →</sdk-button>
          </template>
          <template #row-detail="{ ref: rowRef }">
            <div v-if="rowRef?.primaryKey" class="schedules-run-detail" :data-run-detail="rowRef.primaryKey">
              <projection slot="runDetail" :inputs="{ runId: rowRef.primaryKey }"></projection>
            </div>
          </template>
        </projection>
      </div>
    </div>
  </sdk-drawer>
</div>
