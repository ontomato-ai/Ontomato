<style>
  [v-cloak] { display: none; }
  .schedules-shell {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: schedules-page / inline-size;
  }
  .schedules {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
    padding: var(--spacing-md) var(--page-gutter) calc(var(--page-content-gap) + 56px);
    min-width: 0;
  }
  .schedules-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: var(--spacing-lg);
    align-items: start;
    min-width: 0;
  }
  .schedules-body.with-pane {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  }
  @container schedules-page (max-width: 960px) {
    .schedules-body.with-pane {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .schedules-list-col {
    min-width: 0;
  }
  .schedules-pane {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-lg);
    border: 1px solid var(--sdk-border-color-lighter);
    border-radius: var(--radius-lg);
    background: var(--sdk-bg-color);
    min-width: 0;
  }
  .schedules-pane-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .schedules-pane-head h2 {
    margin: 0;
    font-size: var(--text-lg);
    overflow-wrap: anywhere;
  }
  .schedules-pane-head p {
    margin: var(--spacing-xs) 0 0;
    font-size: var(--text-sm);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-note {
    margin: 0;
    padding: var(--spacing-sm) var(--spacing-md);
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-light);
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .schedules-section-title {
    margin: var(--spacing-xs) 0 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .schedules-sub {
    margin: 0;
    font-size: var(--text-xs);
    color: var(--sdk-text-color-secondary);
  }
  .schedules-edit-pane {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    outline: none;
  }
  .schedules-focus {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border: 1px solid var(--sdk-color-primary);
    border-radius: var(--radius-md);
    background: var(--sdk-fill-color-blank);
    min-width: 0;
  }
  .schedules-focus-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-sm);
  }
  .schedules-focus-title {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    color: var(--sdk-text-color-primary);
  }
  .schedules-focus-actions {
    display: flex;
    align-items: center;
    gap: var(--spacing-xs);
  }
  .schedules-runs {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    min-width: 0;
  }
</style>

<div id="app" v-cloak class="schedules-shell">
  <page-header :title="t('panel.name')">
    <template #actions>
      <sdk-button text circle :aria-label="$t('common.refresh')" :title="$t('common.refresh')" @click="refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
      </sdk-button>
      <sdk-button type="primary" :disabled="mode === 'create'" @click="startCreate">{{ t("newTask") }}</sdk-button>
    </template>
  </page-header>

  <section ref="schedulePage" class="schedules">
    <sdk-alert
      v-if="renewalProblem"
      :title="t('notice.credentialRefused', { reason: renewalProblem })"
      type="warning"
      :closable="false"
      show-icon
    ></sdk-alert>

    <div class="schedules-body" :class="{ 'with-pane': paneOpen }">
      <div class="schedules-list-col">
        <projection slot="tasks" @row-action="onTaskRowAction">
          <template #filters>
            <projection slot="appFilter"></projection>
          </template>
        </projection>
      </div>

      <aside v-if="paneOpen" class="schedules-pane" aria-live="polite">
        <template v-if="mode === 'create'">
          <div class="schedules-pane-head">
            <div>
              <h2>{{ t("form.newTitle") }}</h2>
              <p>{{ t("form.subtitle") }}</p>
            </div>
            <sdk-button text size="small" @click="closePane">{{ t("action.close") }}</sdk-button>
          </div>
          <p class="schedules-note">{{ t("form.identity") }}</p>
          <div data-form="create">
            <projection slot="newForm" @saved="created" @cancel="cancelForm"></projection>
          </div>
        </template>

        <template v-else-if="selected">
          <div
            v-show="mode === 'edit'"
            ref="editPane"
            class="schedules-edit-pane"
            data-form="edit"
            tabindex="-1"
            @keydown.esc="closeEditOnEscape"
          >
            <div class="schedules-pane-head">
              <div>
                <h2>{{ t("form.editTitle") }}</h2>
                <p>{{ t("form.conflictHint") }}</p>
              </div>
              <sdk-button text size="small" @click="cancelForm">{{ t("action.close") }}</sdk-button>
            </div>
            <p class="schedules-note">{{ t("form.identity") }}</p>
            <projection slot="editForm" @saved="saved" @discarded="cancelForm" @cancel="cancelForm"></projection>
          </div>

          <template v-if="mode === 'view'">
            <projection slot="detailHeader">
              <template #actions>
                <div class="schedules-actions">
                  <sdk-switch
                    v-if="detailReady && detailEnabled !== null"
                    :model-value="detailEnabled"
                    :loading="selectedBusy"
                    :disabled="selectedBusy"
                    :aria-label="t('action.toggle')"
                    data-action="toggle-enabled"
                    @update:model-value="toggleSelected(Boolean($event))"
                  ></sdk-switch>
                  <sdk-button
                    v-if="detailReady"
                    type="primary"
                    size="small"
                    :loading="selectedBusy"
                    data-action="run-now"
                    @click="runNowSelected"
                  >{{ t("action.runNow") }}</sdk-button>
                  <sdk-button
                    v-if="detailReady"
                    size="small"
                    data-action="edit"
                    @click="openEdit"
                  >{{ t("action.edit") }}</sdk-button>
                  <sdk-button
                    v-if="detailReady"
                    size="small"
                    type="danger"
                    plain
                    :loading="selectedBusy"
                    data-action="delete"
                    @click="deleteSelected"
                  >{{ t("action.delete") }}</sdk-button>
                  <sdk-button
                    v-if="detailLatestResultPath"
                    link
                    type="primary"
                    size="small"
                    data-action="latest-result"
                    @click="openResult(detailLatestResultPath)"
                  >{{ t("action.viewResult") }} →</sdk-button>
                  <sdk-button text size="small" data-action="close-pane" @click="closePane">{{ t("action.close") }}</sdk-button>
                </div>
              </template>
            </projection>

            <projection slot="detailPause">
              <template #actions>
                <sdk-button
                  v-if="detailPauseCode === 'definition_changed'"
                  class="pause-review"
                  link
                  type="primary"
                  size="small"
                  @click="openEdit"
                >{{ t("card.review") }}</sdk-button>
              </template>
            </projection>

            <projection slot="detailSummary"></projection>

            <div ref="historyRecords" class="schedules-runs">
              <h3 class="schedules-section-title" data-records>{{ t("runs.title") }}</h3>
              <p v-if="isRunning" class="schedules-sub" aria-live="polite">{{ t("runs.refreshing") }}</p>

              <section v-if="runId" class="schedules-focus" :data-run="runId">
                <div class="schedules-focus-head">
                  <h4 class="schedules-focus-title">{{ t("runs.linked") }}</h4>
                  <div class="schedules-focus-actions">
                    <sdk-button
                      v-if="focusResultPath"
                      class="result-link"
                      link
                      type="primary"
                      size="small"
                      @click="openResult(focusResultPath)"
                    >{{ t("action.viewResult") }} →</sdk-button>
                    <sdk-button text size="small" data-action="close-focus" @click="closeFocus">{{ t("action.close") }}</sdk-button>
                  </div>
                </div>
                <projection slot="focus"></projection>
              </section>

              <projection slot="history" @choose="onChooseRun" @row-action="onRunRowAction"></projection>
            </div>
          </template>
        </template>
      </aside>
    </div>
  </section>
</div>
