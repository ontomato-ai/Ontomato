<style>
  /* Full-bleed edge-to-edge three-column ontology graph workbench: no outer frame card, no page gutter. */
  .og {
    position: relative;
    display: flex;
    flex: 1;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
  }
  .og-errors {
    padding: var(--spacing-md);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }
  .og-grid {
    display: grid;
    flex: 1;
    height: 100%;
    min-height: 0;
    grid-template-columns: 248px minmax(320px, 1fr) 310px;
    overflow: hidden;
  }
  .og-explorer,
  .og-side {
    display: flex;
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    background: var(--sdk-bg-color);
  }
  .og-explorer {
    border-right: 1px solid var(--sdk-border-color, var(--ui-border));
  }
  .og-side {
    border-left: 1px solid var(--sdk-border-color, var(--ui-border));
    overflow: auto;
  }

  /* Left explorer: search box + three-way segment control without label truncation. */
  .og-search-box {
    display: grid;
    min-width: 0;
    gap: var(--spacing-sm);
    padding: var(--spacing-md);
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
  }
  .og-search-box .el-input {
    width: 100%;
  }
  .og-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .og-segments {
    display: grid;
    grid-template-columns: 0.72fr 1fr 1fr;
    gap: 2px;
    width: 100%;
    min-width: 0;
    padding: 2px;
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-light, var(--ui-fill-tertiary));
    box-sizing: border-box;
  }
  .og-segment {
    min-width: 0;
    padding: 4px 2px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--sdk-text-color-secondary);
    font: inherit;
    font-size: var(--text-xs);
    line-height: 18px;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
  }
  .og-segment:hover {
    color: var(--sdk-text-color-primary);
  }
  .og-segment.active {
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-primary);
    font-weight: var(--font-semibold);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  .og-list {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: var(--spacing-sm) var(--spacing-sm) 64px;
  }
  .og-list-section + .og-list-section {
    margin-top: var(--spacing-md);
  }
  .og-list-section > p {
    margin: 0 6px 5px;
    color: var(--sdk-text-color-placeholder);
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
  }
  .og-list-section .sdk-panel-member,
  .og-list-section .sdk-object-list,
  .og-list-section .sdk-object-list-items {
    height: auto;
    overflow: visible;
  }
  .og-list-section .sdk-object-list-item {
    border-bottom: 0;
  }
  .og-list-section .sdk-object-list-item-btn,
  .og-list-section .sdk-object-list-item-btn.sdk-object-list-item-two-line {
    min-height: 46px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
  }
  .og-list-section .sdk-object-list-item-btn:hover {
    background: var(--sdk-fill-color-light);
  }
  .og-list-section .sdk-object-list-item-btn.chosen {
    color: var(--sdk-color-primary, var(--brand-link));
    background: var(--sdk-color-primary-light-9, var(--ui-fill-tertiary));
  }
  .og-list-section .sdk-object-list-item-label {
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    line-height: 1.35;
  }
  .og-list-section .sdk-object-list-item-sub {
    color: var(--sdk-text-color-placeholder);
    font-size: var(--text-xs);
    line-height: 1.35;
  }
  .og-icon {
    display: grid;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    place-items: center;
    border-radius: var(--radius-sm);
  }
  .og-icon-object,
  .og-icon-relation {
    color: var(--sdk-color-primary, var(--brand-link));
    background: var(--sdk-color-primary-light-9, var(--ui-fill-tertiary));
  }
  .og-list-empty {
    padding: var(--spacing-lg) 0;
  }

  /* Header stats strip composed from official ObjectCount projections. */
  .og-summary {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-sm);
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .og-summary > .sdk-panel-member {
    display: inline-flex;
    align-items: baseline;
    width: auto;
    height: auto;
  }
  .og-summary-sep {
    color: var(--sdk-text-color-placeholder);
    user-select: none;
  }
  .og-refresh-icon {
    flex: none;
  }

  /* Center graph canvas + top-center floating path toast. */
  .og-graph {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .og-canvas {
    position: absolute;
    inset: 0;
    min-width: 0;
    min-height: 0;
  }
  .og-canvas > [data-member] {
    display: flex;
    height: 100%;
    min-height: 0;
    flex-direction: column;
  }
  .og-canvas > [data-member] > * {
    flex: 1 1 auto;
    height: 100%;
    min-height: 0;
  }
  .og-toast {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font-size: var(--text-sm);
    line-height: 1.4;
    white-space: nowrap;
    box-shadow: var(--elevation-overlay, 0 4px 12px rgba(15, 23, 42, 0.08));
    pointer-events: none;
  }
  .og-toast.is-success {
    background: var(--sdk-color-success-light-9, #f0f9eb);
    border-color: var(--sdk-color-success-light-5, #b3e19d);
    color: var(--sdk-color-success, #67c23a);
  }
  .og-toast.is-warning {
    background: var(--sdk-color-warning-light-9, #fdf6ec);
    border-color: var(--sdk-color-warning-light-5, #f3d19e);
    color: var(--sdk-color-warning, #e6a23c);
  }
  .og-graph-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 8px;
    background: var(--sdk-bg-color);
    color: var(--sdk-text-color-secondary);
    text-align: center;
  }
  .og-graph-empty strong {
    color: var(--sdk-text-color-primary);
    font-size: var(--text-base);
  }
  .og-graph-empty span {
    font-size: var(--text-xs);
  }

  /* Right pane: path finder on top, element inspector below. */
  .og-path {
    flex: none;
    padding: var(--spacing-md);
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
  }
  .og-path-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--spacing-sm);
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .og-path-head strong {
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .og-path-controls {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 6px;
  }
  .og-path-controls > .sdk-panel-member {
    min-width: 0;
  }
  .og-path-arrow {
    color: var(--sdk-text-color-placeholder);
  }
  .og-path-action {
    margin-top: var(--spacing-sm);
  }
  .og-path-btn {
    width: 100%;
  }

  .og-detail {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .og-detail-content {
    padding: var(--spacing-md) var(--spacing-md) 72px;
  }
  .og-detail-header .sdk-object-header-row {
    flex-wrap: nowrap;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .og-detail-header .sdk-object-header-identity {
    flex: 1 1 0;
    min-width: 0;
    gap: 2px;
  }
  .og-detail-header .sdk-object-header-title {
    font-size: var(--text-base);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow-wrap: normal;
  }
  .og-detail-header .sdk-object-header-actions {
    flex: 0 0 auto;
  }
  .og-modeling {
    flex-shrink: 0;
  }
  .og-modeling-inner {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .og-description {
    margin: 10px 0 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
    line-height: var(--leading-relaxed);
  }
  .og-description:has(.sdk-typed-value-empty) {
    display: none;
  }
  .og-section {
    margin-top: var(--spacing-md);
  }
  .og-section-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--sdk-border-color-light, var(--ui-divider));
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
  }
  .og-section-label small {
    color: var(--sdk-text-color-placeholder);
    font-weight: var(--font-normal);
  }
  .og-section .sdk-panel-member,
  .og-section .sdk-object-list,
  .og-section .sdk-object-list-items,
  .og-section .sdk-object-list-table-wrap {
    height: auto;
    overflow: visible;
    border: 0;
    border-radius: 0;
    background: transparent;
  }
  .og-section .sdk-object-list-table {
    width: 100%;
    table-layout: fixed;
  }
  .og-section .sdk-object-list-table td {
    height: auto;
    padding: 7px 0;
    border-bottom: 1px solid var(--sdk-border-color-extra-light, var(--ui-divider));
  }
  .og-section .sdk-object-list-table td:last-child {
    padding-left: var(--spacing-sm);
  }
  .og-section .sdk-object-list-cell-main {
    color: var(--sdk-text-color-regular);
    font-size: var(--text-sm);
    font-weight: var(--font-semibold);
    line-height: 1.35;
  }
  .og-section .sdk-object-list-cell-sub {
    color: var(--sdk-text-color-placeholder);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    line-height: 1.35;
  }
  .og-relations-list .sdk-object-list-item-btn,
  .og-relations-list .sdk-object-list-item-btn.sdk-object-list-item-two-line {
    min-height: 44px;
    padding: 7px 4px;
  }
  .og-relations-list .sdk-object-list-item-label {
    color: var(--sdk-color-primary, var(--brand-link));
    font-size: var(--text-xs);
    font-weight: var(--font-semibold);
    line-height: 1.35;
  }
  .og-relations-list .sdk-object-list-item-sub {
    color: var(--sdk-text-color-regular);
    font-size: var(--text-xs);
    line-height: 1.35;
  }
  .og-flow {
    display: grid;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-md);
  }
  .og-flow-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--sdk-color-primary, var(--brand-link));
    font-size: var(--text-xs);
  }
  .og-flow-link .sdk-panel-member {
    display: inline-flex;
    width: auto;
  }
  .og-flow-link .sdk-typed-value {
    color: inherit;
  }
  .og-side-empty {
    display: grid;
    flex: 1;
    place-content: center;
    justify-items: center;
    gap: 7px;
    padding: var(--spacing-xl);
    color: var(--sdk-text-color-secondary);
    text-align: center;
  }
  .og-side-empty .og-empty-mark {
    display: grid;
    width: 48px;
    height: 48px;
    place-items: center;
    border-radius: 50%;
    background: var(--sdk-color-primary-light-9, var(--ui-fill-tertiary));
    color: var(--sdk-color-primary, var(--brand-link));
  }
  .og-side-empty strong {
    color: var(--sdk-text-color-primary);
    font-size: var(--text-sm);
  }
  .og-side-empty span {
    max-width: 100%;
    font-size: var(--text-xs);
    line-height: var(--leading-relaxed);
  }
  .og-missing {
    display: flex;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
    padding: var(--spacing-xl) var(--spacing-md);
    text-align: center;
  }
  .og-missing-key {
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: var(--sdk-fill-color-light, var(--ui-fill-tertiary));
    color: var(--sdk-text-color-secondary);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    word-break: break-all;
  }
  .og-note {
    margin: var(--spacing-sm) 0 0;
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-xs);
  }
  .og-failure {
    color: var(--sdk-color-danger);
  }

  /* Responsive columns based on panel container width (not viewport width). */
  @container (max-width: 1150px) {
    .og-grid {
      grid-template-columns: 224px minmax(300px, 1fr) 292px;
    }
  }
  @container (max-width: 1020px) {
    .og-grid {
      grid-template-columns: 210px minmax(260px, 1fr) 272px;
    }
  }
  @container (max-width: 760px) {
    .og {
      overflow: auto;
    }
    .og-grid {
      display: grid;
      height: auto;
      flex: none;
      grid-template-columns: 1fr;
      overflow: visible;
    }
    .og-explorer,
    .og-side {
      border: 0;
      border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
      overflow: visible;
    }
    .og-list {
      max-height: 260px;
      padding-bottom: var(--spacing-sm);
    }
    .og-graph {
      min-height: 520px;
      order: -1;
      border-bottom: 1px solid var(--sdk-border-color, var(--ui-border));
    }
    .og-detail-content {
      padding-bottom: 72px;
    }
  }
  @container (max-width: 500px) {
    .og-summary {
      flex-wrap: wrap;
      gap: var(--spacing-xs);
    }
    .og-graph {
      min-height: 440px;
    }
  }
</style>
<div id="app">
  <section class="og" v-sdk-loading="loading">
    <page-header title="本体图谱" description="探索本体中对象类型、属性与关系的结构">
      <template #actions>
        <div class="og-summary" aria-label="本体资源统计">
          <projection slot="objectStats"></projection>
          <span class="og-summary-sep" aria-hidden="true">·</span>
          <projection slot="attributeStats"></projection>
          <span class="og-summary-sep" aria-hidden="true">·</span>
          <projection slot="relationStats"></projection>
        </div>
        <sdk-button text aria-label="刷新" title="刷新" @click="refresh">
          <svg class="og-refresh-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </sdk-button>
      </template>
    </page-header>

    <div v-if="readError" class="og-errors">
      <sdk-alert :title="readError" type="error" :closable="false" show-icon></sdk-alert>
    </div>

    <div v-else class="og-grid">
      <aside class="og-explorer">
        <div class="og-search-box">
          <sdk-input
            :model-value="search"
            placeholder="搜索 本体模型"
            aria-label="搜索 本体模型"
            clearable
            @update:model-value="setSearch"
          >
            <template #prefix>
              <svg class="og-search-icon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" />
                <path d="m10.5 10.5 3 3" />
              </svg>
            </template>
          </sdk-input>
          <div class="og-segments" role="group" aria-label="按类型筛选">
            <button
              v-for="option in filterOptions"
              :key="option.value"
              type="button"
              class="og-segment"
              :class="{ active: filter === option.value }"
              @click="setFilter(option.value)"
            >{{ option.label }}</button>
          </div>
        </div>
        <div ref="listEl" class="og-list">
          <div v-show="showObjectsSection" class="og-list-section">
            <p>对象类型 · {{ objectFilteredCount ?? 0 }}</p>
            <projection
              slot="objectList"
              @choose="onObjectChosen"
              @update:listed="onObjectsListed"
            >
              <template #item-leading>
                <span class="og-icon og-icon-object" aria-hidden="true">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 14 4.6v6.8L8 14.2 2 11.4V4.6z"/><path d="M2 4.6 8 7.4l6-2.8M8 7.4v6.8"/></svg>
                </span>
              </template>
            </projection>
          </div>
          <div v-show="showRelationsSection" class="og-list-section">
            <p>关系类型 · {{ relationFilteredCount ?? 0 }}</p>
            <projection
              slot="relationList"
              @choose="onRelationChosen"
              @update:listed="onRelationsListed"
            >
              <template #item-leading>
                <span class="og-icon og-icon-relation" aria-hidden="true">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="3.5" cy="8" r="1.6"/><circle cx="12.5" cy="8" r="1.6"/><path d="M5.3 8h5.4"/></svg>
                </span>
              </template>
            </projection>
          </div>
          <div v-if="listEmpty" class="og-list-empty">
            <sdk-empty description="未找到匹配资源" :image-size="54"></sdk-empty>
          </div>
        </div>
      </aside>

      <main class="og-graph">
        <div
          v-if="toast"
          class="og-toast"
          :class="toast.type === 'success' ? 'is-success' : 'is-warning'"
          role="status"
          data-graph-path-toast
        >
          <svg v-if="toast.type === 'success'" viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm2.85 5.1-3.3 3.4a.65.65 0 0 1-.93 0l-1.47-1.5a.65.65 0 1 1 .93-.91l1 1.02 2.84-2.92a.65.65 0 0 1 .93.91Z"/>
          </svg>
          <svg v-else viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true">
            <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4.5Zm0 7a.85.85 0 1 1 0-1.7.85.85 0 0 1 0 1.7Z"/>
          </svg>
          <span>{{ toast.text }}</span>
        </div>
        <div class="og-canvas">
          <projection slot="graph"></projection>
        </div>
        <div v-if="graphEmpty" class="og-graph-empty">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 3v6M15 3v6M6 9h12v4a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/></svg>
          <strong>暂无对象类型</strong>
          <span>请先在对象类型页面创建对象类型</span>
        </div>
      </main>

      <aside class="og-side">
        <section class="og-path">
          <div class="og-path-head">
            <strong title="沿着关系方向，在两个对象类型之间查找最短路径">路径查找</strong>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="19" r="3" />
              <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
              <circle cx="18" cy="5" r="3" />
            </svg>
          </div>
          <div class="og-path-controls">
            <projection slot="pathFromPicker"></projection>
            <svg class="og-path-arrow" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <projection slot="pathToPicker"></projection>
          </div>
          <div class="og-path-action">
            <sdk-button class="og-path-btn" type="primary" plain :disabled="!canFindPath" @click="findPath">
              查找路径
            </sdk-button>
          </div>
        </section>

        <section class="og-detail">
          <template v-if="hasObjectSelection">
            <div v-show="!isMissingObject" class="og-detail-content">
              <div class="og-detail-header">
                <projection slot="objectHeader">
                  <template #leading>
                    <span class="og-icon og-icon-object" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 14 4.6v6.8L8 14.2 2 11.4V4.6z"/><path d="M2 4.6 8 7.4l6-2.8M8 7.4v6.8"/></svg>
                    </span>
                  </template>
                  <template #actions>
                    <sdk-button class="og-modeling" size="small" @click="openModeling">
                      <span class="og-modeling-inner">
                        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                          <rect x="2" y="2" width="4.5" height="4.5" rx="1" />
                          <rect x="9.5" y="9.5" width="4.5" height="4.5" rx="1" />
                          <path d="M4.25 6.5v2.75a2 2 0 0 0 2 2H9.5" />
                        </svg>
                        去建模
                      </span>
                    </sdk-button>
                  </template>
                </projection>
              </div>
              <template v-if="objectReady">
                <p class="og-description">
                  <projection slot="objectDesc"></projection>
                </p>
                <div class="og-section">
                  <div class="og-section-label">
                    <span>属性</span>
                    <small>{{ objectAttributesTotal ?? "" }}</small>
                  </div>
                  <projection slot="objectAttributes" :inputs="{ className: requestedObjectKey }"></projection>
                </div>
                <div class="og-section og-relations-list">
                  <div class="og-section-label">
                    <span>关联关系</span>
                    <small>{{ objectRelationsTotal ?? "" }}</small>
                  </div>
                  <projection
                    slot="objectRelations"
                    :inputs="{ className: requestedObjectKey }"
                    @choose="onRelationChosen"
                  ></projection>
                </div>
              </template>
              <p v-if="navigationError" class="og-note og-failure">{{ navigationError }}</p>
            </div>
            <div v-if="isMissingObject" class="og-missing" data-graph-missing-selection>
              <sdk-empty description="对象类型不存在或已删除" :image-size="48"></sdk-empty>
              <code class="og-missing-key">{{ requestedObjectKey }}</code>
              <sdk-button size="small" @click="clearSelection">清除选择</sdk-button>
            </div>
          </template>

          <template v-else-if="hasRelationSelection">
            <div v-show="!isMissingRelation" class="og-detail-content">
              <div class="og-detail-header">
                <projection slot="relationHeader">
                  <template #leading>
                    <span class="og-icon og-icon-relation" aria-hidden="true">
                      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="3.5" cy="8" r="1.6"/><circle cx="12.5" cy="8" r="1.6"/><path d="M5.3 8h5.4"/></svg>
                    </span>
                  </template>
                  <template #actions>
                    <sdk-button class="og-modeling" size="small" @click="openModeling">
                      <span class="og-modeling-inner">
                        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                          <rect x="2" y="2" width="4.5" height="4.5" rx="1" />
                          <rect x="9.5" y="9.5" width="4.5" height="4.5" rx="1" />
                          <path d="M4.25 6.5v2.75a2 2 0 0 0 2 2H9.5" />
                        </svg>
                        去建模
                      </span>
                    </sdk-button>
                  </template>
                </projection>
              </div>
              <template v-if="relationReady">
                <div class="og-flow">
                  <projection slot="relationFrom" @navigate="onNavigateObject"></projection>
                  <div class="og-flow-link">
                    <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="3.5" cy="8" r="1.6"/><circle cx="12.5" cy="8" r="1.6"/><path d="M5.3 8h5.4"/></svg>
                    <projection slot="relationName"></projection>
                  </div>
                  <projection slot="relationTo" @navigate="onNavigateObject"></projection>
                </div>
                <p class="og-description">
                  <projection slot="relationDesc"></projection>
                </p>
              </template>
              <p v-if="navigationError" class="og-note og-failure">{{ navigationError }}</p>
            </div>
            <div v-if="isMissingRelation" class="og-missing" data-graph-missing-selection>
              <sdk-empty description="关系类型不存在或已删除" :image-size="48"></sdk-empty>
              <code class="og-missing-key">{{ requestedRelationKey }}</code>
              <sdk-button size="small" @click="clearSelection">清除选择</sdk-button>
            </div>
          </template>

          <div v-else class="og-side-empty">
            <div class="og-empty-mark">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 4.1 12 6" />
                <path d="m5.1 8-2.9-.8" />
                <path d="m6 12-1.9 2" />
                <path d="M7.2 2.2 8 5.1" />
                <path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z" />
              </svg>
            </div>
            <strong>选择一个图谱元素</strong>
            <span>对象属性、业务描述和关联关系将在这里展示。</span>
          </div>
        </section>
      </aside>
    </div>
  </section>
</div>
