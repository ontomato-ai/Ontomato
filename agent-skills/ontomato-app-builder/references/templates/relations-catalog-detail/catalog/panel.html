<style>
  .relations {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100%;
    container: relations-page / inline-size;
  }
  .relations-btn-icon {
    margin-inline-end: 6px;
    flex-shrink: 0;
  }
  /* Catalog view: own page gutter and spacing matching original OntologyModelCatalog. */
  .relations-catalog {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: var(--spacing-lg) var(--page-gutter) var(--page-content-gap);
  }
  .relations-toolbar {
    display: flex;
    flex-wrap: wrap;
    min-height: 40px;
    align-items: center;
    gap: var(--spacing-sm);
  }
  .relations-toolbar .relations-search {
    width: 260px;
    max-width: 100%;
  }
  .relations-search-icon {
    color: var(--sdk-text-color-placeholder);
  }
  .relations-count {
    color: var(--sdk-text-color-secondary);
    font-size: var(--text-sm);
  }
  .relations-table-host {
    margin-top: var(--spacing-lg);
    min-width: 0;
  }
  .relations-table-host .sdk-object-list {
    height: auto;
    gap: 0;
  }
  .relations-table-host .sdk-object-list-table td {
    height: var(--list-row-height, 44px);
  }
  .relations-table-host .sdk-object-list-table td:first-child .sdk-object-list-cell-main {
    color: var(--sdk-text-color-primary);
    font-weight: var(--font-semibold);
  }
  .relations-table-host .sdk-object-list-table td:nth-child(2) .sdk-object-list-cell-main,
  .relations-table-host .sdk-object-list-table td:nth-child(3) .sdk-object-list-cell-main,
  .relations-table-host .sdk-object-list-table td:nth-child(4) .sdk-object-list-cell-main {
    color: var(--sdk-text-color-secondary);
    font-weight: var(--font-regular);
  }
  .relations-table-host .sdk-object-list-footer {
    display: none;
  }
  .relations-create-body .sdk-owner-form,
  .relations-create-body .sdk-owner-form-inner {
    height: auto;
  }
  .relations-create-body .sdk-owner-form-body {
    overflow: visible;
  }
  .relations-create-body .sdk-owner-form-actions {
    border-top: 0;
    margin-block-start: var(--spacing-sm);
    padding-block: var(--spacing-xs) 0;
  }

  @container relations-page (max-width: 560px) {
    .relations-toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .relations-toolbar .relations-search {
      width: 100%;
    }
  }
</style>
<div id="app">
  <section class="relations">
    <page-header title="关系类型" description="定义对象类型之间的关系及其关联端点">
      <template #actions>
        <sdk-button text aria-label="刷新" title="刷新" @click="refresh">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </sdk-button>
        <sdk-button type="primary" :disabled="creating" @click="startCreate">
          <svg class="relations-btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>新建关系类型</span>
        </sdk-button>
      </template>
    </page-header>
    <div class="relations-catalog">
      <div class="relations-toolbar">
        <sdk-input class="relations-search" v-model="search" placeholder="筛选关系类型" aria-label="筛选关系类型" clearable>
          <template #prefix>
            <svg class="relations-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          </template>
        </sdk-input>
        <span v-if="countText" class="relations-count">{{ countText }}</span>
      </div>
      <div class="relations-table-host">
        <projection slot="catalogue" @choose="open">
          <template #empty>
            <sdk-empty description="未找到关系类型"></sdk-empty>
          </template>
        </projection>
      </div>
    </div>

    <!-- Create relation dialog. -->
    <sdk-dialog v-model="createDialog" title="新建关系类型" width="540px" append-to-body destroy-on-close>
      <div class="relations-create-body">
        <projection v-if="createDialog" slot="form" @saved="onSaved" @discarded="onDiscarded" @cancel="cancelCreate"></projection>
      </div>
    </sdk-dialog>
  </section>
</div>
