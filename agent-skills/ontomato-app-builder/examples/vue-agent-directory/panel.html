<style>
  .agent-directory { display: flex; flex-direction: column; gap: 1rem; }
  .agent-directory-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1rem; }
  .agent-directory-detail { display: flex; flex-direction: column; gap: 1rem; }
  @media (max-width: 42rem) {
    .agent-directory-body { grid-template-columns: minmax(0, 1fr); }
  }
</style>
<div id="app">
  <section class="agent-directory">
    <div><button type="button" @click="newAgent">New agent</button></div>
    <div class="agent-directory-body">
      <projection slot="list" @update:selected="mode = 'view'"></projection>
      <div class="agent-directory-detail">
        <template v-if="mode === 'view'">
          <template v-if="selected">
            <projection slot="detail"></projection>
            <div><button type="button" @click="mode = 'edit'">Edit</button></div>
          </template>
          <p v-else>Select an agent or create one.</p>
        </template>
        <projection slot="form" v-show="mode === 'edit'"
          @saved="mode = 'view'" @discarded="mode = 'view'"></projection>
      </div>
    </div>
  </section>
</div>
