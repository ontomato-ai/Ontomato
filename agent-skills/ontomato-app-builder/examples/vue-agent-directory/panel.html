<style>
  .agent-directory { display: flex; flex-direction: column; height: 100%; min-height: 24rem; }
  .agent-directory-body { display: grid; flex: 1; min-height: 0; grid-template-columns: minmax(0, var(--pane-list-width, 300px)) minmax(0, 1fr); }
  .agent-directory-body.is-narrow { grid-template-columns: minmax(0, 1fr); }
  .agent-directory-list, .agent-directory-detail { min-height: 0; overflow: auto; padding: var(--spacing-md); }
  .agent-directory-body:not(.is-narrow) .agent-directory-list { border-right: 1px solid var(--ui-divider); }
  .agent-directory-detail { display: flex; flex-direction: column; gap: var(--spacing-md); }
  .agent-directory-actions { display: flex; gap: var(--spacing-sm); }
  .agent-directory-empty { margin: 0; color: var(--sdk-text-color-secondary); }
</style>
<div id="app">
  <section ref="rootRef" class="agent-directory">
    <div class="agent-directory-body" :class="{ 'is-narrow': narrow }">
      <div class="agent-directory-list" v-show="!narrow || !hasDetail">
        <projection slot="list" @update:selected="onSelected"></projection>
      </div>
      <div class="agent-directory-detail" v-show="!narrow || hasDetail">
        <div v-if="narrow && hasDetail" class="agent-directory-actions">
          <sdk-button size="small" @click="back">{{ t("action.back") }}</sdk-button>
        </div>
        <template v-if="!editing && !creating">
          <template v-if="selected">
            <projection slot="detail"></projection>
            <div class="agent-directory-actions">
              <sdk-button type="primary" @click="editing = true">{{ t("action.edit") }}</sdk-button>
            </div>
          </template>
          <p v-else class="agent-directory-empty">{{ t("empty.prompt") }}</p>
        </template>
        <projection slot="form" v-show="editing || creating"
          @saved="closeEditor" @discarded="closeEditor"></projection>
      </div>
    </div>
  </section>
</div>
