name: Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        id: builder
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cold-download Maven on the Java runner
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-wrapper-probe
        run: ./mvnw --version
      - name: Cold-download Maven in the Data Engine builder
        if: ${{ !cancelled() && steps.builder.outcome == 'success' }}
        run: |
          context=$(mktemp -d)
          cp -R mvnw .mvn "$context/"
          jdk_image=$(sed -n 's/^ARG JDK_IMAGE=//p' docker/data-engine/Dockerfile)
          docker buildx build --progress=plain --no-cache --build-arg "JDK_IMAGE=$jdk_image" -f - "$context" <<'DOCKERFILE'
          ARG JDK_IMAGE
          FROM ${JDK_IMAGE}
          COPY mvnw ./
          COPY .mvn ./.mvn
          RUN ./mvnw --version
          DOCKERFILE
