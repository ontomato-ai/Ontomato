name: Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APACHE_RELEASES: https://repository.apache.org/content/repositories/releases

jobs:
  maven-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        id: builder
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cold-download Maven on the Java runner
        run: |
          if MAVEN_USER_HOME="$RUNNER_TEMP/maven-wrapper-central" ./mvnw --version; then
            echo 'Maven Central ZIP exit=0'
          else
            echo "Maven Central ZIP exit=$?"
          fi
          MAVEN_USER_HOME="$RUNNER_TEMP/maven-wrapper-apache" MVNW_REPOURL="$APACHE_RELEASES" ./mvnw --version
      - name: Cold-download Maven in the Data Engine builder
        if: ${{ !cancelled() && steps.builder.outcome == 'success' }}
        run: |
          context=$(mktemp -d)
          cp -R mvnw .mvn "$context/"
          jdk_image=$(sed -n 's/^ARG JDK_IMAGE=//p' docker/data-engine/Dockerfile)
          probe() {
          docker buildx build --progress=plain --no-cache --build-arg "JDK_IMAGE=$jdk_image" --build-arg "MVNW_REPOURL=$1" -f - "$context" <<'DOCKERFILE'
          ARG JDK_IMAGE
          FROM ${JDK_IMAGE}
          ARG MVNW_REPOURL
          COPY mvnw ./
          COPY .mvn ./.mvn
          RUN ./mvnw --version
          DOCKERFILE
          }
          if probe ''; then
            echo 'Maven Central TAR.GZ exit=0'
          else
            echo "Maven Central TAR.GZ exit=$?"
          fi
          probe "$APACHE_RELEASES"
