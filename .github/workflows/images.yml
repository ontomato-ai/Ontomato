name: Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-http:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Record HTTP responses from runner and Data Engine builder
        run: |
          context=$(mktemp -d)
          cat > "$context/probe.sh" <<'SCRIPT'
          set -eu
          for artifact in             org/springframework/boot/spring-boot-starter-parent/3.5.0/spring-boot-starter-parent-3.5.0.pom             org/springframework/boot/spring-boot-autoconfigure/3.5.0/spring-boot-autoconfigure-3.5.0.jar             ch/qos/logback/logback-classic/1.5.18/logback-classic-1.5.18.jar
          do
            for repository in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2
            do
              printf '%s/%s\n' "$repository" "$artifact"
              curl -sS --max-time 20 -D /tmp/ontomato-headers -o /tmp/ontomato-artifact "$repository/$artifact"
              awk 'tolower($0) ~ /^(http\/|cf-ray:|retry-after:)/ {print}' /tmp/ontomato-headers
              if grep -q '^HTTP/[^ ]* 200 ' /tmp/ontomato-headers; then
                sha256sum /tmp/ontomato-artifact
              fi
            done
          done
          SCRIPT
          sh "$context/probe.sh"
          jdk_image=$(sed -n 's/^ARG JDK_IMAGE=//p' docker/data-engine/Dockerfile)
          docker buildx build --progress=plain --no-cache --build-arg "JDK_IMAGE=$jdk_image" -f - "$context" <<'DOCKERFILE'
          ARG JDK_IMAGE
          FROM ${JDK_IMAGE}
          COPY probe.sh /tmp/probe.sh
          RUN sh /tmp/probe.sh
          DOCKERFILE
