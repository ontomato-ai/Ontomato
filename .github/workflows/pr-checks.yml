name: Checks

# Changes to develop and main are checks, never publications: they run the
# repository's own Node and Java checks plus the offline delivery check, and
# touch no private resource. Pull requests into those branches run the same
# checks, so a feature branch is verified before it lands.

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop", "main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the agent runtime
        run: pnpm typecheck:runtime

      - name: Typecheck the workbench
        run: pnpm typecheck:workbench

      - name: Typecheck the workbench web entry
        run: pnpm --filter @ontomato/workbench typecheck:web

      - name: Test the workbench
        run: pnpm test:workbench

      - name: Test the scripts
        run: pnpm test:scripts

      - name: Typecheck the UI and the manager
        run: pnpm --filter @ontomato/workbench-ui --filter @ontomato/ontology-manager --filter @ontomato/ontology-manager-app --filter @ontomato/agent-shell-ui --filter @ontomato/service-logging typecheck

      - name: Test the UI, the manager, the shell and the logging contract
        run: pnpm --filter @ontomato/workbench-ui --filter @ontomato/ontology-manager --filter @ontomato/ontology-manager-app --filter @ontomato/agent-shell-ui --filter @ontomato/service-logging test

      - name: Check offline delivery
        run: |
          python3 -B scripts/offline-mirror-test.py
          python3 -B scripts/deploy-runtime_test.py

  # The runtime's own suites include HTTP/PG/process integration; a service
  # container supplies the database so they run instead of skipping.
  runtime:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ontomato
          POSTGRES_PASSWORD: ontomato
          POSTGRES_DB: ontomato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ontomato -d ontomato"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RUNTIME_TEST_DATABASE_URL: postgres://ontomato:ontomato@127.0.0.1:5432/ontomato
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the agent runtime
        run: pnpm test:runtime

      # The worker drops to a per-session UID, so this proof needs root; the suite
      # skips itself for anyone else and says so in its name. sudo resets PATH,
      # which would hide the node installed by setup-node.
      #
      # The worker also has to reach the runtime's own source from its new UID,
      # which the workspace checkout is not set up for: /home/runner is 0750. A
      # deployment installs the runtime world-readable under /app, so granting
      # traversal here reproduces that premise rather than relaxing an assertion.
      - name: Test the Linux sandbox as root
        run: |
          sudo chmod o+x /home/runner
          sudo chmod -R o+rX "$PWD"
          sudo env "PATH=$PATH" "RUNTIME_TEST_DATABASE_URL=$RUNTIME_TEST_DATABASE_URL" pnpm --filter @ontomato/agent-runtime exec vitest run src/__tests__/sandbox-linux.test.ts

  # Java tests were compiled by the image build but never executed. The core
  # suites need PostgreSQL; the adapter suites bring their own containers.
  java:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ontomato
          POSTGRES_PASSWORD: ontomato
          POSTGRES_DB: ontomato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ontomato -d ontomato"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONTOMATO_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/ontomato
      ONTOMATO_TEST_PG_USER: ontomato
      ONTOMATO_TEST_PG_PASSWORD: ontomato
      ONTOMATO_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/ontomato
      ONTOMATO_TEST_POSTGRES_USER: ontomato
      ONTOMATO_TEST_POSTGRES_PASSWORD: ontomato
      RUNTIME_TEST_DATABASE_URL: postgres://ontomato:ontomato@127.0.0.1:5432/ontomato
      STARTUP_TEST_DATABASE_URL: postgres://ontomato:ontomato@127.0.0.1:5432/ontomato
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # RuntimeFunctionIntegrationTest starts the real runtime process through the
      # workspace's tsx loader, so the JS dependencies are part of this job's inputs.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The retrieval contract test writes the wire its consumer must accept.
      - name: Test the Java reactor
        env:
          ONTOLOGY_HOST_CONTRACT_OUTPUT: ${{ runner.temp }}/ontology-host-contract.json
        run: ./mvnw -B -ntp test

      - uses: actions/upload-artifact@v4
        with:
          name: ontology-host-contract
          path: ${{ runner.temp }}/ontology-host-contract.json

  # The shared shell must accept the projection the Java host actually emits,
  # so this runs the Node side against the file the Java job just wrote.
  ontology-wire:
    needs: java
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ontology-host-contract
          path: ${{ runner.temp }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the Java-to-shell wire contract
        env:
          ONTOLOGY_HOST_CONTRACT_OUTPUT: ${{ runner.temp }}/ontology-host-contract.json
        run: pnpm --filter @ontomato/workbench-server exec vitest run src/services/assistant/__tests__/ontology-wire.test.ts
