name: Checks

# Branch image workflows call these checks once before publishing. Pull requests
# and manual validation run the same source checks without publishing images.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ["develop", "stable", "main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint:workbench
          pnpm lint:runtime
          pnpm lint:scripts

      - name: Typecheck
        run: |
          pnpm typecheck:runtime
          pnpm typecheck:workbench
          pnpm --filter @ontomato/workbench typecheck:web
          pnpm --filter @ontomato/foundation-ui --filter @ontomato/workbench-ui --filter @ontomato/ontology-manager --filter @ontomato/platform-admin --filter @ontomato/agent-shell-ui --filter @ontomato/service-logging --filter @ontomato/apps-sdk --filter @ontomato/platform-web typecheck

      - name: Test
        run: |
          pnpm test:runtime
          pnpm test:workbench
          pnpm --filter @ontomato/workbench test:web
          pnpm --filter @ontomato/foundation-ui --filter @ontomato/workbench-ui --filter @ontomato/ontology-manager --filter @ontomato/platform-admin --filter @ontomato/agent-shell-ui --filter @ontomato/service-logging --filter @ontomato/design-tokens --filter @ontomato/markdown --filter @ontomato/platform-schedules --filter @ontomato/platform-shell --filter @ontomato/platform-web test
          pnpm --filter @ontomato/platform-web test
          pnpm test:scripts

      - name: Check offline delivery
        run: |
          python3 -B scripts/offline-mirror-test.py
          python3 -B scripts/deploy-runtime_test.py

  # The workbench integration tests and Java contract and permission-boundary
  # tests share this job's PostgreSQL service. The Java adapter contract suites
  # (Testcontainers), process suites and full reactor stay on demand with `./mvnw test`.
  java:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ontomato
          POSTGRES_PASSWORD: ontomato
          POSTGRES_DB: ontomato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ontomato -d ontomato"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ONTOMATO_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/ontomato
      ONTOMATO_TEST_POSTGRES_USER: ontomato
      ONTOMATO_TEST_POSTGRES_PASSWORD: ontomato
      RUNTIME_TEST_DATABASE_URL: postgres://ontomato:ontomato@127.0.0.1:5432/ontomato
      STARTUP_TEST_DATABASE_URL: postgres://ontomato:ontomato@127.0.0.1:5432/ontomato
      ONTOLOGY_HOST_CONTRACT_OUTPUT: ${{ runner.temp }}/ontology-host-contract.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: |
          npm install --global pnpm@9.15.9
          pnpm install --frozen-lockfile

      - name: Test workbench server integration
        run: pnpm --filter @ontomato/workbench-server test:integration

      - name: Test workbench web integration
        run: pnpm --filter @ontomato/workbench test:web:integration

      - name: Install Python HTTP helper dependency
        run: python3 -m pip install requests==2.32.5

      - name: Test the Java contract and boundary group
        run: |
          maven_repo_url=$(cat .github/maven-wrapper-repo-url)
          MVNW_REPOURL="$maven_repo_url" ./mvnw -B -ntp -s .github/maven-settings.xml -Pcontract test

      - name: Verify Java's ontology host response against the web contract
        run: pnpm --filter @ontomato/workbench-server exec vitest run src/services/assistant/__tests__/ontology-wire.integration.test.ts

      # Match docker/workbench/Dockerfile and the public branch image build facts.
      - name: Build the apps SDK
        working-directory: apps/workbench
        env:
          APPS_SDK_BUILD: '{"release":false,"product":"ontomato"}'
        run: pnpm build:sdk
