name: Enterprise compatibility

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Expected pull request head SHA
        required: true
        type: string

permissions: {}

jobs:
  forward:
    # GitHub runs pull_request_target from the default branch.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch enterprise compatibility on develop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh workflow run enterprise-compatibility.yml
          --repo "$GITHUB_REPOSITORY" --ref develop
          --raw-field "pr_number=$PR_NUMBER" --raw-field "head_sha=$HEAD_SHA"

  bridge:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop' &&
      github.ref_protected
    runs-on: ubuntu-24.04
    environment: enterprise-pr-compat-develop
    timeout-minutes: 13
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: enterprise-pr-compat-${{ inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Report enterprise compatibility
        run: node scripts/ci-enterprise-compatibility.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLAB_ENTERPRISE_TRIGGER_TOKEN: ${{ secrets.GITLAB_ENTERPRISE_TRIGGER_TOKEN }}
          GITLAB_ENTERPRISE_READ_API_TOKEN: ${{ secrets.GITLAB_ENTERPRISE_READ_API_TOKEN }}
